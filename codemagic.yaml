# Pira Ziman · Cloud-Builds mit Codemagic (https://codemagic.io), damit iOS ohne eigenen Mac geht.
# Einrichtung Schritt für Schritt: docs/STORE.md. Die Namen in < > sind die, die du in Codemagic anlegst.
workflows:
  ios-release:
    name: iOS → TestFlight / App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Pira Ziman ASC          # API-Schlüssel aus App Store Connect, in Codemagic unter Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.seran2409.piraziman
      vars:
        APP_STORE_APPLE_ID: "<Apple ID der App, Zahl aus App Store Connect → App-Informationen>"
      node: 22
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'app-v*'
    scripts:
      - name: Web-App in die App kopieren
        script: |
          pip3 install --quiet pillow
          cd native
          npm ci
          python3 tools/prepare_www.py
          npx cap sync ios
      - name: Signierung einrichten
        script: xcode-project use-profiles
      - name: Build-Nummer erhöhen
        script: |
          cd native/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: IPA bauen
        script: xcode-project build-ipa --project native/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false               # Einreichen zur Prüfung machst du selbst in App Store Connect

  android-release:
    name: Android → Google Play (interner Test)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      android_signing:
        - pira_upload_key                        # Upload-Schlüssel, in Codemagic unter Code signing identities
      groups:
        - google_play                            # enthält GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      node: 22
      java: 21
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'app-v*'
    scripts:
      - name: Web-App in die App kopieren
        script: |
          pip3 install --quiet pillow
          cd native
          npm ci
          python3 tools/prepare_www.py
          npx cap sync android
      - name: App-Bundle bauen
        script: |
          cd native/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew bundleRelease
    artifacts:
      - native/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
