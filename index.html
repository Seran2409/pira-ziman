<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pira Ziman · Kurmancî lernen</title>
<meta name="description" content="Kurmancî (Nordkurdisch) lernen von A1 bis C2, mit Schwerpunkt auf der Sprache in Amed (Diyarbakır) und Êlih (Batman): Lektionen, Karteikarten, Verbtrainer, Lesetexte, natürliche Aussprache zu jedem Wort und ein Aussprache-Trainer mit Aufnahme.">
<meta name="theme-color" content="#D0202A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: Ala Rengîn – the Kurdish flag. Red, white and green as the frame, the golden 21-ray sun (Roj) marks rewards and the daily goal. Sidebar (desktop) / bottom bar (phone). The ten-arched bridge of Amed is the progress meter. */
:root{
  --flag-red:#ED2024; --flag-white:#FFFFFF; --flag-green:#278E43; --flag-sun:#FEBD11;
  --bg:#F7F7F4; --surface:#FFFFFF; --sunk:#EFF1ED; --ink:#141A16; --muted:#5B655F; --line:#E2E6E1; --edge:#D2D8D1;
  --hinar:#D0202A; --hinar-soft:#FCE4E4; --on-hinar:#FFFFFF;
  --dicle:#1A7A3A; --dicle-soft:#DCF0E2;
  --roj:#F5B300; --roj-soft:#FFF1C7; --roj-ink:#8A6100;
  --ok:#1A7A3A; --ok-soft:#DCF0E2; --bad:#C2410C; --bad-soft:#FBE3D6;
  --shadow:0 1px 2px rgba(20,26,22,.06),0 8px 24px rgba(20,26,22,.06);
  --shade:linear-gradient(transparent,transparent);
  --glass:color-mix(in srgb,var(--surface) 74%,transparent); --glass-line:color-mix(in srgb,var(--line) 75%,transparent);
  --w-red:#FFEBE9; --w-red-line:#FFC6C1; --w-red-edge:#F3A9A2;
  --w-sun:#FFF5D6; --w-sun-line:#F6DC8A; --w-sun-edge:#E8C55C;
  --w-green:#E6F6EA; --w-green-line:#B6E2C3; --w-green-edge:#8FCDA2;
  --w-shadow:0 3px 0 var(--edge);
  --btn-red:#E3232B; --btn-red-edge:#A3141B; --btn-red-glow:transparent; --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#FFFFFF;
  --font-display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#181E1A; --sunk:#222A25; --ink:#ECF1EE; --muted:#9DA9A2; --line:#2D3731; --edge:#070908;
  --hinar:#FF6B6F; --hinar-soft:#3D1A1C; --on-hinar:#2A0708;
  --dicle:#4CC47A; --dicle-soft:#14301F;
  --roj:#FFC83D; --roj-soft:#3A2F10; --roj-ink:#FFC83D;
  --ok:#4CC47A; --ok-soft:#14301F; --bad:#F27A45; --bad-soft:#3B2216;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shade:linear-gradient(transparent,transparent);
  --glass:color-mix(in srgb,var(--surface) 70%,transparent); --glass-line:color-mix(in srgb,var(--line) 80%,transparent);
  --w-red:#2C1719; --w-red-line:#55252A; --w-red-edge:#160B0C;
  --w-sun:#2B2410; --w-sun-line:#584716; --w-sun-edge:#151107;
  --w-green:#14291C; --w-green-line:#235138; --w-green-edge:#09140D;
  --w-shadow:0 3px 0 var(--edge);
  --btn-red:#E8262E; --btn-red-edge:#8A0E14; --btn-red-glow:transparent; --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#06210F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#181E1A; --sunk:#222A25; --ink:#ECF1EE; --muted:#9DA9A2; --line:#2D3731; --edge:#070908;
  --hinar:#FF6B6F; --hinar-soft:#3D1A1C; --on-hinar:#2A0708;
  --dicle:#4CC47A; --dicle-soft:#14301F;
  --roj:#FFC83D; --roj-soft:#3A2F10; --roj-ink:#FFC83D;
  --ok:#4CC47A; --ok-soft:#14301F; --bad:#F27A45; --bad-soft:#3B2216;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shade:linear-gradient(transparent,transparent);
  --glass:color-mix(in srgb,var(--surface) 70%,transparent); --glass-line:color-mix(in srgb,var(--line) 80%,transparent);
  --w-red:#2C1719; --w-red-line:#55252A; --w-red-edge:#160B0C;
  --w-sun:#2B2410; --w-sun-line:#584716; --w-sun-edge:#151107;
  --w-green:#14291C; --w-green-line:#235138; --w-green-edge:#09140D;
  --w-shadow:0 3px 0 var(--edge);
  --btn-red:#E8262E; --btn-red-edge:#8A0E14; --btn-red-glow:transparent; --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#06210F; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--shade)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:750}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
a{color:var(--dicle)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dicle);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--muted)}
.eyebrow{font:600 .72rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ku{font-weight:650}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.side{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-right-color:var(--glass-line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font:800 1.25rem/1 var(--font-display);letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.nav a span{display:flex;flex-direction:column;line-height:1.15}
.nav a em{font-style:normal;font-size:.74rem;color:var(--muted)}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--hinar-soft);color:var(--hinar);font-weight:650}
.nav a[aria-current="page"] em{color:var(--hinar)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 8px}
.main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 96px;min-width:0}
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head p{color:var(--muted);max-width:62ch}
.bottom{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:18px 110px}
  .bottom{display:flex;position:fixed;left:max(12px,calc(50% - 300px));right:max(12px,calc(50% - 300px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;padding:6px;border-radius:28px;background:var(--surface);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--glass-line);box-shadow:0 10px 32px -6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.25)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.7rem;text-decoration:none;color:var(--muted);border-radius:22px;transition:background .2s,color .2s}
  .bottom a[aria-current="page"]{color:var(--hinar);background:color-mix(in srgb,var(--hinar-soft) 85%,transparent);font-weight:650}
  .bottom svg{width:22px;height:22px}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card{background:color-mix(in srgb,var(--surface) 88%,transparent);border-color:var(--glass-line);box-shadow:var(--w-shadow);border-radius:18px}
.panel{background:var(--sunk);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.lv{font-family:var(--font-mono);background:var(--dicle-soft);color:var(--dicle)}
.pill.hot{background:var(--hinar-soft);color:var(--hinar)}
.pill.gold{background:var(--roj-soft);color:var(--roj-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .08s ease,background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--hinar);border-color:var(--hinar);color:var(--on-hinar)}
.btn.primary{background:var(--btn-red);border-color:transparent;color:var(--on-btn);text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 8px 20px -8px var(--btn-red-glow),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover{filter:brightness(1.07) saturate(1.1)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 4px 12px -6px var(--btn-red-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.big{padding:14px 22px;font-size:1.05rem;border-radius:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:9px}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.greet{font:800 clamp(2.2rem,6vw,3.6rem)/1 var(--font-display);letter-spacing:-.03em}
.greet span{color:var(--hinar)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:750 1.55rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}
.ring{--p:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--roj) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring i{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:750 1rem/1.1 var(--font-display);font-style:normal;text-align:center}
.ring i small{display:block;font:500 .66rem var(--font-body);color:var(--muted)}

/* Bridge */
.bridge-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bridge{width:100%;min-width:540px;height:auto;display:block}
.bridge .arch{fill:var(--sunk);stroke:var(--line);stroke-width:1.5;transition:fill .6s}
.bridge .arch.on{fill:var(--hinar)}
.bridge .arch.half{fill:var(--hinar-soft)}
.bridge .deck{fill:var(--ink)}
.bridge .water{fill:var(--dicle);opacity:.18}
.bridge .wave{fill:none;stroke:var(--dicle);stroke-width:1.5;opacity:.5}
.bridge text{font:600 11px var(--font-mono);fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bridge .wave{animation:drift 6s linear infinite}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}

/* Path */
.level{display:flex;flex-direction:column;gap:12px}
.level-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.level-head h2{font-size:1.6rem}
.level-head .lv-code{font:800 2.2rem/1 var(--font-display);color:var(--hinar)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.lesson{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.lesson:hover{border-color:var(--hinar)}
.lesson .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .9rem var(--font-mono);background:var(--sunk);flex:none}
.lesson.done .num{background:var(--hinar);color:var(--on-hinar)}
.lesson.locked{opacity:.55;cursor:not-allowed}
.lesson.locked:hover{border-color:var(--line)}
.lesson.next{border-color:var(--hinar);box-shadow:0 0 0 3px var(--hinar-soft)}
.lesson .t{font-weight:650;line-height:1.25}
.lesson .s{font-size:.82rem;color:var(--muted)}
.stars{color:var(--roj-ink);font-size:.85rem;letter-spacing:1px;white-space:nowrap}

/* Lesson player overlay */
.player{position:fixed;inset:0;z-index:50;background:var(--shade),var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.player-top{display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,32px);max-width:860px;width:100%;margin:0 auto}
.bar{flex:1;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hinar);border-radius:99px;transition:width .35s ease}
.player-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.player-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.player-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.player-foot .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.player-foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.player-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{flex:1;min-width:200px}
.fb b{font-family:var(--font-display);font-size:1.15rem}
.player-foot.ok .fb b{color:var(--ok)}
.player-foot.bad .fb b{color:var(--bad)}
.combo{font:700 .85rem var(--font-mono);color:var(--roj-ink);white-space:nowrap}
.prompt{font:750 clamp(1.3rem,3.4vw,1.75rem)/1.25 var(--font-display)}
.prompt-sub{color:var(--muted)}
.theory{line-height:1.65}
.theory h4{font-size:1.05rem;margin:14px 0 6px}
.theory p{margin:0 0 10px;max-width:68ch}
.theory ul{margin:0 0 10px;padding-left:20px}
.tbl{overflow-x:auto;margin:6px 0 12px}
.tbl table{border-collapse:collapse;min-width:100%;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.ex{background:var(--sunk);border-radius:10px;padding:10px 14px;margin:6px 0 12px}
.ex div{display:flex;gap:10px;flex-wrap:wrap}
.ex .k{font-weight:650}
.ex .d{color:var(--muted)}
.dialect{border:1.5px dashed var(--dicle);border-radius:12px;padding:12px 14px;background:var(--dicle-soft)}
.dialect .eyebrow{color:var(--dicle)}

/* morphology colouring */
.m-pre{color:var(--dicle);font-weight:700}
.m-end{color:var(--hinar);font-weight:700}
.m-erg{color:var(--roj-ink);font-weight:700}

/* Vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.vcard .k{font:700 1.12rem var(--font-display)}
.vcard .ph{font:500 .74rem var(--font-mono);color:var(--muted)}
.vcard .tip{font-size:.8rem;color:var(--dicle)}
.dialog{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--font-mono);flex:none;background:var(--dicle-soft);color:var(--dicle)}
.line.b .who{background:var(--hinar-soft);color:var(--hinar)}
.line .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.line .tr{font-size:.85rem;color:var(--muted)}

/* Exercises */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-size:1.02rem;font-weight:600;display:flex;gap:10px;align-items:center}
.choice kbd{font:600 .72rem var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.choice:hover{border-color:var(--dicle)}
.choice.sel{border-color:var(--dicle);background:var(--dicle-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer-line{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:11px;padding:7px 13px;font-weight:650;cursor:pointer;font-size:1rem}
.tile:hover{border-color:var(--dicle)}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pair{background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;font-weight:600;text-align:center;overflow-wrap:anywhere}
.pair.sel{border-color:var(--dicle);background:var(--dicle-soft)}
.pair.done{opacity:.35;cursor:default;border-color:var(--ok)}
.pair.shake{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inp{width:100%;font:600 1.15rem var(--font-body);padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--dicle);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{min-width:40px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:700 1rem var(--font-body);cursor:pointer}
.keys button:hover{background:var(--sunk)}
.gapsent{font:650 1.3rem/1.6 var(--font-display)}
.gapsent .gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--dicle);text-align:center;color:var(--dicle);padding:0 6px}
.result{text-align:center;align-items:center}
.result .big{font:800 3.4rem/1 var(--font-display);color:var(--hinar)}

/* Flashcards */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;box-shadow:var(--shadow)}
.flash .front{font:800 clamp(1.8rem,5vw,2.6rem)/1.1 var(--font-display)}
.flash .back{font-size:1.2rem;font-weight:600}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}

    <p>Nach Vokal mit y: <span class="ku">bira<b>yê</b> min</span>, <span class="ku">çira<b>ya</b> sor</span>. Ketten sind möglich: <span class="ku">mala bavê min</span> (das Haus meines Vaters). Die <b>freie Ezafe</b> <span class="ku">yê / ya / yên</span> steht allein: <span class="ku">Ev pirtûk ya min e.</span> (Dieses Buch ist meins.) <span class="ku">bajarê Amedê yê kevn</span> (die Altstadt von Amed).</p>` },
  { id: 'oblique', title: 'Der Oblique-Fall', lv: 'A2', html: `${T(['', 'Endung', 'Beispiel'], [['weiblich Sg.', '-ê', 'li mal<b>ê</b> (zu Hause), ji Amed<b>ê</b> (aus Amed)'], ['männlich Sg.', '-î (oft weggelassen)', 'li vî gund<b>î</b> (in diesem Dorf)'], ['Plural', '-an', 'bi heval<b>an</b> re (mit Freunden)'], ['unbest. m./f.', '-ekî / -ekê', 'li gund<b>ekî</b>, bi jin<b>ekê</b> re']])}
    <p><b>Wann?</b> Nach Präpositionen, als Besitzer in der Ezafe, als Ziel nach Bewegungsverben (<span class="ku">ez diçim malê</span>), als Objekt im Präsens und als Subjekt transitiver Verben in der Vergangenheit.</p>
    <p><b>Demonstrativ:</b> <span class="ku">ev/ew</span> (dieser/jener) werden zu <span class="ku">vî/wî</span> (m.), <span class="ku">vê/wê</span> (f.), <span class="ku">van/wan</span> (Pl.).</p>
    <p><b>Stammvokal-Hebung:</b> Bei vielen männlichen Wörtern wird a im Oblique zu ê: <span class="ku">bajar → ji bajêr</span>, <span class="ku">welat → li welêt</span>, <span class="ku">ziman → bi zimên</span>. Das hörst du in Amed häufig.</p>` },
  { id: 'daçek', title: 'Präpositionen', lv: 'A1–A2', html: `${T(['Kurmancî', 'Bedeutung', 'Beispiel'], [['li', 'in, an, bei (Ort)', 'li Êlihê'], ['ji', 'von, aus', 'ji Amedê'], ['bi', 'mit (Mittel)', 'bi otobusê'], ['bi … re', 'zusammen mit', 'bi min re'], ['di … de', 'in, drinnen', 'di malê de'], ['ji … re', 'für, an (Empfänger)', 'ji te re'], ['ji bo', 'für', 'ji bo zarokan'], ['li ser', 'auf, über', 'li ser masê'], ['li ber', 'vor', 'li ber derî'], ['li bin', 'unter', 'li bin darê'], ['li pişt', 'hinter', 'li pişt malê'], ['li cem / li nik', 'bei jemandem', 'li cem diya min'], ['ber bi … ve', 'in Richtung', 'ber bi Dîcleyê ve'], ['heta', 'bis', 'heta sibê'], ['bê', 'ohne', 'bê şekir'], ['berî / piştî', 'vor / nach (Zeit)', 'piştî nîvro']])}
    <p><b>Verschmelzungen</b> mit „ihm/ihr/es“: <span class="ku">ji + wî → jê</span>, <span class="ku">bi + wî → pê</span>, <span class="ku">li + wî → lê</span>, <span class="ku">di + wî → tê</span>. Beispiel: <span class="ku">Ez jê hez dikim.</span> (Ich mag ihn/sie/es.)</p>` },
  { id: 'dem', title: 'Die Zeiten im Überblick', lv: 'A1–B1', html: `${T(['Zeit', 'intransitiv (çûn)', 'transitiv (xwarin)'], [['Präsens', 'ez <span class="m-pre">di</span>çim', 'ez nan <span class="m-pre">di</span>xwim'], ['verneint', 'ez <span class="m-pre">na</span>çim', 'ez nan <span class="m-pre">na</span>xwim'], ['Subjunktiv', '(ku) ez <span class="m-pre">bi</span>çim', '(ku) ez <span class="m-pre">bi</span>xwim'], ['Futur', 'ez <span class="m-erg">ê</span> biçim', 'ez <span class="m-erg">ê</span> nan bixwim'], ['Imperativ', 'here! / herin!', 'bixwe! / bixwin!'], ['Vergangenheit', 'ez çûm', '<span class="m-erg">min</span> nan xwar'], ['Verlaufsform', 'ez <span class="m-pre">di</span>çûm', '<span class="m-erg">min</span> nan <span class="m-pre">di</span>xwar'], ['Perfekt', 'ez çûme', '<span class="m-erg">min</span> nan xwariye'], ['Plusquamperfekt', 'ez çûbûm', '<span class="m-erg">min</span> nan xwaribû'], ['Passiv', '–', 'nan <b>tê</b> xwarin / <b>hat</b> xwarin']])}
    <p>Viele Verben sind zusammengesetzt aus Nomen + Hilfsverb (<span class="ku">kirin, bûn, dan</span>): <span class="ku">hez kirin</span> (lieben), <span class="ku">fêr bûn</span> (lernen), <span class="ku">xeber dan</span> (sprechen). Nur das Hilfsverb wird konjugiert.</p>` },
  { id: 'ergatif', title: 'Ergativ einfach erklärt', lv: 'B1', html: `<p>In der Vergangenheit verhalten sich <b>transitive</b> Verben (mit Objekt) anders: Das Subjekt steht im <span class="m-erg">Oblique</span>, das Objekt in der Grundform, und das Verb richtet sich nach dem <b>Objekt</b>.</p>
    ${EX([['Ez hatim.', 'Ich kam. (intransitiv: alles normal)'], ['Min sêv xwar.', 'Ich aß den Apfel. (min = Oblique, Verb ohne Endung)'], ['Wê sêv xwarin.', 'Sie aß die Äpfel. (Plural-Endung wegen der Äpfel)'], ['Min tu dîtî.', 'Ich sah dich. (Endung -î passt zu tu)'], ['Te ez dîtim.', 'Du sahst mich. (Endung -im passt zu ez)']])}
    <p>Merksatz: <i>Präsens: wer handelt, bestimmt. Vergangenheit transitiv: wer betroffen ist, bestimmt.</i></p>` },
  { id: 'hejmar', title: 'Zahlen & Uhrzeit', lv: 'A1', html: `${T(['', '', '', ''], [['1 yek', '6 şeş', '11 yazdeh', '20 bîst'], ['2 du (didu)', '7 heft', '12 dazdeh', '30 sî'], ['3 sê (sisê)', '8 heşt', '13 sêzdeh', '40 çil'], ['4 çar', '9 neh', '15 pazdeh', '50 pêncî'], ['5 pênc', '10 deh', '19 nozdeh', '100 sed · 1000 hezar']])}
    <p>Zusammensetzen mit <b>û</b>: <span class="ku">bîst û pênc</span> (25). Vor Nomen: <span class="ku">du çay, sê nan</span>; allein: <span class="ku">didu, sisê</span>. Ordnungszahlen mit <b>-em</b>: <span class="ku">yekem, duyem, sêyem</span>. Uhrzeit: <span class="ku">Saet çend e? – Saet sê ye. Saet sê û nîv e.</span></p>` },
  { id: 'pirs', title: 'Fragewörter & Bindewörter', lv: 'A1–B1', html: `${T(['Fragewort', '', 'Bindewort', ''], [['kî', 'wer', 'û', 'und'], ['çi', 'was', 'an / yan', 'oder'], ['çawa', 'wie', 'lê / lêbelê', 'aber'], ['li ku / ku derê', 'wo', 'ji ber ku', 'weil'], ['ji ku', 'woher', 'ku', 'dass; der/die/das'], ['kengê', 'wann', 'heke / eger', 'wenn, falls'], ['çima', 'warum', 'dema ku', 'als, wenn (Zeit)'], ['çend', 'wie viele', 'da ku', 'damit'], ['çiqas', 'wie viel', 'lewma / loma', 'deshalb'], ['kîjan', 'welche/r', 'jî', 'auch (steht nach dem Wort!)']])}` },
  { id: 'peyvsazî', title: 'Wortbildung', lv: 'B2', html: `${T(['Baustein', 'Bedeutung', 'Beispiele'], [['-î', 'Sprache, Herkunft, Abstraktum', 'kurdî, almanî, xweşî (Freude)'], ['-tî / -ahî', 'Abstraktum', 'hevaltî (Freundschaft), dirêjahî (Länge)'], ['-dar', 'Besitzer von', 'dukandar (Ladenbesitzer)'], ['-van / -van', 'wer hütet, macht', 'pasvan (Wächter), şivan (Hirte)'], ['-ker / -kar', 'wer arbeitet', 'karker (Arbeiter), hevkar (Kollege)'], ['-mend', 'versehen mit', 'hunermend (Künstler/in)'], ['-geh / -xane', 'Ort', 'rawestgeh (Haltestelle), nexweşxane (Krankenhaus)'], ['-istan', 'Land, Ort von', 'gulistan (Rosengarten)'], ['bê-', 'ohne', 'bêkar (arbeitslos), bêdeng (still)'], ['ne-', 'un-, nicht', 'nexweş (krank), nebaş (schlecht)'], ['hev-', 'gemeinsam', 'hevdîtin (Treffen), hevkarî (Zusammenarbeit)']])}` },
  { id: 'herem', title: 'Amed & Êlih: regionale Färbung', lv: 'alle', html: `<p>Das Kurmancî um Amed (Diyarbakır) und Êlih (Batman) gehört zur südlichen Mitte des Sprachraums, zwischen Mêrdîn, Sêrt und Amed. Es liegt nah an der Schriftsprache, die auf dem Dialekt von Botan (Cizîr) beruht. Die Kurse nutzen die Standardschreibung und zeigen dir, was du im Alltag dort hörst.</p>
    ${T(['Merkmal', 'Standard', 'oft gehört in der Region'], [['„sprechen“', 'axaftin, peyivîn', '<b>xeber dan</b> (ez xeber didim)'], ['Präsens-Vorsilbe', 'ez dibêjim', 'ez d’bêjim; Richtung Mêrdîn oft ganz ohne di-'], ['unbestimmt', 'rojekê', 'Richtung Mêrdîn/Êlih auch roj<b>ik</b>ê'], ['Futur', 'ez ê biçim', 'ezê biçim / ezê herim; im Süden auch dê'], ['kehlige Laute', 'heft, Elî', 'deutlich gepresst: [ħeft], [ʕelî]'], ['Anrede', '–', '<b>lo</b> (zu Männern), <b>lê</b> (zu Frauen); Bavo! Dayê! Kuro! Keçê!']])}
    <p><b>Typische Wendungen:</b> <span class="ku">Mala te ava!</span> (Danke, wörtl. „Dein Haus möge blühen“), <span class="ku">Destê te sax be!</span> (Danke für das Essen/die Mühe), <span class="ku">Ser çavan!</span> (Sehr gern!), <span class="ku">Xêr e?</span> (Was ist los?), <span class="ku">Kerem bike!</span> (Bitte, bedien dich / komm herein), <span class="ku">Çi heye, çi tune?</span> (Was gibt’s Neues?).</p>
    <p><b>Türkische Einsprengsel</b> sind im Alltag häufig. Gut zu verstehen, besser zu ersetzen: <span class="ku">yanî → ango</span>, <span class="ku">ama → lê</span>, <span class="ku">zaten → jixwe</span>, <span class="ku">lazim e → pêwîst e / divê</span>, <span class="ku">hîç → qet</span>, <span class="ku">çok → pir / gelek</span>.</p>
    <p class="muted">Dialekte ändern sich von Dorf zu Dorf. Wenn deine Familie etwas anders sagt, ist das kein Fehler, sondern deine eigene Variante. Übernimm sie.</p>` }

{ id: 'a1-1', lv: 'A1', title: 'Silav!', sub: 'Begrüßen und sich vorstellen', goal: 'Du kannst grüßen, nach dem Befinden fragen und deinen Namen sagen.',
  th: `<p>Die einfachste Begrüßung ist <span class="ku">Silav!</span> (Hallo). Je nach Tageszeit sagst du <span class="ku">Rojbaş</span> (Guten Tag/Morgen), <span class="ku">Êvarbaş</span> (Guten Abend) oder <span class="ku">Şevbaş</span> (Gute Nacht).</p>
  <h4>Wie geht’s?</h4><p><span class="ku">Tu çawa yî?</span> heißt wörtlich „Du wie bist?“. Die Antwort: <span class="ku">Ez baş im, spas.</span> (Mir geht’s gut, danke.) Zu mehreren oder höflich: <span class="ku">Hûn çawa ne?</span></p>
  <h4>Der Name</h4><p><span class="ku">Navê te çi ye?</span> (Wie heißt du?, wörtl. „Dein Name was ist?“) – <span class="ku">Navê min Rojda ye.</span> <span class="ku">nav</span> ist mit dem deutschen „Name“ verwandt. Das <b>-ê</b> an <span class="ku">nav</span> verbindet es mit <span class="ku">min/te</span>, dazu mehr in Lektion 4.</p>
  <h4>Das Verb steht am Ende</h4><p><span class="ku">Ez baş im</span> = „Ich gut bin“. „Sein“ ist nur eine Endung: nach Konsonant <b>im/î/e</b>, nach Vokal <b>me/yî/ye</b>.</p>`,
  vocab: [['silav', 'hallo'], ['rojbaş', 'guten Tag / guten Morgen', 'roj = Tag, Sonne · baş = gut'], ['êvarbaş', 'guten Abend', 'êvar = Abend'], ['şevbaş', 'gute Nacht', 'şev = Nacht'], ['spas', 'danke'], ['çawa', 'wie'], ['baş', 'gut'], ['nav', 'Name', 'verwandt mit „Name“'], ['ez', 'ich', 'vgl. lateinisch „ego“'], ['tu', 'du', 'wie „du“'], ['erê', 'ja'], ['na', 'nein'], ['bi xatirê te', 'auf Wiedersehen (sagt, wer geht)'], ['bi xêr hatî', 'willkommen', 'wörtl. „mit Gutem bist du gekommen“'], ['çi', 'was'], ['kêfxweş', 'erfreut, froh']],
  dlg: [['A', 'Silav!', 'Hallo!'], ['B', 'Silav! Bi xêr hatî.', 'Hallo! Willkommen.'], ['A', 'Spas. Tu çawa yî?', 'Danke. Wie geht es dir?'], ['B', 'Ez baş im, spas. Tu çawa yî?', 'Mir geht es gut, danke. Wie geht es dir?'], ['A', 'Ez jî baş im. Navê te çi ye?', 'Mir geht es auch gut. Wie heißt du?'], ['B', 'Navê min Rojda ye. Navê te çi ye?', 'Ich heiße Rojda. Wie heißt du?'], ['A', 'Navê min Azad e.', 'Ich heiße Azad.'], ['B', 'Ez kêfxweş bûm, Azad!', 'Freut mich, Azad!'], ['A', 'Ez jî. Bi xatirê te!', 'Mich auch. Auf Wiedersehen!'], ['B', 'Oxir be!', 'Mach’s gut!']],
  s: [['Ez baş im.', 'Mir geht es gut.'], ['Tu çawa yî?', 'Wie geht es dir?'], ['Navê min Rojda ye.', 'Ich heiße Rojda.'], ['Navê te çi ye?', 'Wie heißt du?'], ['Ez jî baş im.', 'Mir geht es auch gut.'], ['Navê min Azad e.', 'Ich heiße Azad.']],
  g: [['Navê min Azad ___.', 'e', ['e', 'ye', 'im'], 'Nach Konsonant steht e.'], ['Navê min Rojda ___.', 'ye', ['ye', 'e', 'î'], 'Nach Vokal steht ye.'], ['Tu çawa ___?', 'yî', ['yî', 'im', 'e'], 'Nach Vokal wird î zu yî.'], ['Ez baş ___.', 'im', ['im', 'î', 'e'], 'ez … im'], ['Navê ___ çi ye?', 'te', ['te', 'tu', 'ez'], 'Nach der Ezafe steht die Oblique-Form: te.']],
  dia: `<p>In Amed hörst du auf „Spas“ oft <b>Ser çavan</b> (wörtl. „auf die Augen“, also: sehr gern). Statt „Tu çawa yî?“ fragen viele kurz <b>Çawa yî?</b> oder <b>Baş î?</b>. Wer geht, sagt <b>Bi xatirê te</b>, die Antwort ist <b>Oxir be</b> oder <b>Bi xêr biçî</b>.</p>` },

{ id: 'a1-2', lv: 'A1', title: 'Alfabe', sub: 'Buchstaben und Laute', goal: 'Du kannst jedes Wort richtig aussprechen.',
  th: `<p>Kurmancî schreibt man, wie man spricht. Jeder Buchstabe hat genau einen Laut. Die vollständige Tabelle findest du unter <a href="#grammar">Grammatik</a>.</p>
  <h4>Die Buchstaben mit Hut und Häkchen</h4>${T(['', 'klingt wie', 'Beispiel'], [['ç', 'tsch', 'çav (Auge)'], ['ş', 'sch', 'şev (Nacht)'], ['ê', 'langes e (See)', 'sêv (Apfel)'], ['î', 'langes i (Liebe)', 'şîr (Milch)'], ['û', 'langes u (Schuh)', 'dûr (fern)']])}
  <h4>Fallen für Deutschsprachige</h4><ul><li><b>i</b> ohne Dach ist ganz kurz und dumpf: <span class="ku">dil</span> (Herz).</li><li><b>e</b> ist ein kurzes ä: <span class="ku">dest</span> (Hand).</li><li><b>v</b> = deutsches w, <b>w</b> = englisches w: <span class="ku">av</span> (Wasser), <span class="ku">welat</span> (Land).</li><li><b>c</b> = dsch, <b>j</b> = weiches sch wie in „Garage“, <b>x</b> = ch wie in „Bach“, <b>q</b> = tiefes k.</li><li><b>z</b> ist ein summendes s: <span class="ku">zarok</span> (Kind).</li></ul>
  <h4>Betonung</h4><p>Meist liegt sie auf der letzten Silbe des Wortes: za<b>rok</b>, we<b>lat</b>, xwen<b>de</b>kar. Endungen wie <span class="ku">-ê, -a, -e</span> sind unbetont.</p>`,
  vocab: [['av', 'Wasser', 'v wie deutsches w'], ['çav', 'Auge', 'ç = tsch'], ['şev', 'Nacht', 'ş = sch'], ['xwarin', 'essen; Essen', 'xw = ch + englisches w'], ['qehwe', 'Kaffee', 'q = tiefes k'], ['jin', 'Frau', 'j wie in „Garage“'], ['cih', 'Ort, Platz', 'c = dsch'], ['dil', 'Herz', 'kurzes, dumpfes i'], ['şîr', 'Milch', 'î = langes i'], ['sêv', 'Apfel', 'ê = langes e'], ['dûr', 'fern, weit', 'û = langes u'], ['welat', 'Land, Heimat', 'w = englisches w'], ['roj', 'Tag; Sonne'], ['zarok', 'Kind', 'z summt'], ['ev', 'dies, das hier'], ['ew', 'das dort; er, sie'], ['peyv', 'Wort']],
  dlg: [['A', 'Ev çi ye?', 'Was ist das?'], ['B', 'Ev av e.', 'Das ist Wasser.'], ['A', 'Ev çi ye?', 'Was ist das?'], ['B', 'Ev sêv e.', 'Das ist ein Apfel.'], ['A', 'Û ev?', 'Und das?'], ['B', 'Ev şîr e. Ev jî qehwe ye.', 'Das ist Milch. Und das hier ist Kaffee.']],
  s: [['Ev av e.', 'Das ist Wasser.'], ['Ev çi ye?', 'Was ist das?'], ['Ev sêv e.', 'Das ist ein Apfel.'], ['Ev şîr e.', 'Das ist Milch.'], ['Ev qehwe ye.', 'Das ist Kaffee.'], ['Ew zarok e.', 'Das ist ein Kind.']],
  g: [['Wie „sch“ klingt: ___', 'ş', ['ş', 'ç', 's'], 'ş = sch, ç = tsch'], ['Wie „tsch“ klingt: ___', 'ç', ['ç', 'c', 'ş'], 'c ist dsch, ç ist tsch.'], ['„Wasser“ heißt ___.', 'av', ['av', 'aw', 'ab'], 'v wird wie deutsches w gesprochen.'], ['Langes i schreibt man ___.', 'î', ['î', 'i', 'y'], 'i ohne Dach ist kurz und dumpf.'], ['Ev qehwe ___.', 'ye', ['ye', 'e', 'im'], 'Nach Vokal: ye'], ['Ev sêv ___.', 'e', ['e', 'ye', 'yî'], 'Nach Konsonant: e']],
  dia: `<p>Im Süden, also auch in Amed und Êlih, werden kehlige Laute aus dem Arabischen deutlich gesprochen: <b>heft</b> (sieben) mit gepresstem h, <b>Elî</b> mit einem Knack in der Kehle. Manche schreiben dafür <b>ḧ</b> oder <b>‘</b>, im Standard bleibt es bei h und e. Für das „gurgelnde“ g in Lehnwörtern wie <b>xerîb</b> (fremd) sieht man gelegentlich <b>ẍ</b>.</p>` },

{ id: 'a1-3', lv: 'A1', title: 'Ez kî me?', sub: 'Sein, Herkunft und Berufe', goal: 'Du kannst sagen, wer du bist, woher du kommst und was du machst.',
  th: `<h4>Personalpronomen</h4>${T(['ich', 'du', 'er/sie/es', 'wir', 'ihr/Sie', 'sie'], [['ez', 'tu', 'ew', 'em', 'hûn', 'ew']])}<p>Kurmancî unterscheidet bei „er/sie“ nicht: <span class="ku">ew</span> ist beides und auch „sie“ (Plural).</p>
  <h4>„Sein“ als Endung</h4>${T(['', 'nach Konsonant', 'nach Vokal'], [['ez', 'ez kurd <b>im</b>', 'ez mamoste <b>me</b>'], ['tu', 'tu kurd <b>î</b>', 'tu mamoste <b>yî</b>'], ['ew', 'ew kurd <b>e</b>', 'ew mamoste <b>ye</b>'], ['em, hûn, ew', 'em kurd <b>in</b>', 'em mamoste <b>ne</b>']])}
  <h4>Verneinung und Fragen</h4><p><b>ne</b> steht vor dem Wort: <span class="ku">Ez ne bijîşk im.</span> (Ich bin kein Arzt.) Fragen erkennt man an der Stimme oder am Wörtchen <span class="ku">gelo</span>: <span class="ku">Gelo tu xwendekar î?</span></p>
  <h4>Woher?</h4><p><span class="ku">Tu ji ku yî?</span> – <span class="ku">Ez ji Amedê me.</span> Ortsnamen bekommen nach <span class="ku">ji</span> (aus) die Endung <b>-ê</b>.</p>`,
  vocab: [['ew', 'er, sie, es; sie (Pl.)'], ['em', 'wir'], ['hûn', 'ihr; Sie (höflich)'], ['xwendekar', 'Student/in, Schüler/in', 'xwendin (lesen) + -kar'], ['mamoste', 'Lehrer/in'], ['bijîşk', 'Arzt, Ärztin'], ['karker', 'Arbeiter/in', 'kar = Arbeit'], ['endezyar', 'Ingenieur/in'], ['kurd', 'Kurde, Kurdin; kurdisch'], ['alman', 'Deutsche/r; deutsch'], ['ji ku', 'woher'], ['ne', 'nicht (bei „sein“)'], ['gelo', 'Fragewort: ob, wohl'], ['kî', 'wer'], ['jî', 'auch (steht nach dem Wort)'], ['lê', 'aber'], ['ziman', 'Sprache; Zunge'], ['kurmancî', 'Kurmancî (Sprache)']],
  dlg: [['A', 'Tu ji ku yî?', 'Woher kommst du?'], ['B', 'Ez ji Amedê me. Tu ji ku yî?', 'Ich bin aus Amed. Und du?'], ['A', 'Ez ji Almanyayê me, lê bavê min ji Êlihê ye.', 'Ich bin aus Deutschland, aber mein Vater ist aus Êlih.'], ['B', 'Tu xwendekar î?', 'Bist du Student?'], ['A', 'Na, ez ne xwendekar im. Ez endezyar im. Tu?', 'Nein, ich bin kein Student. Ich bin Ingenieur. Und du?'], ['B', 'Ez mamoste me.', 'Ich bin Lehrerin.']],
  s: [['Ez kurd im.', 'Ich bin Kurde.'], ['Ez ji Amedê me.', 'Ich bin aus Amed.'], ['Tu xwendekar î?', 'Bist du Student?'], ['Ew mamoste ye.', 'Sie ist Lehrerin.'], ['Em ne alman in.', 'Wir sind keine Deutschen.'], ['Hûn ji ku ne?', 'Woher seid ihr?']],
  g: [['Ez kurd ___.', 'im', ['im', 'î', 'e'], 'ez → im'], ['Tu bijîşk ___?', 'î', ['î', 'yî', 'e'], 'Nach Konsonant: tu … î'], ['Ew mamoste ___.', 'ye', ['ye', 'e', 'in'], 'Nach Vokal: ye'], ['Em xwendekar ___.', 'in', ['in', 'ne', 'im'], 'Plural nach Konsonant: in'], ['Ez ___ bijîşk im.', 'ne', ['ne', 'na', 'nî'], 'Verneinung bei „sein“: ne'], ['Hûn ji ku ___?', 'ne', ['ne', 'in', 'e'], 'ku endet auf Vokal → ne']],
  dia: `<p>In der Region fragt man auch <b>Tu xelkê ku yî?</b> (wörtl. „Von welchen Leuten bist du?“, also: Wo stammst du her?). Die kurdischen Städtenamen: <b>Amed</b> (Diyarbakır), <b>Êlih</b> (Batman), <b>Mêrdîn</b> (Mardin), <b>Sêrt</b> (Siirt), <b>Riha</b> (Urfa), <b>Wan</b> (Van), <b>Heskîf</b> (Hasankeyf).</p>` },

{ id: 'a1-4', lv: 'A1', title: 'Malbat', sub: 'Familie und die Ezafe', goal: 'Du kannst deine Familie vorstellen und „mein, dein“ ausdrücken.',
  th: `<p>Im Kurmancî steht der Besitzer <b>nach</b> dem Ding. Dazwischen steht ein Bindeglied, die <b>Ezafe</b>. Sie hängt vom Geschlecht ab:</p>
  ${T(['', 'Ezafe', 'Beispiel'], [['männlich', '-ê', 'bav<b>ê</b> min (mein Vater)'], ['weiblich', '-a', 'xwişk<b>a</b> min (meine Schwester)'], ['Plural', '-ên', 'heval<b>ên</b> min (meine Freunde)'], ['nach Vokal', '-yê / -ya / -yên', 'bira<b>yê</b> min (mein Bruder)']])}
  <p>Besitzer-Pronomen sind die Oblique-Formen: <span class="ku">min</span> (mein), <span class="ku">te</span> (dein), <span class="ku">wî</span> (sein), <span class="ku">wê</span> (ihr), <span class="ku">me</span> (unser), <span class="ku">we</span> (euer), <span class="ku">wan</span> (ihr, Pl.).</p>
  <p>Achtung: <span class="ku">dê</span> (Mutter) wird zu <span class="ku">diya min</span>.</p>
  <h4>Haben = „es gibt von mir“</h4><p><span class="ku">Birayekî min heye.</span> (Ich habe einen Bruder.) <span class="ku">Du birayên min hene.</span> (Ich habe zwei Brüder.) <span class="ku">heye</span> für eins, <span class="ku">hene</span> für mehrere, <span class="ku">tune</span> für keins.</p>`,
  vocab: [['malbat', 'Familie'], ['bav', 'Vater'], ['dê', 'Mutter (diya min = meine Mutter)'], ['bira', 'Bruder', 'klingt wie „Bruder“'], ['xwişk', 'Schwester', 'verwandt mit „Schwester“'], ['kur', 'Sohn, Junge'], ['keç', 'Tochter, Mädchen'], ['bapîr', 'Großvater', 'bav + pîr (alt)'], ['dapîr', 'Großmutter'], ['mam', 'Onkel (Vaterseite)'], ['xal', 'Onkel (Mutterseite)'], ['met', 'Tante (Vaterseite)'], ['xaltî', 'Tante (Mutterseite)'], ['heval', 'Freund/in'], ['mezin', 'groß; älter'], ['biçûk', 'klein; jünger'], ['heye', 'es gibt; (ich) habe (eins)'], ['hene', 'es gibt; (ich) habe (mehrere)']],
  dlg: [['A', 'Malbata te mezin e?', 'Ist deine Familie groß?'], ['B', 'Erê! Du birayên min û sê xwişkên min hene.', 'Ja! Ich habe zwei Brüder und drei Schwestern.'], ['A', 'Bavê te çi kar dike?', 'Was arbeitet dein Vater?'], ['B', 'Bavê min karker e. Diya min mamoste ye.', 'Mein Vater ist Arbeiter. Meine Mutter ist Lehrerin.'], ['A', 'Navê birayê te yê mezin çi ye?', 'Wie heißt dein älterer Bruder?'], ['B', 'Navê wî Dilşad e.', 'Er heißt Dilşad.']],
  s: [['Bavê min karker e.', 'Mein Vater ist Arbeiter.'], ['Diya min mamoste ye.', 'Meine Mutter ist Lehrerin.'], ['Du birayên min hene.', 'Ich habe zwei Brüder.'], ['Xwişka te li ku ye?', 'Wo ist deine Schwester?'], ['Malbata min mezin e.', 'Meine Familie ist groß.'], ['Navê wî Dilşad e.', 'Er heißt Dilşad.']],
  g: [['Bav___ min karker e.', 'ê', ['ê', 'a', 'ên'], 'bav ist männlich → -ê'], ['Xwişk___ min li malê ye.', 'a', ['a', 'ê', 'ên'], 'xwişk ist weiblich → -a'], ['Heval___ min li vir in.', 'ên', ['ên', 'ê', 'a'], 'Plural → -ên'], ['Bira___ min mezin e.', 'yê', ['yê', 'ê', 'ya'], 'Nach Vokal: -yê'], ['___ min mamoste ye. (Mutter)', 'Diya', ['Diya', 'Dêya', 'Dêyê'], 'dê → diya'], ['Du birayên min ___.', 'hene', ['hene', 'heye', 'in'], 'mehrere → hene']],
  dia: `<p>Angeredet wird mit Rufendungen: <b>Bavo!</b> (Papa!), <b>Dayê!</b> (Mama!), <b>Kuro!</b> (Junge!), <b>Keçê!</b> (Mädchen!). Statt <b>mam</b> sagt man vielerorts auch <b>ap</b>, und ältere Männer werden höflich mit <b>apo</b> oder <b>xalo</b> angesprochen, ältere Frauen mit <b>xaltî</b> oder <b>pîrê</b>.</p>` },

{ id: 'a1-5', lv: 'A1', title: 'Hejmar', sub: 'Zahlen und Alter', goal: 'Du kannst bis 1000 zählen und nach dem Alter fragen.',
  th: `${T(['', '', '', '', ''], [['1 yek', '2 du', '3 sê', '4 çar', '5 pênc'], ['6 şeş', '7 heft', '8 heşt', '9 neh', '10 deh'], ['11 yazdeh', '12 dazdeh', '13 sêzdeh', '15 pazdeh', '20 bîst'], ['30 sî', '40 çil', '50 pêncî', '100 sed', '1000 hezar']])}
  <p>Zusammensetzen mit <b>û</b> (und): <span class="ku">bîst û yek</span> (21), <span class="ku">sed û pêncî</span> (150). Nach einer Zahl bleibt das Nomen im Singular: <span class="ku">sê bira</span> (drei Brüder).</p>
  <p>Allein stehend sagt man <span class="ku">didu</span> und <span class="ku">sisê</span>, vor Nomen <span class="ku">du</span> und <span class="ku">sê</span>.</p>
  <h4>Alter</h4><p><span class="ku">Tu çend salî yî?</span> (Wie alt bist du?) – <span class="ku">Ez bîst û pênc salî me.</span> <span class="ku">salî</span> endet auf Vokal, darum <b>me</b>.</p>
  <h4>Eselsbrücken</h4><p>Viele Zahlen sind mit deutschen und lateinischen verwandt: pênc ~ penta, şeş ~ sechs, heft ~ septem, heşt ~ okto, neh ~ neun, deh ~ dezi-.</p>`,
  vocab: [['yek', 'eins'], ['du', 'zwei', 'wie engl. „two“'], ['sê', 'drei'], ['çar', 'vier', 'vgl. lat. „quattuor“'], ['pênc', 'fünf', 'vgl. „Pentagon“'], ['şeş', 'sechs'], ['heft', 'sieben', 'vgl. „septem“'], ['heşt', 'acht', 'vgl. „okto“'], ['neh', 'neun'], ['deh', 'zehn', 'vgl. „Dezimal“'], ['bîst', 'zwanzig'], ['sî', 'dreißig'], ['sed', 'hundert'], ['hezar', 'tausend'], ['çend', 'wie viele'], ['sal', 'Jahr'], ['salî', '… Jahre alt'], ['nîv', 'halb']],
  dlg: [['A', 'Tu çend salî yî?', 'Wie alt bist du?'], ['B', 'Ez bîst û çar salî me. Tu?', 'Ich bin vierundzwanzig. Und du?'], ['A', 'Ez sî salî me. Çend zarokên te hene?', 'Ich bin dreißig. Wie viele Kinder hast du?'], ['B', 'Du zarokên min hene. Keça min pênc salî ye, kurê min sê salî ye.', 'Ich habe zwei Kinder. Meine Tochter ist fünf, mein Sohn ist drei.']],
  s: [['Ez bîst salî me.', 'Ich bin zwanzig Jahre alt.'], ['Tu çend salî yî?', 'Wie alt bist du?'], ['Sê xwişkên min hene.', 'Ich habe drei Schwestern.'], ['Kurê min heft salî ye.', 'Mein Sohn ist sieben Jahre alt.'], ['Deh û pênc dike pazdeh.', 'Zehn und fünf macht fünfzehn.'], ['Çend zarokên te hene?', 'Wie viele Kinder hast du?']],
  g: [['5 = ___', 'pênc', [], ''], ['7 = ___', 'heft', [], ''], ['3 + 5 = ___', 'heşt', ['heşt', 'heft', 'şeş'], ''], ['Ez bîst salî ___.', 'me', ['me', 'im', 'ye'], 'salî endet auf Vokal → me'], ['Tu çend salî ___?', 'yî', ['yî', 'î', 'e'], ''], ['32 = sî û ___', 'du', ['du', 'sê', 'didu'], 'Vor einem Nomen oder in Zahlen: du']],
  dia: `<p>Auf dem Markt und am Telefon hört man in Amed und Êlih oft türkische Zahlen. Wer die kurdischen sicher beherrscht, fällt angenehm auf. Für „ein halb“ sagt man <b>nîv</b>: <b>du û nîv</b> (zweieinhalb). Ordnungszahlen bildest du mit <b>-em</b>: <b>yekem</b> (erster), <b>duyem</b> (zweiter).</p>` }
);

PZ.lessons.push(
{ id: 'a1-6', lv: 'A1', title: 'Xwarin û vexwarin', sub: 'Essen, Trinken und das Präsens', goal: 'Du kannst bestellen, sagen was du magst und Verben im Präsens bilden.',
  th: `<p>Das Präsens hat drei Bausteine: <span class="m-pre">di</span> + Präsensstamm + <span class="m-end">Endung</span>.</p>
  ${T(['', 'xwarin (essen), Stamm xw', 'xwestin (wollen), Stamm xwaz'], [['ez', '<span class="m-pre">di</span>xw<span class="m-end">im</span>', '<span class="m-pre">di</span>xwaz<span class="m-end">im</span>'], ['tu', '<span class="m-pre">di</span>xw<span class="m-end">î</span>', '<span class="m-pre">di</span>xwaz<span class="m-end">î</span>'], ['ew', '<span class="m-pre">di</span>xw<span class="m-end">e</span>', '<span class="m-pre">di</span>xwaz<span class="m-end">e</span>'], ['em, hûn, ew', '<span class="m-pre">di</span>xw<span class="m-end">in</span>', '<span class="m-pre">di</span>xwaz<span class="m-end">in</span>']])}
  <p><b>Verneinung:</b> <span class="m-pre">na</span> ersetzt di: <span class="ku">Ez goşt naxwim.</span> (Ich esse kein Fleisch.)</p>
  <p><b>Trinken</b> heißt <span class="ku">vexwarin</span>. Die Vorsilbe <b>ve-</b> bleibt vorne, di kommt dazwischen: <span class="ku">ez <b>ve</b>dixwim</span>, verneint <span class="ku">ez <b>ve</b>naxwim</span>.</p>
  <p>Die Satzstellung bleibt: Subjekt – Objekt – Verb. <span class="ku">Ez çay vedixwim.</span> (Ich Tee trinke.)</p>
  <p>Zustände: <span class="ku">Ez birçî me.</span> (Ich habe Hunger.) <span class="ku">Ez tî me.</span> (Ich habe Durst.)</p>`,
  vocab: [['nan', 'Brot; Essen, Mahlzeit', 'wie indisches „Naan“'], ['çay', 'Tee'], ['şekir', 'Zucker'], ['penîr', 'Käse'], ['hêk', 'Ei'], ['goşt', 'Fleisch'], ['birinc', 'Reis'], ['fêkî', 'Obst'], ['xwê', 'Salz'], ['birçî', 'hungrig'], ['tî', 'durstig'], ['vexwarin', 'trinken'], ['xwestin', 'wollen, möchten'], ['ji kerema xwe', 'bitte'], ['bê', 'ohne'], ['bi', 'mit'], ['an', 'oder'], ['xweş', 'lecker; schön']],
  dlg: [['A', 'Bi xêr hatin! Hûn çi dixwazin?', 'Willkommen! Was möchtet ihr?'], ['B', 'Du çay, ji kerema xwe.', 'Zwei Tee, bitte.'], ['A', 'Bi şekir an bê şekir?', 'Mit oder ohne Zucker?'], ['B', 'Yek bi şekir, yek bê şekir. Nanê we heye?', 'Einen mit, einen ohne Zucker. Habt ihr Brot?'], ['A', 'Erê, nan û penîr heye.', 'Ja, es gibt Brot und Käse.'], ['B', 'Baş e. Em nan û penîr dixwin.', 'Gut. Wir essen Brot und Käse.']],
  s: [['Ez nan dixwim.', 'Ich esse Brot.'], ['Tu çi dixwazî?', 'Was möchtest du?'], ['Ez çay vedixwim.', 'Ich trinke Tee.'], ['Ez qehwe venaxwim.', 'Ich trinke keinen Kaffee.'], ['Em nan û penîr dixwin.', 'Wir essen Brot und Käse.'], ['Ez birçî me.', 'Ich habe Hunger.']],
  g: [['Ez nan ___.', 'dixwim', ['dixwim', 'dixwe', 'dixwî'], 'ez → -im'], ['Ew av ___.', 'vedixwe', ['vedixwe', 'vedixwim', 'dixwe'], 'ew → -e, und trinken = ve-di-xw-'], ['Em çay ___.', 'vedixwin', ['vedixwin', 'vedixwe', 'vedixwî'], 'em → -in'], ['Tu çi ___?', 'dixwazî', ['dixwazî', 'dixwazim', 'dixwaze'], 'tu → -î'], ['Ez goşt ___.', 'naxwim', ['naxwim', 'dixwim', 'nexwim'], 'Verneinung im Präsens: na- statt di-'], ['Ez tî ___.', 'me', ['me', 'im', 'ye'], 'tî endet auf Vokal → me']],
  dia: `<p>Amed ist berühmt für <b>zebeş</b> (Wassermelonen), <b>kezeb</b> (gegrillte Leber) und <b>kutilk</b> (gefüllte Bulgurbällchen). Vor dem Essen wünscht man <b>Noşî can be!</b> (Guten Appetit, wohl bekomm’s). Danach dankt man der Person, die gekocht hat: <b>Destê te sax be!</b> (wörtl. „Deine Hand sei gesund!“).</p>` },

{ id: 'a1-7', lv: 'A1', title: 'Rojane', sub: 'Tagesablauf und Wochentage', goal: 'Du kannst deinen Tag beschreiben und Verben mit Vorsilbe benutzen.',
  th: `<h4>Wichtige Verben im Präsens</h4>${T(['', 'çûn (gehen)', 'hatin (kommen)', 'rabûn (aufstehen)'], [['ez', 'diçim', 'têm', 'radibim'], ['tu', 'diçî', 'têyî', 'radibî'], ['ew', 'diçe', 'tê', 'radibe'], ['em, hûn, ew', 'diçin', 'tên', 'radibin']])}
  <p><span class="ku">hatin</span> ist unregelmäßig: di + hê wird zu <b>tê</b>. Bei <span class="ku">rabûn</span> steht die Vorsilbe <b>ra-</b> vorne: <span class="ku">ra-di-bim</span>.</p>
  <h4>Ziel ohne Präposition</h4><p>Nach Bewegungsverben steht das Ziel direkt, meist mit <b>-ê</b>: <span class="ku">Ez diçim malê.</span> (Ich gehe nach Hause.) <span class="ku">Ew tê Amedê.</span> (Er kommt nach Amed.)</p>
  <h4>Zeitwörter</h4><p><span class="ku">sibê</span> (morgens), <span class="ku">nîvro</span> (mittags), <span class="ku">êvarê</span> (abends), <span class="ku">şevê</span> (nachts), <span class="ku">îro</span> (heute), <span class="ku">sibe</span> (morgen), <span class="ku">her roj</span> (jeden Tag).</p>
  <h4>Wochentage</h4><p>Duşem (Mo) · Sêşem (Di) · Çarşem (Mi) · Pêncşem (Do) · În (Fr) · Şemî (Sa) · Yekşem (So). Eselsbrücke: Du-, Sê-, Çar-, Pênc- sind die Zahlen 2 bis 5.</p>`,
  vocab: [['rabûn', 'aufstehen'], ['çûn', 'gehen'], ['hatin', 'kommen'], ['xebitîn', 'arbeiten'], ['kar', 'Arbeit'], ['dibistan', 'Schule'], ['mal', 'Haus, Zuhause'], ['sibê', 'morgens, am Morgen'], ['nîvro', 'Mittag'], ['êvar', 'Abend'], ['îro', 'heute'], ['sibe', 'morgen (Tag)'], ['zû', 'früh; schnell'], ['dereng', 'spät'], ['her roj', 'jeden Tag'], ['her', 'jede/r/s'], ['paşê', 'danach, später'], ['kengê', 'wann'], ['Duşem', 'Montag', 'du = 2'], ['În', 'Freitag'], ['Yekşem', 'Sonntag', 'yek = 1']],
  dlg: [['A', 'Tu sibê kengê radibî?', 'Wann stehst du morgens auf?'], ['B', 'Ez zû radibim. Paşê ez diçim kar.', 'Ich stehe früh auf. Danach gehe ich zur Arbeit.'], ['A', 'Tu bi otobusê diçî?', 'Fährst du mit dem Bus?'], ['B', 'Na, ez dimeşim. Kar nêzîk e.', 'Nein, ich gehe zu Fuß. Die Arbeit ist nah.'], ['A', 'Tu êvarê kengê têyî malê?', 'Wann kommst du abends nach Hause?'], ['B', 'Ez dereng têm. Êvarê ez pirtûkan dixwînim.', 'Ich komme spät. Abends lese ich Bücher.']],
  s: [['Ez zû radibim.', 'Ich stehe früh auf.'], ['Ez diçim kar.', 'Ich gehe zur Arbeit.'], ['Tu kengê têyî malê?', 'Wann kommst du nach Hause?'], ['Ew her roj dixebite.', 'Er arbeitet jeden Tag.'], ['Zarok diçin dibistanê.', 'Die Kinder gehen zur Schule.'], ['Îro Yekşem e.', 'Heute ist Sonntag.']],
  g: [['Ez sibê zû ___.', 'radibim', ['radibim', 'dirabim', 'rabim'], 'Bei Vorsilben steht di in der Mitte: ra-di-bim'], ['Ew dereng ___ malê.', 'tê', ['tê', 'têm', 'dihê'], 'hatin: têm, têyî, tê, tên'], ['Em ___ dibistanê.', 'diçin', ['diçin', 'diçim', 'diçe'], 'em → -in'], ['Tu kengê ___?', 'radibî', ['radibî', 'radibim', 'radibe'], 'tu → -î'], ['Îro ___ e. (Freitag)', 'În', ['În', 'Şemî', 'Duşem'], ''], ['Ez her roj ___. (arbeiten)', 'dixebitim', [], 'xebitîn, Stamm xebit → di-xebit-im']],
  dia: `<p>Statt „Ez diçim kar“ sagt man oft <b>Ez diçim ser kar</b> (wörtl. „auf die Arbeit“). In schneller Rede schrumpft <b>di-</b> häufig zu einem bloßen d oder t: <b>ez d’çim</b>, und Richtung Mêrdîn fällt es manchmal ganz weg. Uhrzeiten werden im Alltag oft auf Türkisch genannt.</p>` },

{ id: 'a1-8', lv: 'A1', title: 'Li ku ye?', sub: 'Orte, Präpositionen, es gibt', goal: 'Du kannst nach dem Weg fragen und sagen, wo etwas ist.',
  th: `<h4>Die drei Grund-Präpositionen</h4>${T(['', 'Bedeutung', 'Beispiel'], [['li', 'in, an, bei', 'li Amedê (in Amed)'], ['ji', 'von, aus', 'ji Êlihê (aus Êlih)'], ['bi', 'mit (womit)', 'bi otobusê (mit dem Bus)']])}
  <p>Danach steht der <b>Oblique</b>: weibliche Wörter und die meisten Ortsnamen bekommen <b>-ê</b> (<span class="ku">li malê</span>). Männliche Wörter bleiben im Alltag oft ohne Endung (<span class="ku">li gund</span>).</p>
  <h4>Ortsangaben mit li</h4><p><span class="ku">li ser</span> (auf), <span class="ku">li bin</span> (unter), <span class="ku">li ber</span> (vor), <span class="ku">li pişt</span> (hinter), <span class="ku">li cem</span> (bei jemandem), <span class="ku">di … de</span> (in, drinnen): <span class="ku">di çenteyê de</span> (in der Tasche).</p>
  <h4>Es gibt</h4><p><span class="ku">Li vir çayxane heye.</span> (Hier gibt es ein Teehaus.) Verneint: <span class="ku">tune</span> oder <span class="ku">nîne</span>. Hier und dort: <span class="ku">li vir</span>, <span class="ku">li wir</span>.</p>`,
  vocab: [['li', 'in, an, bei'], ['ji', 'von, aus'], ['li ku', 'wo'], ['li vir', 'hier'], ['li wir', 'dort'], ['bajar', 'Stadt'], ['gund', 'Dorf'], ['bazar', 'Markt, Basar'], ['mizgeft', 'Moschee'], ['dikan', 'Laden'], ['çayxane', 'Teehaus'], ['nexweşxane', 'Krankenhaus', 'nexweş (krank) + xane (Haus)'], ['pir', 'Brücke; auch: sehr, viel', 'gleich geschrieben, aber anderes r: Brücke mit kurzem, „viel“ mit gerolltem r'], ['çem', 'Fluss'], ['mase', 'Tisch'], ['li ser', 'auf, über'], ['li ber', 'vor'], ['nêzîk', 'nah'], ['tune', 'gibt es nicht'], ['bibore', 'Entschuldigung']],
  dlg: [['A', 'Bibore, bazar li ku ye?', 'Entschuldigung, wo ist der Basar?'], ['B', 'Bazar nêzîkî Mizgefta Mezin e.', 'Der Basar ist nah bei der Großen Moschee.'], ['A', 'Pira Dehderî li ku ye?', 'Wo ist die Zehn-Bogen-Brücke?'], ['B', 'Ew li derveyî bajêr e, li ser çemê Dîcleyê.', 'Sie liegt außerhalb der Stadt, über dem Tigris.'], ['A', 'Spas! Li vir çayxane heye?', 'Danke! Gibt es hier ein Teehaus?'], ['B', 'Erê, li ber derî çayxaneyeke xweş heye.', 'Ja, vor dem Tor gibt es ein schönes Teehaus.']],
  s: [['Ez li Amedê me.', 'Ich bin in Amed.'], ['Bazar li ku ye?', 'Wo ist der Basar?'], ['Ew ji Êlihê tê.', 'Er kommt aus Êlih.'], ['Pirtûk li ser masê ye.', 'Das Buch liegt auf dem Tisch.'], ['Li vir çayxane heye?', 'Gibt es hier ein Teehaus?'], ['Li gund nexweşxane tune.', 'Im Dorf gibt es kein Krankenhaus.']],
  g: [['Ez ___ Amedê me.', 'li', ['li', 'ji', 'bi'], 'li = in'], ['Ew ___ Êlihê tê.', 'ji', ['ji', 'li', 'bi'], 'ji = aus'], ['Pirtûk li ser mas___ ye.', 'ê', ['ê', 'a', 'î'], 'Nach li ser: Oblique, weiblich -ê'], ['Li vir çayxane ___?', 'heye', ['heye', 'hene', 'e'], ''], ['Li gund mizgeft ___. (gibt es nicht)', 'tune', ['tune', 'na', 'ne'], ''], ['Pirtûk ___ çenteyê de ye.', 'di', ['di', 'li', 'ji'], 'di … de = in, drinnen']],
  dia: `<p>Die Altstadt von Amed heißt <b>Sûr</b>, nach den schwarzen Basaltmauern (<b>sûrên Amedê</b>). Die <b>Pira Dehderî</b> („Brücke mit zehn Toren“) überspannt die <b>Dîcle</b>. Im Alltag sagt man statt li vir / li wir oft <b>li vê derê</b> (hier) und <b>li wê derê</b> (dort).</p>` },

{ id: 'a1-9', lv: 'A1', title: 'Reng û şêwe', sub: 'Adjektive, Farben, Vergleiche', goal: 'Du kannst Dinge beschreiben und vergleichen.',
  th: `<p>Das Adjektiv steht <b>nach</b> dem Nomen und wird mit der Ezafe verbunden, genau wie der Besitzer:</p>
  ${T(['', 'bestimmt', 'unbestimmt (ein …)'], [['männlich', 'bajar<b>ê</b> mezin', 'bajar<b>ekî</b> mezin'], ['weiblich', 'mal<b>a</b> spî', 'mal<b>eke</b> spî'], ['Plural', 'sêv<b>ên</b> sor', '–']])}
  <p><b>-ek</b> heißt „ein“: <span class="ku">bajarek</span> (eine Stadt). Mit Adjektiv wird daraus -ekî (m.) bzw. -eke (f.).</p>
  <p>Als Aussage ohne Ezafe: <span class="ku">Mal spî ye.</span> (Das Haus ist weiß.)</p>
  <h4>Vergleichen</h4><p><b>-tir</b> = -er: <span class="ku">mezintir</span> (größer). „als“ = <b>ji</b>: <span class="ku">Amed ji Êlihê mezintir e.</span> Superlativ mit <b>herî</b>: <span class="ku">herî mezin</span> (am größten).</p>`,
  vocab: [['sor', 'rot'], ['kesk', 'grün'], ['zer', 'gelb'], ['şîn', 'blau'], ['spî', 'weiß'], ['reş', 'schwarz'], ['gewr', 'grau'], ['nû', 'neu', 'klingt wie „neu“'], ['kevn', 'alt (Dinge)'], ['pîr', 'alt (Menschen)'], ['ciwan', 'jung; schön'], ['germ', 'warm, heiß', 'verwandt mit „warm“'], ['sar', 'kalt'], ['dirêj', 'lang'], ['kurt', 'kurz'], ['zîrek', 'klug, fleißig'], ['zindî', 'lebendig'], ['herî', 'am meisten (Superlativ)'], ['kîjan', 'welche/r']],
  dlg: [['A', 'Amed çawa ye?', 'Wie ist Amed?'], ['B', 'Amed bajarekî mezin û kevn e. Sûrên wê reş in.', 'Amed ist eine große, alte Stadt. Ihre Mauern sind schwarz.'], ['A', 'Êlih jî mezin e?', 'Ist Êlih auch groß?'], ['B', 'Êlih ji Amedê biçûktir e, lê bajarekî nû û zindî ye.', 'Êlih ist kleiner als Amed, aber eine neue, lebendige Stadt.'], ['A', 'Kîjan cih herî xweş e?', 'Welcher Ort ist am schönsten?'], ['B', 'Ji bo min, Heskîf herî xweş e!', 'Für mich ist Heskîf am schönsten!']],
  s: [['Amed bajarekî mezin e.', 'Amed ist eine große Stadt.'], ['Sêvên sor xweş in.', 'Die roten Äpfel sind lecker.'], ['Mala me biçûk e.', 'Unser Haus ist klein.'], ['Ev erebeyeke nû ye.', 'Das ist ein neues Auto.'], ['Êlih ji Amedê biçûktir e.', 'Êlih ist kleiner als Amed.'], ['Çaya germ baş e.', 'Heißer Tee ist gut.']],
  g: [['bajar___ mezin (die große Stadt)', 'ê', ['ê', 'a', 'ên'], 'bajar ist männlich'], ['mal___ spî (das weiße Haus)', 'a', ['a', 'ê', 'î'], 'mal ist weiblich'], ['sêv___ sor (die roten Äpfel)', 'ên', ['ên', 'a', 'ê'], 'Plural'], ['bajar___ kevn (eine alte Stadt)', 'ekî', ['ekî', 'eke', 'ek'], 'unbestimmt männlich + Adjektiv'], ['Êlih ji Amedê biçûk___ e.', 'tir', ['tir', 'tirîn', 'ter'], 'Komparativ: -tir'], ['Heskîf ___ xweş e. (am schönsten)', 'herî', ['herî', 'pir', 'tir'], '']],
  dia: `<p>In der Region hörst du für „schön, gut“ sehr oft <b>rind</b> (<i>pir rind e</i>) und <b>delal</b> (lieb, hübsch). Ein Auto heißt im Alltag meist <b>erebe</b>, in Texten auch <b>otomobîl</b> oder <b>trimbêl</b>.</p>` },

{ id: 'a1-10', lv: 'A1', title: 'Li bazarê', sub: 'Einkaufen auf dem Markt', goal: 'Du kannst nach Preisen fragen, handeln und dich bedanken.',
  th: `<h4>Preis</h4><p><span class="ku">Ev bi çiqasî ye?</span> oder <span class="ku">Bi çend e?</span> (Was kostet das?) – <span class="ku">Kîloyek deh lîre ye.</span></p>
  <h4>Bitten mit dem Imperativ</h4><p><span class="ku">Bide min!</span> (Gib mir!), <span class="ku">Ji kerema xwe, du kîlo bide min.</span> Mehr zum Imperativ in A2.</p>
  <h4>Dieses und jenes</h4><p><span class="ku">ev</span> (dies) und <span class="ku">ew</span> (das dort) stehen vor dem Nomen: <span class="ku">ev hinar</span>, <span class="ku">ew tirî</span>.</p>
  <h4>Ein bisschen, genug</h4><p><span class="ku">hinek</span> (etwas, einige), <span class="ku">têr</span> (genug, satt), <span class="ku">pir</span> / <span class="ku">gelek</span> (sehr, viel).</p>
  <p>Höflich danken: <span class="ku">Mala te ava!</span> (wörtl. „Dein Haus möge blühen!“)</p>`,
  vocab: [['bi çiqasî', 'zu welchem Preis, wie teuer'], ['biha', 'teuer'], ['erzan', 'billig'], ['pere', 'Geld'], ['kîlo', 'Kilo'], ['zebeş', 'Wassermelone'], ['tirî', 'Weintrauben'], ['hinar', 'Granatapfel'], ['hejîr', 'Feige'], ['bacansor', 'Tomate', 'bacan + sor (rot)'], ['pîvaz', 'Zwiebel'], ['şîrîn', 'süß'], ['bide min', 'gib mir'], ['hinek', 'etwas, einige'], ['têr', 'genug; satt'], ['gelek', 'sehr, viel'], ['tişt', 'Ding, Sache'], ['mala te ava', 'danke (wörtl. dein Haus blühe)']],
  dlg: [['A', 'Rojbaş, apo! Zebeş bi çiqasî ye?', 'Guten Tag, Onkel! Was kostet die Wassermelone?'], ['B', 'Kîloyek deh lîre ye. Zebeşê Amedê ye, pir şîrîn e!', 'Zehn Lira das Kilo. Melone aus Amed, sehr süß!'], ['A', 'Pir biha ye!', 'Das ist sehr teuer!'], ['B', 'Na, ne biha ye. Ji bo te, kîloyek heşt lîre.', 'Nein, nicht teuer. Für dich acht Lira das Kilo.'], ['A', 'Baş e. Ji kerema xwe, du kîlo bide min.', 'Gut. Gib mir bitte zwei Kilo.'], ['B', 'Ser çavan. Tiştekî din?', 'Sehr gern. Noch etwas?'], ['A', 'Na, têr e. Mala te ava!', 'Nein, das reicht. Vielen Dank!']],
  s: [['Ev bi çiqasî ye?', 'Was kostet das?'], ['Pir biha ye!', 'Das ist sehr teuer!'], ['Du kîlo bide min.', 'Gib mir zwei Kilo.'], ['Îro hinar erzan in.', 'Heute sind Granatäpfel billig.'], ['Ez tirî dikirim.', 'Ich kaufe Trauben.'], ['Tiştekî din?', 'Noch etwas?']],
  g: [['Ev bi ___ ye?', 'çiqasî', ['çiqasî', 'çend salî', 'çawa'], ''], ['Ji kerema xwe, du kîlo ___ min.', 'bide', ['bide', 'dide', 'da'], 'Imperativ: bi + d + e'], ['Ez sêv ___. (kaufen)', 'dikirim', ['dikirim', 'dikire', 'kirî'], 'kirîn (kaufen), Stamm kir'], ['Pir ___ ye! (teuer)', 'biha', ['biha', 'erzan', 'şîrîn'], ''], ['Têr ___.', 'e', ['e', 'ye', 'im'], 'têr endet auf Konsonant'], ['Mala te ___!', 'ava', ['ava', 'baş', 'xweş'], 'Mala te ava = danke']],
  dia: `<p>Auf dem Markt sprechen Jüngere ältere Männer mit <b>apo</b> oder <b>xalo</b> an, Gleichaltrige untereinander mit <b>keko</b> (Bruder). Handeln gehört dazu. Ein typischer Spruch des Händlers: <b>Ji bo te erzan e!</b> (Für dich ist es billig!)</p>` }
);

/* ===== A2 · Lektionen 1–5 ===== */
PZ.lessons.push(
{ id: 'a2-1', lv: 'A2', title: 'Min, te, wî, wê', sub: 'Der Oblique-Fall', goal: 'Du erkennst den Oblique und benutzt ihn bei Objekten und nach Präpositionen.',
  th: `<p>Kurmancî hat zwei Fälle. Den Grundfall kennst du schon. Der <b>Oblique</b> wird gebraucht:</p>
  <ul><li>nach Präpositionen: <span class="ku">bi <b>min</b> re</span> (mit mir)</li><li>für den Besitzer: <span class="ku">mala <b>Rojdayê</b></span> (Rojdas Haus)</li><li>für das Objekt im Präsens: <span class="ku">Ez <b>te</b> dibînim.</span> (Ich sehe dich.)</li><li>für das Ziel einer Bewegung: <span class="ku">Ez diçim <b>malê</b>.</span></li><li>für das Subjekt transitiver Verben in der Vergangenheit (kommt in B1)</li></ul>
  ${T(['', 'Endung', 'Beispiel'], [['weiblich', '-ê', 'li bazar<b>ê</b>, Rojda<b>yê</b>'], ['männlich', '-î (im Alltag oft weg)', 'li vî gund<b>î</b> / li gund'], ['Plural', '-an', 'ji pirtûk<b>an</b>'], ['ein/eine', '-ekî / -ekê', 'li gund<b>ekî</b>, bi jin<b>ekê</b> re']])}
  <p><b>Pronomen:</b> ez → min, tu → te, ew → wî (m.) / wê (f.), em → me, hûn → we, ew → wan.</p>
  <p><b>Demonstrativ:</b> ev → vî (m.) / vê (f.) / van (Pl.): <span class="ku">Ez vê pirtûkê dixwînim.</span></p>`,
  vocab: [['min', 'mich, mir, mein (Oblique von ez)'], ['te', 'dich, dir, dein (Oblique von tu)'], ['wî', 'ihn, ihm, sein (Oblique, m.)'], ['wê', 'sie, ihr (Oblique, f.)'], ['me', 'uns, unser'], ['we', 'euch, euer'], ['wan', 'sie, ihnen, ihr (Pl.)'], ['vî', 'diesen, diesem (m.)'], ['vê', 'diese, dieser (f.)'], ['van', 'diese (Pl., Oblique)'], ['nas kirin', 'kennen (Person)'], ['dîtin', 'sehen (ez dibînim)'], ['ji … re', 'für, an (jemanden)'], ['bi … re', 'zusammen mit'], ['diyarî', 'Geschenk'], ['pirtûk', 'Buch'], ['mirov', 'Mensch; man'], ['kes', 'Person; jemand']],
  dlg: [['A', 'Tu Rojdayê nas dikî?', 'Kennst du Rojda?'], ['B', 'Erê, ez wê nas dikim. Ew hevala xwişka min e.', 'Ja, ich kenne sie. Sie ist die Freundin meiner Schwester.'], ['A', 'Ez wê îro li bazarê dibînim. Ez ji wê re diyariyekê dikirim.', 'Ich treffe sie heute auf dem Markt. Ich kaufe ihr ein Geschenk.'], ['B', 'Çi diyarî?', 'Was für ein Geschenk?'], ['A', 'Pirtûkeke kurdî. Ew ji pirtûkan pir hez dike.', 'Ein kurdisches Buch. Sie liebt Bücher sehr.']],
  s: [['Ez te dibînim.', 'Ich sehe dich.'], ['Tu min nas dikî?', 'Kennst du mich?'], ['Ez ji te re çay çêdikim.', 'Ich mache dir Tee.'], ['Ew bi me re tê.', 'Er kommt mit uns.'], ['Ez vê pirtûkê dixwînim.', 'Ich lese dieses Buch.'], ['Mala wan li gund e.', 'Ihr Haus ist im Dorf.']],
  g: [['Ez ___ dibînim. (dich)', 'te', ['te', 'tu', 'min'], 'Objekt im Präsens: Oblique'], ['Ew ___ nas dike. (mich)', 'min', ['min', 'ez', 'me'], ''], ['Ez bi ___ re têm. (mit ihr)', 'wê', ['wê', 'wî', 'ew'], 'ihr (f.) → wê'], ['Ez ji pirtûk___ hez dikim.', 'an', ['an', 'ê', 'ên'], 'Plural-Oblique: -an'], ['Ez ___ pirtûkê dixwînim. (dieses)', 'vê', ['vê', 'vî', 'ev'], 'pirtûk ist weiblich → vê'], ['Em li mal___ ne.', 'ê', ['ê', 'a', 'an'], 'nach li: Oblique']],
  dia: `<p>Im Alltag von Amed fällt die männliche Endung -î fast immer weg: <b>li gund</b> statt li gundî. Bei manchen Wörtern hörst du dafür ê im Stamm: <b>li bajêr</b> (in der Stadt), <b>ji welêt</b> (aus der Heimat). <b>min</b> klingt in schneller Rede oft wie <b>mi</b>: <i>cem mi</i> (bei mir).</p>` },

{ id: 'a2-2', lv: 'A2', title: 'Bike! Were!', sub: 'Imperativ und Subjunktiv', goal: 'Du kannst Aufforderungen geben und Wünsche ausdrücken.',
  th: `<h4>Imperativ</h4><p><span class="m-pre">bi</span> + Präsensstamm + <span class="m-end">-e</span> (du) / <span class="m-end">-in</span> (ihr): <span class="ku">bixwe! bixwin!</span> (iss! esst!), <span class="ku">bike!</span> (mach!), <span class="ku">bide!</span> (gib!).</p>
  ${T(['Verb', 'du', 'ihr'], [['hatin (kommen)', 'were!', 'werin!'], ['çûn (gehen)', 'here! / biçe!', 'herin! / biçin!'], ['anîn (bringen)', 'bîne!', 'bînin!'], ['gotin (sagen)', 'bêje!', 'bêjin!'], ['rûniştin (sitzen)', 'rûne!', 'rûnin!'], ['rabûn (aufstehen)', 'rabe!', 'rabin!']])}
  <p><b>Verbot</b> mit <span class="m-pre">me-</span>: <span class="ku">meke!</span> (tu das nicht!), <span class="ku">meçe!</span> (geh nicht!), <span class="ku">ji bîr meke!</span> (vergiss nicht!).</p>
  <h4>Subjunktiv</h4><p>Gleiche Form mit Personalendung: <span class="ku">bi-çim, bi-çî, bi-çe, bi-çin</span>. Er folgt auf Wünsche und Pflichten:</p>
  <ul><li><span class="ku">Ez dixwazim <b>biçim</b>.</span> (Ich will gehen.)</li><li><span class="ku">Divê tu <b>bixwînî</b>.</span> (Du musst lernen.)</li><li><span class="ku">Bila ew <b>bê</b>.</span> (Er soll kommen.)</li></ul>
  <p>Unregelmäßig: hatin → <span class="ku">bêm, bêyî, bê, bên</span>; anîn → <span class="ku">bînim</span>; gotin → <span class="ku">bêjim</span>.</p>`,
  vocab: [['were', 'komm!'], ['here', 'geh!'], ['rûne', 'setz dich!'], ['rabe', 'steh auf!'], ['bîne', 'bring!'], ['bêje', 'sag!'], ['meke', 'tu das nicht!'], ['bila', 'soll, möge (lass …)'], ['divê', 'muss, soll'], ['derî', 'Tür'], ['pencere', 'Fenster'], ['vekirin', 'öffnen'], ['girtin', 'schließen; nehmen'], ['hêdî', 'langsam'], ['taştê', 'Frühstück'], ['ji bîr kirin', 'vergessen']],
  dlg: [['A', 'Kuro, rabe! Dereng e.', 'Junge, steh auf! Es ist spät.'], ['B', 'Dayê, ez dixwazim razim.', 'Mama, ich will schlafen.'], ['A', 'Na! Rabe, destên xwe bişo û were taştê.', 'Nein! Steh auf, wasch dir die Hände und komm frühstücken.'], ['B', 'Baş e, baş e. Ez têm.', 'Schon gut. Ich komme.'], ['A', 'Divê tu zû biçî dibistanê. Çenteyê xwe ji bîr meke!', 'Du musst früh zur Schule. Vergiss deine Tasche nicht!']],
  s: [['Were vir!', 'Komm her!'], ['Rûne, ji kerema xwe.', 'Setz dich bitte.'], ['Derî veke!', 'Öffne die Tür!'], ['Ez dixwazim biçim malê.', 'Ich möchte nach Hause gehen.'], ['Divê tu bixwînî.', 'Du musst lernen.'], ['Bila ew bê.', 'Er soll kommen.']],
  g: [['___ vir! (komm)', 'Were', ['Were', 'Here', 'Bê'], ''], ['Derî ___! (öffne)', 'veke', ['veke', 'vedike', 'vekir'], 'Imperativ von vekirin: ve + k + e'], ['Ez dixwazim ___. (gehen)', 'biçim', ['biçim', 'diçim', 'çûm'], 'nach xwestin: Subjunktiv mit bi-'], ['Divê tu ___. (lernen)', 'bixwînî', ['bixwînî', 'dixwînî', 'bixwîne'], ''], ['Bila ew ___. (kommen)', 'bê', ['bê', 'tê', 'were'], 'Subjunktiv von hatin'], ['Çenteyê xwe ji bîr ___! (vergiss nicht)', 'meke', ['meke', 'nake', 'neke'], 'Verbot: me- + Stamm']],
  dia: `<p>Zwei kleine Wörter machen Aufforderungen lebendig: <b>de</b> (los, nun) und <b>ka</b> (doch mal): <i>De bêje!</i> (Na sag schon!), <i>Ka were!</i> (Komm doch mal!). „Geh!“ heißt im Alltag fast immer <b>here!</b>.</p>` },

{ id: 'a2-3', lv: 'A2', title: 'Sibe', sub: 'Pläne und das Futur', goal: 'Du kannst über Pläne und die Zukunft sprechen.',
  th: `<p>Futur = Pronomen + <span class="m-erg">ê</span> + Subjunktiv. Nach <span class="ku">tu</span> wird ê zu <span class="m-erg">yê</span>.</p>
  ${T(['', 'çûn (gehen)', 'kirin (machen)'], [['ez', 'ez <span class="m-erg">ê</span> biçim', 'ez <span class="m-erg">ê</span> bikim'], ['tu', 'tu <span class="m-erg">yê</span> biçî', 'tu <span class="m-erg">yê</span> bikî'], ['ew', 'ew <span class="m-erg">ê</span> biçe', 'ew <span class="m-erg">ê</span> bike'], ['em, hûn, ew', 'em <span class="m-erg">ê</span> biçin', 'em <span class="m-erg">ê</span> bikin']])}
  <p><b>Verneinung:</b> ne- statt bi-: <span class="ku">Ez ê neçim.</span> (Ich werde nicht gehen.) <span class="ku">Ew ê neyê.</span> (Er wird nicht kommen.)</p>
  <p><b>Zeitwörter:</b> <span class="ku">sibe</span> (morgen), <span class="ku">dusibe</span> (übermorgen), <span class="ku">hefteya bê</span> (nächste Woche), <span class="ku">sala bê</span> (nächstes Jahr), <span class="ku">belkî</span> (vielleicht).</p>`,
  vocab: [['dusibe', 'übermorgen', 'du (2) + sibe'], ['hefte', 'Woche'], ['meh', 'Monat'], ['hefteya bê', 'nächste Woche'], ['sala bê', 'nächstes Jahr'], ['dawiya hefteyê', 'Wochenende'], ['belkî', 'vielleicht'], ['bê guman', 'sicher, zweifellos'], ['vegerîn', 'zurückkehren'], ['cem', 'bei (jemandem)'], ['otobus', 'Bus'], ['baran', 'Regen'], ['barîn', 'regnen, fallen (Niederschlag)'], ['plan', 'Plan'], ['betlane', 'Ferien, Urlaub']],
  dlg: [['A', 'Tu yê dawiya hefteyê çi bikî?', 'Was machst du am Wochenende?'], ['B', 'Ez ê biçim Êlihê, cem xaltiya xwe.', 'Ich fahre nach Êlih, zu meiner Tante.'], ['A', 'Tu yê bi çi biçî?', 'Womit fährst du?'], ['B', 'Ez ê bi otobusê biçim. Belkî birayê min jî bê.', 'Mit dem Bus. Vielleicht kommt mein Bruder auch mit.'], ['A', 'Hûn ê kengê vegerin?', 'Wann kommt ihr zurück?'], ['B', 'Em ê Yekşemê vegerin.', 'Am Sonntag.']],
  s: [['Ez ê sibe biçim.', 'Ich werde morgen gehen.'], ['Tu yê çi bikî?', 'Was wirst du tun?'], ['Em ê Yekşemê vegerin.', 'Wir kehren am Sonntag zurück.'], ['Ew ê neyê.', 'Er wird nicht kommen.'], ['Belkî baran bibare.', 'Vielleicht regnet es.'], ['Sala bê ez ê biçim Amedê.', 'Nächstes Jahr fahre ich nach Amed.']],
  g: [['Ez ___ biçim.', 'ê', ['ê', 'yê', 'dê'], 'nach ez: ê'], ['Tu ___ bixwî?', 'yê', ['yê', 'ê', 'ye'], 'nach tu: yê'], ['Em ê sibe ___. (kommen)', 'bên', ['bên', 'tên', 'hatin'], 'Subjunktiv von hatin: bêm, bêyî, bê, bên'], ['Ew ê ___. (nicht gehen)', 'neçe', ['neçe', 'naçe', 'biçe'], 'verneintes Futur: ne- + Stamm'], ['Ez ê çi ___? (tun)', 'bikim', ['bikim', 'dikim', 'kir'], ''], ['___ baran bibare. (vielleicht)', 'Belkî', ['Belkî', 'Bila', 'Divê'], '']],
  dia: `<p>Gesprochen verschmilzt das Futurteilchen mit dem Pronomen: <b>ezê biçim, tuyê bêyî</b>. Im Süden, Richtung Mêrdîn, hörst du auch <b>dê</b>: <i>ez dê biçim</i>. Und statt biçim sagen viele <b>herim</b>: <i>ezê herim malê</i>.</p>` },

{ id: 'a2-4', lv: 'A2', title: 'Duh', sub: 'Vergangenheit ohne Objekt', goal: 'Du kannst erzählen, wohin du gegangen bist und was passiert ist.',
  th: `<p>Jedes Verb hat einen <b>Vergangenheitsstamm</b>. Man erkennt ihn, wenn man vom Infinitiv das -in/-n abschneidet: hat<i>in</i> → <b>hat</b>, çû<i>n</i> → <b>çû</b>.</p>
  <p>Bei <b>intransitiven</b> Verben (ohne Objekt: gehen, kommen, bleiben …) ist die Vergangenheit einfach: Stamm + Endung.</p>
  ${T(['', 'hatin (Konsonant)', 'çûn (Vokal)'], [['ez', 'hat<span class="m-end">im</span>', 'çû<span class="m-end">m</span>'], ['tu', 'hat<span class="m-end">î</span>', 'çû<span class="m-end">yî</span>'], ['ew', 'hat', 'çû'], ['em, hûn, ew', 'hat<span class="m-end">in</span>', 'çû<span class="m-end">n</span>']])}
  <p><b>Verneinung:</b> <span class="m-pre">ne-</span>: <span class="ku">Ez nehatim.</span> (Ich kam nicht.) <b>Sein</b> in der Vergangenheit: <span class="ku">ez bûm, tu bûyî, ew bû</span>.</p>
  <p>Weitere: man → ma (blieb), gihîştin → gihîşt (kam an), ket (fiel), rabû (stand auf), rûnişt (setzte sich), raza (schlief).</p>
  <p class="muted">Transitive Verben (essen, sehen, sagen …) funktionieren in der Vergangenheit anders. Das lernst du in B1 beim Ergativ.</p>`,
  vocab: [['duh', 'gestern'], ['pêr', 'vorgestern'], ['par', 'letztes Jahr'], ['berê', 'früher'], ['hefteya borî', 'letzte Woche'], ['gihîştin', 'ankommen'], ['man', 'bleiben'], ['ketin', 'fallen'], ['westiyan', 'müde werden'], ['bi hev re', 'zusammen'], ['bi tena serê xwe', 'allein'], ['tenê', 'nur; allein'], ['derketin', 'hinausgehen'], ['dereng man', 'sich verspäten']],
  dlg: [['A', 'Tu duh li ku bûyî?', 'Wo warst du gestern?'], ['B', 'Ez çûm Heskîfê.', 'Ich war in Heskîf.'], ['A', 'Tu bi tena serê xwe çûyî?', 'Bist du allein gefahren?'], ['B', 'Na, em bi hev re çûn: ez, xwişka min û du heval.', 'Nein, wir sind zusammen gefahren: ich, meine Schwester und zwei Freunde.'], ['A', 'Hûn kengê vegeriyan?', 'Wann seid ihr zurückgekommen?'], ['B', 'Em êvarê dereng gihîştin malê. Ez pir westiyam!', 'Wir kamen abends spät nach Hause. Ich war sehr müde!']],
  s: [['Ez duh çûm bazarê.', 'Ich ging gestern auf den Markt.'], ['Tu kengê hatî?', 'Wann bist du gekommen?'], ['Ew li malê ma.', 'Sie blieb zu Hause.'], ['Em dereng gihîştin.', 'Wir kamen spät an.'], ['Ez nehatim.', 'Ich bin nicht gekommen.'], ['Hûn li ku bûn?', 'Wo wart ihr?']],
  g: [['Ez duh ___ bazarê. (ging)', 'çûm', ['çûm', 'diçim', 'çû'], ''], ['Tu kengê ___? (kamst)', 'hatî', ['hatî', 'hat', 'têyî'], ''], ['Ew li malê ___. (blieb)', 'ma', ['ma', 'mam', 'dimîne'], '3. Person Sg.: keine Endung'], ['Em dereng ___. (kamen an)', 'gihîştin', ['gihîştin', 'gihîşt', 'digihîjin'], ''], ['Ez ___. (kam nicht)', 'nehatim', ['nehatim', 'nayêm', 'nahatim'], 'Vergangenheit verneint: ne-'], ['Tu li ku ___? (warst)', 'bûyî', ['bûyî', 'bû', 'bûm'], '']],
  dia: `<p>„Müde werden“ heißt in der Region oft <b>betilîn</b>: <i>ez betilîm</i> (ich bin müde geworden). Für „zurückkommen“ hörst du sowohl <b>vegeriyam</b> als auch <b>vegerîm</b>. Nach Bewegungsverben hängt sich gern ein -e an: <i>ez çûm<b>e</b> Heskîfê</i>.</p>` },

{ id: 'a2-5', lv: 'A2', title: 'Dem û hewa', sub: 'Uhrzeit, Wetter, Jahreszeiten', goal: 'Du kannst die Uhrzeit sagen und über das Wetter sprechen.',
  th: `<h4>Uhrzeit</h4><p><span class="ku">Saet çend e?</span> (Wie spät ist es?) – <span class="ku">Saet yek e.</span> (Es ist eins.) <span class="ku">Saet du û nîv e.</span> (halb drei). <span class="ku">Deh deqîqe</span> = zehn Minuten.</p>
  <h4>Wetter</h4><p><span class="ku">Hewa çawa ye?</span> – <span class="ku">Hewa germ / sar / xweş e.</span> Niederschlag „fällt“: <span class="ku">Baran dibare.</span> (Es regnet.) <span class="ku">Berf dibare.</span> (Es schneit.)</p>
  <h4>Zeitangaben im Oblique</h4><p>Wann etwas passiert, steht oft im Oblique ohne Präposition: <span class="ku">havînê</span> (im Sommer), <span class="ku">zivistanê</span> (im Winter), <span class="ku">êvarê</span> (abends), <span class="ku">Şemiyê</span> (am Samstag).</p>
  <p><b>Jahreszeiten:</b> bihar (Frühling), havîn (Sommer), payîz (Herbst), zivistan (Winter).</p>`,
  vocab: [['saet', 'Stunde, Uhr'], ['deqîqe', 'Minute'], ['hewa', 'Wetter, Luft'], ['berf', 'Schnee'], ['ba', 'Wind'], ['ewr', 'Wolke'], ['tav', 'Sonnenschein'], ['hênik', 'kühl, angenehm frisch'], ['bihar', 'Frühling'], ['havîn', 'Sommer'], ['payîz', 'Herbst'], ['zivistan', 'Winter'], ['pile', 'Grad'], ['niha', 'jetzt'], ['kêm', 'wenig']],
  dlg: [['A', 'Saet çend e?', 'Wie spät ist es?'], ['B', 'Saet sê û nîv e.', 'Halb vier.'], ['A', 'Hewa îro çawa ye?', 'Wie ist das Wetter heute?'], ['B', 'Pir germ e. Havîna Amedê wisa ye: çil pile!', 'Sehr heiß. So ist der Sommer in Amed: vierzig Grad!'], ['A', 'Li Almanyayê niha baran dibare.', 'In Deutschland regnet es gerade.'], ['B', 'Ez ji baranê hez dikim! Li vir havînê qet baran nabare.', 'Ich liebe Regen! Hier regnet es im Sommer überhaupt nicht.']],
  s: [['Saet çend e?', 'Wie spät ist es?'], ['Saet sê û nîv e.', 'Es ist halb vier.'], ['Hewa îro sar e.', 'Das Wetter ist heute kalt.'], ['Baran dibare.', 'Es regnet.'], ['Havîn pir germ e.', 'Der Sommer ist sehr heiß.'], ['Zivistanê berf dibare.', 'Im Winter schneit es.']],
  g: [['Saet çend ___?', 'e', ['e', 'ye', 'in'], ''], ['Hewa çawa ___?', 'ye', ['ye', 'e', 'yî'], 'nach Vokal: ye'], ['Baran ___. (regnet)', 'dibare', ['dibare', 'dibarim', 'bare'], ''], ['Bihar, havîn, payîz û ___', 'zivistan', ['zivistan', 'sar', 'berf'], ''], ['Saet du û ___ e. (halb drei)', 'nîv', ['nîv', 'deh', 'sê'], ''], ['Zivistanê ___ dibare. (Schnee)', 'berf', ['berf', 'baran', 'ba'], '']],
  dia: `<p><b>Newroz</b> am 21. März ist das kurdische Neujahrsfest und läutet den Frühling ein. In Amed wird es mit großen Festen, Feuer und Govend-Tanz gefeiert. Die Sommer dort gehören zu den heißesten der Türkei, deshalb schlafen viele Familien nachts auf dem Flachdach.</p>` }
);
