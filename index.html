{ id: 'a2-6', lv: 'A2', title: 'Laş û tendurustî', sub: 'Körper und Gesundheit', goal: 'Du kannst beim Arzt sagen, was dir wehtut.',
  th: `<p>„Mir tut … weh“ = „Mein … schmerzt“: <span class="ku">Serê min diêşe.</span> (Mein Kopf tut weh.) Bei mehreren Körperteilen steht das Verb im Plural: <span class="ku">Çavên min diêşin.</span></p>
  <p>Fragen: <span class="ku">Çi bûye?</span> (Was ist passiert?), <span class="ku">Li ku diêşe?</span> (Wo tut es weh?), <span class="ku">Ji kengê ve?</span> (Seit wann?)</p>
  <p>Ratschläge mit <span class="ku">divê</span> + Subjunktiv: <span class="ku">Divê tu bêhna xwe vedî.</span> (Du solltest dich ausruhen.) <span class="ku">Divê tu pir av vexwî.</span></p>
  <p>Häufigkeit: <span class="ku">rojê sê caran</span> (dreimal am Tag), <span class="ku">carekê</span> (einmal).</p>
  <p>Gute Besserung wünscht man mit <span class="ku">Derbas be!</span> (Möge es vorbeigehen!) oder <span class="ku">Xwedê şîfa bide!</span></p>`,
  vocab: [['ser', 'Kopf'], ['guh', 'Ohr'], ['dev', 'Mund'], ['poz', 'Nase'], ['dest', 'Hand'], ['ling', 'Bein, Fuß'], ['pişt', 'Rücken'], ['zik', 'Bauch'], ['diran', 'Zahn'], ['êşîn', 'wehtun (diêşe)'], ['nexweş', 'krank'], ['tendurist', 'gesund'], ['derman', 'Medikament'], ['car', 'Mal (dreimal = sê caran)'], ['derbas be', 'gute Besserung'], ['hekîm', 'Arzt (traditionell)']],
  dlg: [['A', 'Bi xêr hatî. Çi bûye?', 'Willkommen. Was ist los?'], ['B', 'Serê min û zikê min diêşin.', 'Mein Kopf und mein Bauch tun weh.'], ['A', 'Ji kengê ve?', 'Seit wann?'], ['B', 'Ji duh ve. Ez şevê qet ranezam.', 'Seit gestern. Ich habe nachts überhaupt nicht geschlafen.'], ['A', 'Divê tu vî dermanî rojê sê caran bixwî û pir av vexwî.', 'Du musst dieses Medikament dreimal am Tag nehmen und viel Wasser trinken.'], ['B', 'Spas, doktor.', 'Danke, Doktor.'], ['A', 'Derbas be!', 'Gute Besserung!']],
  s: [['Serê min diêşe.', 'Ich habe Kopfschmerzen.'], ['Ez nexweş im.', 'Ich bin krank.'], ['Çi bûye?', 'Was ist passiert?'], ['Divê tu biçî cem bijîşk.', 'Du musst zum Arzt gehen.'], ['Derbas be!', 'Gute Besserung!'], ['Pir av vexwe.', 'Trink viel Wasser.']],
  g: [['Ser___ min diêşe.', 'ê', ['ê', 'a', 'ên'], 'ser ist männlich'], ['Çav___ min diêşin.', 'ên', ['ên', 'ê', 'a'], 'Plural → -ên, Verb im Plural'], ['Serê min ___. (tut weh)', 'diêşe', ['diêşe', 'diêşim', 'êşî'], ''], ['Divê tu ___ cem bijîşk. (gehen)', 'biçî', ['biçî', 'diçî', 'çûyî'], 'nach divê: Subjunktiv'], ['Xwedê şîfa ___!', 'bide', ['bide', 'dide', 'da'], ''], ['Rojê sê ___ vexwe.', 'caran', ['caran', 'car', 'carê'], 'nach Zahl + car: Plural-Oblique']],
  dia: `<p>Ältere Menschen sagen für Arzt oft <b>hekîm</b>, im Krankenhaus sagt man meist einfach <b>doktor</b>. Wer krank war, wird gefragt: <b>Tu baştir î?</b> (Geht’s dir besser?) Die Antwort: <b>Şikir, baştir im.</b> (Gott sei Dank, besser.)</p>` },

{ id: 'a2-7', lv: 'A2', title: 'Rêwîtî', sub: 'Unterwegs in der Region', goal: 'Du kannst Tickets kaufen, nach Wegen fragen und Richtungen verstehen.',
  th: `<h4>Verkehrsmittel mit bi</h4><p><span class="ku">bi otobusê, bi erebeyê, bi trênê, bi balafirê, bi peyatî</span> (zu Fuß).</p>
  <h4>Richtungen</h4><p><span class="ku">rast</span> (rechts; auch: gerade, richtig), <span class="ku">çep</span> (links), <span class="ku">rasterast</span> (geradeaus). <span class="ku">Here aliyê çepê.</span> (Geh nach links.)</p>
  <h4>Das Richtungs-e</h4><p>Nach Bewegungsverben hängt sich oft ein <b>-e</b> an das Verb: <span class="ku">Ez çûm<b>e</b> Êlihê.</span> <span class="ku">Ew hat<b>e</b> malê.</span> Das betont das Ziel und ist im Süden fast immer zu hören.</p>
  <h4>Dauer</h4><p><span class="ku">Rê çiqas dem dikişîne?</span> (wörtl. „Wie viel Zeit zieht der Weg?“) – <span class="ku">Nêzîkî saetekê.</span> (Etwa eine Stunde.)</p>`,
  vocab: [['rê', 'Weg, Straße'], ['erebe', 'Auto'], ['trên', 'Zug'], ['balafir', 'Flugzeug'], ['bilêt', 'Fahrkarte'], ['rawestgeh', 'Haltestelle', 'rawestan (anhalten) + -geh (Ort)'], ['rast', 'rechts; gerade; richtig'], ['çep', 'links'], ['rasterast', 'geradeaus'], ['alî', 'Seite, Richtung'], ['dem', 'Zeit'], ['nêzîkî', 'etwa, ungefähr; nahe bei'], ['geştiyar', 'Tourist/in'], ['çente', 'Tasche']],
  dlg: [['A', 'Bibore, otobusa Êlihê kengê diçe?', 'Entschuldigung, wann fährt der Bus nach Êlih?'], ['B', 'Her nîv saetê otobusek diçe. Ya din saet deh û nîv e.', 'Jede halbe Stunde fährt ein Bus. Der nächste um halb elf.'], ['A', 'Rê çiqas dem dikişîne?', 'Wie lange dauert die Fahrt?'], ['B', 'Nêzîkî saet û nîvekê.', 'Etwa anderthalb Stunden.'], ['A', 'Bilêt bi çiqasî ye?', 'Was kostet die Fahrkarte?'], ['B', 'Sed lîre. Here wê derê, aliyê çepê.', 'Hundert Lira. Geh dorthin, auf die linke Seite.']],
  s: [['Ez bi otobusê diçim Êlihê.', 'Ich fahre mit dem Bus nach Êlih.'], ['Rê çiqas dem dikişîne?', 'Wie lange dauert der Weg?'], ['Here aliyê rastê.', 'Geh nach rechts.'], ['Rawestgeh li ku ye?', 'Wo ist die Haltestelle?'], ['Em çûne Heskîfê.', 'Wir sind nach Heskîf gefahren.'], ['Du bilêt, ji kerema xwe.', 'Zwei Fahrkarten, bitte.']],
  g: [['Ez ___ otobusê diçim.', 'bi', ['bi', 'li', 'ji'], 'womit? → bi'], ['Here aliyê ___. (links)', 'çepê', ['çepê', 'rastê', 'jorê'], ''], ['Rê çiqas dem ___?', 'dikişîne', ['dikişîne', 'dike', 'dide'], ''], ['Ez çûm___ Êlihê.', 'e', ['e', 'a', 'î'], 'Richtungs-e nach Bewegungsverben'], ['Bilêt bi ___ ye?', 'çiqasî', ['çiqasî', 'kengê', 'ku'], ''], ['Otobus ___ diçe? (wann)', 'kengê', ['kengê', 'çawa', 'çima'], '']],
  dia: `<p>Heskîf gehört zur Provinz Êlih. Die alte Stadt am Tigris ist seit 2020 vom Ilısu-Stausee überflutet; einige historische Bauten wurden an einen neuen Ort versetzt. Wenn du nach dem Weg fragst, hörst du oft <b>li vê derê</b> (hier) und <b>hinekî din</b> (noch ein Stück).</p>` },

{ id: 'a2-8', lv: 'A2', title: 'Dikarim', sub: 'Können, müssen, dürfen', goal: 'Du kannst sagen, was du kannst, musst und darfst.',
  th: `${T(['', 'Kurmancî', 'Beispiel'], [['können', 'karîn: dikarim / nikarim', 'Ez dikarim bêm. (Ich kann kommen.)'], ['wissen, können (gelernt)', 'zanîn: dizanim / nizanim', 'Ez nizanim. (Ich weiß es nicht.)'], ['müssen, sollen', 'divê (unveränderlich)', 'Divê ez biçim. (Ich muss gehen.)'], ['nötig sein', 'pêwîst e / hewce ye', 'Pêwîst e em bilez bin.'], ['möglich, vielleicht', 'dibe ku', 'Dibe ku ew neyê.'], ['nicht gehen, nicht dürfen', 'nabe', 'Nabe! (Das geht nicht!)']])}
  <p>Nach allen Modalwörtern steht der <b>Subjunktiv</b>. Achtung: <span class="ku">karîn</span> und <span class="ku">zanîn</span> verneinen mit <b>ni-</b>, nicht mit na-.</p>
  <p>„Helfen“: <span class="ku">alîkarî kirin</span>, mit Person: <span class="ku">alîkariya min bike</span> (hilf mir).</p>`,
  vocab: [['karîn', 'können'], ['zanîn', 'wissen'], ['pêwîst', 'nötig'], ['hewce', 'nötig, gebraucht'], ['dibe ku', 'es kann sein, dass; vielleicht'], ['nabe', 'geht nicht, darf nicht'], ['qedexe', 'verboten'], ['destûr', 'Erlaubnis'], ['alîkarî', 'Hilfe'], ['mecbûr', 'gezwungen'], ['bilez', 'schnell, eilig'], ['birin', 'hinbringen, mitnehmen']],
  dlg: [['A', 'Tu dikarî alîkariya min bikî?', 'Kannst du mir helfen?'], ['B', 'Erê, bê guman. Çi pêwîst e?', 'Ja, natürlich. Was brauchst du?'], ['A', 'Divê ez sibe biçim nexweşxaneyê, lê erebeya min tune.', 'Ich muss morgen ins Krankenhaus, aber ich habe kein Auto.'], ['B', 'Ez dikarim te bibim. Saet çend?', 'Ich kann dich hinbringen. Um wie viel Uhr?'], ['A', 'Saet neh.', 'Um neun.'], ['B', 'Baş e. Dibe ku ez hinekî dereng bimînim, lê ez ê bêm.', 'Gut. Vielleicht verspäte ich mich etwas, aber ich komme.']],
  s: [['Ez dikarim kurmancî bixwînim.', 'Ich kann Kurmancî lesen.'], ['Tu dikarî alîkariya min bikî?', 'Kannst du mir helfen?'], ['Divê ez biçim.', 'Ich muss gehen.'], ['Ez nikarim bêm.', 'Ich kann nicht kommen.'], ['Dibe ku ew dereng bimîne.', 'Vielleicht verspätet er sich.'], ['Li vir cixare qedexe ye.', 'Rauchen ist hier verboten.']],
  g: [['Ez ___ bêm. (kann)', 'dikarim', ['dikarim', 'dizanim', 'dixwazim'], ''], ['Ez ___ bêm. (kann nicht)', 'nikarim', ['nikarim', 'nakarim', 'nekarim'], 'karîn und zanîn verneinen mit ni-'], ['___ ez biçim. (muss)', 'Divê', ['Divê', 'Dibe', 'Bila'], ''], ['Tu dikarî alîkariya min ___?', 'bikî', ['bikî', 'dikî', 'kir'], 'nach dikarî: Subjunktiv'], ['Ez ___ ew li ku ye. (weiß nicht)', 'nizanim', ['nizanim', 'nazanim', 'nezanim'], ''], ['___ ku baran bibare. (es kann sein)', 'Dibe', ['Dibe', 'Divê', 'Nabe'], '']],
  dia: `<p>Im Alltag hörst du oft das türkische <b>lazim e</b>. Kurdisch klingt besser: <b>divê</b>, <b>pêwîst e</b> oder <b>gerek e</b>. In Behdînan (Nordirak) sagt man für „können“ <b>dişêm</b>, in Amed und Êlih bleibt es bei <b>dikarim</b>.</p>` },

{ id: 'a2-9', lv: 'A2', title: 'Mal û gund', sub: 'Haus, Dorf und Ortsangaben', goal: 'Du kannst dein Zuhause beschreiben und sagen, wo Dinge liegen.',
  th: `${T(['Kurmancî', 'Bedeutung'], [['li ser', 'auf'], ['li bin', 'unter'], ['li ber', 'vor'], ['li pişt', 'hinter'], ['li nav', 'mitten in, zwischen'], ['li kêleka', 'neben'], ['di … de', 'in, drinnen'], ['li hundir / li derve', 'drinnen / draußen'], ['li jor / li jêr', 'oben / unten']])}
  <p>Das Wort danach steht im Oblique: <span class="ku">li ser masê</span>, <span class="ku">li bin darê</span>, <span class="ku">li ser banî</span> (ban ist männlich, darum -î).</p>
  <p><b>mal</b> ist das Zuhause und der Haushalt, <b>xanî</b> das Gebäude.</p>`,
  vocab: [['xanî', 'Haus (Gebäude)'], ['ode', 'Zimmer'], ['metbex', 'Küche'], ['hewş', 'Innenhof'], ['ban', 'Flachdach'], ['kevir', 'Stein'], ['dar', 'Baum; Holz'], ['bax', 'Garten'], ['zevî', 'Feld, Acker'], ['pez', 'Schafe'], ['mirîşk', 'Huhn'], ['kanî', 'Quelle'], ['pisîk', 'Katze'], ['li bin', 'unter'], ['li pişt', 'hinter'], ['li derve', 'draußen'], ['jiyan', 'leben (dijî)'], ['lîstin', 'spielen (dilîze)']],
  dlg: [['A', 'Mala we ya gund çawa ye?', 'Wie ist euer Haus im Dorf?'], ['B', 'Xaniyekî kevn e, ji kevirên reş. Hewşeke mezin heye.', 'Ein altes Haus aus schwarzen Steinen. Es hat einen großen Hof.'], ['A', 'Hûn havînê li ku radizin?', 'Wo schlaft ihr im Sommer?'], ['B', 'Li ser banî! Şevê li jor hênik e.', 'Auf dem Dach! Nachts ist es oben kühl.'], ['A', 'Li gund çi heye?', 'Was gibt es im Dorf?'], ['B', 'Bax, zevî, pez û mirîşk. Li pişt malê kaniyek jî heye.', 'Gärten, Felder, Schafe und Hühner. Hinter dem Haus gibt es auch eine Quelle.']],
  s: [['Pisîk li bin masê ye.', 'Die Katze ist unter dem Tisch.'], ['Bax li pişt malê ye.', 'Der Garten ist hinter dem Haus.'], ['Em havînê li ser banî radizin.', 'Im Sommer schlafen wir auf dem Dach.'], ['Zarok li derve dilîzin.', 'Die Kinder spielen draußen.'], ['Di odeyê de du pencere hene.', 'Im Zimmer gibt es zwei Fenster.'], ['Dapîra min li gund dijî.', 'Meine Großmutter lebt im Dorf.']],
  g: [['Pisîk li ___ masê ye. (unter)', 'bin', ['bin', 'ser', 'ber'], ''], ['Bax li ___ malê ye. (hinter)', 'pişt', ['pişt', 'ber', 'nav'], ''], ['Em li ser ban___ radizin.', 'î', ['î', 'ê', 'a'], 'ban ist männlich → -î'], ['Zarok li ___ dilîzin. (draußen)', 'derve', ['derve', 'hundir', 'jor'], ''], ['___ odeyê de du pencere hene.', 'Di', ['Di', 'Li', 'Ji'], 'di … de'], ['Dapîra min li gund ___. (lebt)', 'dijî', ['dijî', 'dijîm', 'jiya'], '']],
  dia: `<p>Die traditionellen Häuser in Amed sind aus schwarzem Basalt und um einen Innenhof (<b>hewş</b>) gebaut, oft mit Brunnen. In heißen Nächten schläft die Familie auf dem <b>ban</b>, dem Flachdach, unter Moskitonetzen.</p>` },

{ id: 'a2-10', lv: 'A2', title: 'Hez dikim', sub: 'Gefühle, Hobbys, zusammengesetzte Verben', goal: 'Du kannst über Vorlieben und Gefühle sprechen.',
  th: `<p>Viele Verben bestehen aus Nomen + <span class="ku">kirin / bûn / dan</span>. Nur das Hilfsverb wird konjugiert:</p>
  ${T(['Verb', 'Bedeutung', 'Präsens'], [['hez kirin', 'mögen, lieben', 'ez ji … hez dikim'], ['guhdarî kirin', 'zuhören', 'ez guhdarî dikim'], ['fêr bûn', 'lernen', 'ez fêr dibim'], ['xeber dan', 'sprechen', 'ez xeber didim'], ['wêne kişandin', 'fotografieren', 'ez wêne dikişînim']])}
  <p><b>hez kirin</b> braucht <b>ji</b> + Oblique: <span class="ku">Ez ji muzîkê hez dikim.</span> <span class="ku">Ez ji te hez dikim.</span> (Ich liebe dich.)</p>
  <p>Gefühle: <span class="ku">Ez kêfxweş im</span> (froh), <span class="ku">xemgîn</span> (traurig), <span class="ku">aciz</span> (genervt), <span class="ku">westiyayî</span> (müde). Angst: <span class="ku">Ez ji … ditirsim.</span></p>
  <p><span class="ku">Kêfa min tê</span> (wörtl. „Meine Freude kommt“) = Ich habe Spaß, es gefällt mir.</p>`,
  vocab: [['hez kirin', 'mögen, lieben'], ['guhdarî kirin', 'zuhören'], ['kêf', 'Freude, Spaß'], ['xemgîn', 'traurig'], ['aciz', 'genervt, gelangweilt'], ['westiyayî', 'müde'], ['tirsîn', 'Angst haben (ditirsim)'], ['muzîk', 'Musik'], ['stran', 'Lied'], ['stranbêj', 'Sänger/in'], ['dengbêj', 'Erzählsänger/in', 'deng (Stimme) + bêj (sagen)'], ['deng', 'Stimme, Klang'], ['govend', 'Reigentanz'], ['dawet', 'Hochzeit'], ['pismam', 'Cousin (Sohn des Onkels)'], ['dema vala', 'Freizeit'], ['kûçik', 'Hund']],
  dlg: [['A', 'Tu di dema xwe ya vala de çi dikî?', 'Was machst du in deiner Freizeit?'], ['B', 'Ez ji muzîkê pir hez dikim. Ez stranên kurdî guhdarî dikim.', 'Ich liebe Musik. Ich höre kurdische Lieder.'], ['A', 'Tu ji kîjan stranbêjî hez dikî?', 'Welche Sänger magst du?'], ['B', 'Ez ji dengbêjan hez dikim. Dengê wan dilê min dihejîne.', 'Ich mag die Dengbêjs. Ihre Stimmen bewegen mein Herz.'], ['A', 'Ez jî ji govendê hez dikim. Li dawetan kêfa min tê!', 'Ich mag den Govend-Tanz. Auf Hochzeiten habe ich Spaß!'], ['B', 'Wê demê Şemiyê were daweta pismamê min!', 'Dann komm am Samstag zur Hochzeit meines Cousins!']],
  s: [['Ez ji muzîkê hez dikim.', 'Ich mag Musik.'], ['Ez stranên kurdî guhdarî dikim.', 'Ich höre kurdische Lieder.'], ['Kêfa min tê.', 'Ich habe Spaß.'], ['Ez îro xemgîn im.', 'Ich bin heute traurig.'], ['Zarok ji kûçik ditirsin.', 'Die Kinder haben Angst vor dem Hund.'], ['Tu ji çi hez dikî?', 'Was magst du?']],
  g: [['Ez ___ muzîkê hez dikim.', 'ji', ['ji', 'li', 'bi'], 'hez kirin braucht ji'], ['Ez ji govend___ hez dikim.', 'ê', ['ê', 'a', 'an'], 'nach ji: Oblique'], ['Ew ji pirtûkan hez ___.', 'dike', ['dike', 'dikim', 'kir'], 'ew → -e'], ['Kêfa min ___.', 'tê', ['tê', 'heye', 'dike'], 'wörtl. „Meine Freude kommt“'], ['Ez stranan guhdarî ___.', 'dikim', ['dikim', 'didim', 'dibim'], 'guhdarî kirin'], ['Ez ji kûçik ___. (habe Angst)', 'ditirsim', ['ditirsim', 'ditirse', 'tirsiyam'], '']],
  dia: `<p>Hochzeiten (<b>dawet</b>) in Amed und Êlih dauern oft lange und gehören dem <b>govend</b>, dem Reigentanz, bei dem man sich an den kleinen Fingern fasst. In der Altstadt von Amed gibt es das <b>Mala Dengbêjan</b>, das Haus der Erzählsänger, in dem täglich gesungen wird.</p>` }
);

PZ.lessons.push(
{ id: 'b1-1', lv: 'B1', title: 'Min xwar', sub: 'Ergativ I: transitive Vergangenheit', goal: 'Du bildest die Vergangenheit von Verben mit Objekt.',
  th: `<p>Das wichtigste Kapitel der Kurmancî-Grammatik! Unterscheide zwei Arten von Verben:</p>
  <ul><li><b>intransitiv</b> (kein Objekt): gehen, kommen, bleiben … → <span class="ku">Ez hatim.</span></li><li><b>transitiv</b> (mit Objekt): essen, sehen, sagen, machen … → in der Vergangenheit <b>ergativ</b>.</li></ul>
  <h4>Ergativ = drei Regeln</h4><ol><li>Das Subjekt steht im <span class="m-erg">Oblique</span>: <span class="ku">min, te, wî/wê, me, we, wan</span>; Nomen mit -ê / -î / -an.</li><li>Das Objekt steht in der Grundform.</li><li>Das Verb richtet sich nach dem <b>Objekt</b> (ein Ding = keine Endung).</li></ol>
  ${EX([['<span class="m-erg">Min</span> nan xwar.', 'Ich aß Brot.'], ['<span class="m-erg">Te</span> çi kir?', 'Was hast du gemacht?'], ['<span class="m-erg">Rojdayê</span> pirtûk xwend.', 'Rojda las das Buch.'], ['<span class="m-erg">Zarokan</span> sêv xwar<b>in</b>.', 'Die Kinder aßen die Äpfel. (Plural wegen der Äpfel)'], ['Bavê min erebeyek kirî.', 'Mein Vater kaufte ein Auto. (Ezafe verdeckt den Oblique)']])}
  <p><b>Verneinung:</b> <span class="ku">Min nan <b>ne</b>xwar.</span></p>
  <p>Merke dir die Vergangenheitsstämme: xwar, kir, got, dît, xwend, nivîsî, kirî, da, anî, girt, bihîst, şand.</p>`,
  vocab: [['xwar', 'aß (von xwarin)'], ['kir', 'machte (von kirin)'], ['got', 'sagte (von gotin)'], ['dît', 'sah (von dîtin)'], ['xwend', 'las (von xwendin)'], ['nivîsî', 'schrieb (von nivîsîn)'], ['kirî', 'kaufte (von kirîn)'], ['da', 'gab (von dan)'], ['anî', 'brachte (von anîn)'], ['bihîst', 'hörte (von bihîstin)'], ['şand', 'schickte (von şandin)'], ['karê malê', 'Hausarbeit'], ['sebze', 'Gemüse'], ['kutilk', 'gefüllte Bulgurbällchen'], ['name', 'Brief']],
  dlg: [['A', 'Te duh çi kir?', 'Was hast du gestern gemacht?'], ['B', 'Min sibê karê malê kir, paşê min pirtûkek xwend.', 'Morgens habe ich Hausarbeit gemacht, dann habe ich ein Buch gelesen.'], ['A', 'Te ji bazarê çi kirî?', 'Was hast du auf dem Markt gekauft?'], ['B', 'Min tiştek nekirî. Diya min sebze kirî.', 'Ich habe nichts gekauft. Meine Mutter hat Gemüse gekauft.'], ['A', 'We êvarê çi xwar?', 'Was habt ihr abends gegessen?'], ['B', 'Me kutilk xwarin! Diya min çêkirin.', 'Wir haben Kutilk gegessen! Meine Mutter hat sie gemacht.']],
  s: [['Min nan xwar.', 'Ich habe Brot gegessen.'], ['Te çi kir?', 'Was hast du gemacht?'], ['Wê pirtûk xwend.', 'Sie hat das Buch gelesen.'], ['Me tiştek nekirî.', 'Wir haben nichts gekauft.'], ['Bavê min erebeyek kirî.', 'Mein Vater hat ein Auto gekauft.'], ['Zarokan sêv xwarin.', 'Die Kinder haben die Äpfel gegessen.']],
  g: [['___ nan xwar. (ich)', 'Min', ['Min', 'Ez', 'Me'], 'Transitive Vergangenheit: Subjekt im Oblique'], ['___ çi kir? (du)', 'Te', ['Te', 'Tu', 'We'], ''], ['Wî name ___. (schrieb)', 'nivîsî', ['nivîsî', 'dinivîse', 'nivîsîm'], ''], ['Em hatin, lê ___ tu nedîtî. (wir)', 'me', ['me', 'em', 'we'], 'hatin ist intransitiv (em), dîtin transitiv (me)'], ['Rojda___ pirtûk xwend.', 'yê', ['yê', 'ê', 'ya'], 'Name auf Vokal: Oblique -yê'], ['Min nan ___. (aß nicht)', 'nexwar', ['nexwar', 'naxwar', 'nexwarim'], 'Verneinung in der Vergangenheit: ne-']],
  dia: `<p>Im Süden des Sprachraums, also auch in Amed und Êlih, ist der Ergativ gut erhalten. In westlichen Dialekten wird er teils vereinfacht. Die Pluralkongruenz (<i>me kutilk xwar<b>in</b></i>) fällt im schnellen Sprechen manchmal weg: <i>me kutilk xwar</i>. Lern die volle Form, dann verstehst du beides.</p>` },

{ id: 'b1-2', lv: 'B1', title: 'Min tu dîtî', sub: 'Ergativ II: das Verb folgt dem Objekt', goal: 'Du bildest Sätze wie „ich sah dich“ und „du sahst mich“.',
  th: `<p>Ist das Objekt eine Person, bekommt das Verb deren Endung, genau wie beim intransitiven Verb:</p>
  ${T(['Objekt', 'Endung', 'Beispiel'], [['ez', '-im', '<span class="m-erg">te</span> ez dît<b>im</b> (du sahst mich)'], ['tu', '-î', '<span class="m-erg">min</span> tu dît<b>î</b> (ich sah dich)'], ['ew (Sg.)', '–', '<span class="m-erg">min</span> ew dît (ich sah ihn/sie)'], ['em / hûn / ew (Pl.)', '-in', '<span class="m-erg">wî</span> em dît<b>in</b> (er sah uns)']])}
  <p>Die Fragewörter: <span class="ku">kî</span> (wer) wird im Oblique zu <span class="ku">kê</span>: <span class="ku">Kê tu dîtî?</span> (Wer hat dich gesehen?) – <span class="ku">Te kî dît?</span> (Wen hast du gesehen?)</p>
  <p>Merktrick: Stell dir vor, der Satz ist „von mir wurde du gesehen“. Wer „gesehen wurde“, bestimmt die Endung.</p>`,
  vocab: [['kê', 'wer / wen (Oblique von kî)'], ['vexwendin', 'einladen'], ['hembêz kirin', 'umarmen'], ['nas kirin', 'erkennen, kennenlernen'], ['hiştin', 'lassen, zurücklassen'], ['birin', 'mitnehmen, bringen'], ['hemû', 'alle'], ['şahî', 'Feier, Fest'], ['dawet', 'Hochzeit'], ['bi rastî', 'wirklich']],
  dlg: [['A', 'Te ez li bazarê dîtim?', 'Hast du mich auf dem Markt gesehen?'], ['B', 'Erê, min tu dîtî, lê te ez nedîtim!', 'Ja, ich habe dich gesehen, aber du hast mich nicht gesehen!'], ['A', 'Bibore! Kê tu anî vir?', 'Entschuldige! Wer hat dich hergebracht?'], ['B', 'Birayê min ez anîm. Wî em hemû anîn.', 'Mein Bruder hat mich gebracht. Er hat uns alle gebracht.'], ['A', 'Te Dilşad vexwend dawetê?', 'Hast du Dilşad zur Hochzeit eingeladen?'], ['B', 'Erê, min ew û hevalên wî vexwendin.', 'Ja, ich habe ihn und seine Freunde eingeladen.']],
  s: [['Min tu dîtî.', 'Ich habe dich gesehen.'], ['Te ez dîtim.', 'Du hast mich gesehen.'], ['Wî em vexwendin.', 'Er hat uns eingeladen.'], ['Kê tu anî vir?', 'Wer hat dich hergebracht?'], ['Me hûn bihîstin.', 'Wir haben euch gehört.'], ['Wan ez nas kirim.', 'Sie haben mich erkannt.']],
  g: [['Min tu ___. (sah)', 'dîtî', ['dîtî', 'dîtim', 'dît'], 'Objekt tu → -î'], ['Te ez ___. (sahst)', 'dîtim', ['dîtim', 'dîtî', 'dît'], 'Objekt ez → -im'], ['Wî em ___. (lud ein)', 'vexwendin', ['vexwendin', 'vexwend', 'vexwendim'], 'Objekt em → -in'], ['Min ew ___. (sah, eine Person)', 'dît', ['dît', 'dîtin', 'dîtî'], 'Objekt ew (Sg.) → keine Endung'], ['___ tu anî? (wer)', 'Kê', ['Kê', 'Kî', 'Çi'], 'kî im Oblique: kê'], ['Wan ez nas ___.', 'kirim', ['kirim', 'kir', 'kirin'], 'Objekt ez → -im']],
  dia: `<p>Auch im Alltag sagt man in der Region sauber <i>min tu dîtî</i>. Wenn du das beherrschst, klingst du sofort fortgeschritten. Höre genau hin: Viele Lieder spielen mit diesen Formen, etwa <i>te ez hiştim</i> (du hast mich verlassen).</p>` },

{ id: 'b1-3', lv: 'B1', title: 'Min dixwend', sub: 'Verlaufsform und Gewohnheit in der Vergangenheit', goal: 'Du kannst beschreiben, was früher regelmäßig oder gerade geschah.',
  th: `<p><span class="m-pre">di</span> + <b>Vergangenheitsstamm</b> = „war gerade dabei“ oder „pflegte zu“:</p>
  ${T(['', 'intransitiv: çûn', 'transitiv: xwendin'], [['ich', 'ez <span class="m-pre">di</span>çûm', '<span class="m-erg">min</span> <span class="m-pre">di</span>xwend'], ['du', 'tu <span class="m-pre">di</span>çûyî', '<span class="m-erg">te</span> <span class="m-pre">di</span>xwend'], ['er/sie', 'ew <span class="m-pre">di</span>çû', '<span class="m-erg">wî/wê</span> <span class="m-pre">di</span>xwend'], ['wir/ihr/sie', 'em <span class="m-pre">di</span>çûn', '<span class="m-erg">me/we/wan</span> <span class="m-pre">di</span>xwend']])}
  <p>Transitive Verben bleiben ergativ. Verneinung: <span class="ku">ne-di-</span>: <span class="ku">ez nediçûm</span>, <span class="ku">min nedixwend</span>.</p>
  <ul><li>Gewohnheit: <span class="ku">Berê em her havîn diçûn gund.</span> (Früher fuhren wir jeden Sommer ins Dorf.)</li><li>Hintergrund: <span class="ku">Dema ku ez hatim, ew radiza.</span> (Als ich kam, schlief er.)</li></ul>`,
  vocab: [['zaroktî', 'Kindheit'], ['dema ku', 'als, während'], ['her gav', 'immer'], ['carinan', 'manchmal'], ['qet', 'nie; überhaupt (nicht)'], ['kolan', 'Gasse, Straße'], ['lîstik', 'Spiel'], ['çîrok', 'Geschichte, Märchen'], ['raketin', 'einschlafen, sich hinlegen'], ['temaşe kirin', 'zuschauen, anschauen'], ['televizyon', 'Fernseher'], ['berê', 'früher']],
  dlg: [['A', 'Dema tu zarok bûyî, te çi dikir?', 'Was hast du gemacht, als du ein Kind warst?'], ['B', 'Em li gund diman. Havînê em li zeviyan dixebitîn û êvarê li kolanan dilîstin.', 'Wir lebten im Dorf. Im Sommer arbeiteten wir auf den Feldern und abends spielten wir in den Gassen.'], ['A', 'Dapîra te çîrok ji we re digotin?', 'Hat deine Großmutter euch Geschichten erzählt?'], ['B', 'Erê! Her şev wê çîrokek digot. Me guhdarî dikir û em radiketin.', 'Ja! Jeden Abend erzählte sie eine Geschichte. Wir hörten zu und schliefen ein.']],
  s: [['Berê em li gund diman.', 'Früher lebten wir im Dorf.'], ['Min her roj pirtûk dixwend.', 'Ich las jeden Tag Bücher.'], ['Dema ku ez hatim, ew radiza.', 'Als ich kam, schlief er.'], ['Wê her şev çîrokek digot.', 'Sie erzählte jeden Abend eine Geschichte.'], ['Zarok li kolanê dilîstin.', 'Die Kinder spielten in der Gasse.'], ['Me qet televizyon temaşe nedikir.', 'Wir haben nie ferngesehen.']],
  g: [['Berê em li gund ___. (lebten)', 'diman', ['diman', 'man', 'dimînin'], 'di + Vergangenheitsstamm ma + n'], ['Min her roj pirtûk ___. (las)', 'dixwend', ['dixwend', 'xwend', 'dixwînim'], ''], ['Dema ku ez hatim, ew ___. (schlief gerade)', 'radiza', ['radiza', 'raza', 'radize'], 'Vorsilbe + di + za'], ['Zarok li kolanê ___. (spielten)', 'dilîstin', ['dilîstin', 'lîstin', 'dilîzin'], ''], ['___ guhdarî dikir. (wir)', 'Me', ['Me', 'Em', 'We'], 'guhdarî kirin ist transitiv → Oblique'], ['Me qet televizyon temaşe ___. (nie)', 'nedikir', ['nedikir', 'nakir', 'dikir'], 'Verneinung: ne-di-']],
  dia: `<p>Die Verlaufsform ist das Rückgrat jeder Erzählung über „früher“. In der Region hörst du für „manchmal“ oft die Kurzform <b>carna</b> und für „als“ gern <b>wextê ku</b>: <i>wextê ku ez zarok bûm …</i></p>` },

{ id: 'b1-4', lv: 'B1', title: 'Ez hatime', sub: 'Das Perfekt', goal: 'Du sprichst über Erfahrungen und Ergebnisse.',
  th: `<p>Perfekt = Vergangenheitsstamm + <b>i</b> (nach Konsonant) + Endung:</p>
  ${T(['', 'hatin', 'çûn', 'transitiv: xwarin'], [['ich', 'hat<span class="m-end">ime</span>', 'çû<span class="m-end">me</span>', '<span class="m-erg">min</span> xwar<span class="m-end">iye</span>'], ['du', 'hat<span class="m-end">iyî</span>', 'çû<span class="m-end">yî</span>', '<span class="m-erg">te</span> xwar<span class="m-end">iye</span>'], ['er/sie', 'hat<span class="m-end">iye</span>', 'çû<span class="m-end">ye</span>', '<span class="m-erg">wî/wê</span> xwar<span class="m-end">iye</span>'], ['wir/ihr/sie', 'hat<span class="m-end">ine</span>', 'çû<span class="m-end">ne</span>', '<span class="m-erg">me</span> xwar<span class="m-end">iye</span>']])}
  <p>Transitiv mit Objekt im Plural: <span class="ku">Min kutilk xwar<b>ine</b>.</span> Mit Person: <span class="ku">Min tu dît<b>iyî</b>.</span></p>
  <p><b>Wann?</b> Erfahrung (<span class="ku">Tu qet çûyî Amedê?</span> – Warst du je in Amed?), Ergebnis (<span class="ku">Ez nû hatime.</span> – Ich bin gerade angekommen), „noch nicht“ (<span class="ku">Ew hîn nehatiye.</span>).</p>`,
  vocab: [['heta niha', 'bis jetzt'], ['hîn', 'noch'], ['êdî', 'schon; nun; (verneint) nicht mehr'], ['nû', 'gerade erst; neu'], ['ceribandin', 'probieren, ausprobieren'], ['serdan', 'Besuch'], ['serdana … kirin', 'besuchen'], ['fîlm', 'Film'], ['pêşî', 'zuerst'], ['gelek caran', 'oft']],
  dlg: [['A', 'Tu qet çûyî Mêrdînê?', 'Warst du schon einmal in Mêrdîn?'], ['B', 'Erê, ez du caran çûme. Lê ez hîn neçûme Sêrtê.', 'Ja, zweimal. Aber in Sêrt war ich noch nicht.'], ['A', 'Te qet kutilkên Amedê ceribandine?', 'Hast du schon die Kutilk aus Amed probiert?'], ['B', 'Bê guman! Min gelek caran xwarine.', 'Natürlich! Ich habe sie oft gegessen.'], ['A', 'Ez nû hatime Amedê. Divê ez çi bibînim?', 'Ich bin gerade erst in Amed angekommen. Was sollte ich sehen?'], ['B', 'Te Mizgefta Mezin dîtiye? Na? Wê demê pêşî here wir!', 'Hast du die Große Moschee gesehen? Nein? Dann geh zuerst dorthin!']],
  s: [['Ez nû hatime.', 'Ich bin gerade angekommen.'], ['Tu qet çûyî Amedê?', 'Warst du schon einmal in Amed?'], ['Min ev fîlm dîtiye.', 'Ich habe diesen Film gesehen.'], ['Ew hîn nehatiye.', 'Er ist noch nicht gekommen.'], ['Te nan xwariye?', 'Hast du schon gegessen?'], ['Em heta niha du caran çûne Wanê.', 'Wir waren bis jetzt zweimal in Wan.']],
  g: [['Ez nû ___. (bin gekommen)', 'hatime', ['hatime', 'hatim', 'têm'], ''], ['Ew hîn ___. (ist nicht gekommen)', 'nehatiye', ['nehatiye', 'nehat', 'nayê'], ''], ['Min ev fîlm ___. (habe gesehen)', 'dîtiye', ['dîtiye', 'dîtime', 'dibînim'], 'transitiv, Objekt Sg. → -iye'], ['Em du caran ___ Wanê. (sind gewesen)', 'çûne', ['çûne', 'çûn', 'diçin'], ''], ['Te nan ___? (hast gegessen)', 'xwariye', ['xwariye', 'xwar', 'dixwî'], ''], ['Min kutilk gelek caran ___. (Pl.)', 'xwarine', ['xwarine', 'xwariye', 'xwarin'], 'Plural-Objekt → -ine']],
  dia: `<p><b>Te nan xwariye?</b> (Hast du schon gegessen?) ist in Amed fast eine Begrüßung. Wer Nein sagt, sitzt gleich am Tisch. Im schnellen Sprechen klingen die Endungen oft wie <i>hatye, xwarye</i>.</p>` },

{ id: 'b1-5', lv: 'B1', title: 'Berî ku …', sub: 'Plusquamperfekt und Zeitfolge', goal: 'Du ordnest Ereignisse zeitlich: vorher, nachher, bis.',

  ${T(['', 'intransitiv: hatin', 'transitiv: hiştin'], [['ich', 'ez hat<span class="m-end">ibûm</span>', '<span class="m-erg">min</span> hişt<span class="m-end">ibû</span>'], ['du', 'tu hat<span class="m-end">ibûyî</span>', '<span class="m-erg">te</span> hişt<span class="m-end">ibû</span>'], ['er/sie', 'ew hat<span class="m-end">ibû</span>', '<span class="m-erg">wî/wê</span> hişt<span class="m-end">ibû</span>'], ['Plural', 'em hat<span class="m-end">ibûn</span>', '<span class="m-erg">me</span> hişt<span class="m-end">ibû</span>']])}
  <h4>Zeit-Bindewörter</h4>${T(['', 'danach folgt', 'Beispiel'], [['berî ku (bevor)', 'Subjunktiv', 'Berî ku tu biçî, were vir.'], ['piştî ku (nachdem)', 'Vergangenheit', 'Piştî ku me xwar, em derketin.'], ['dema ku / gava ku (als)', 'Vergangenheit', 'Gava ku ez hatim …'], ['heta ku (bis)', 'Subjunktiv', 'Heta ku tu bêyî, ez li vir im.']])}`,
  vocab: [['berî ku', 'bevor'], ['piştî ku', 'nachdem'], ['gava ku', 'als, wenn'], ['heta ku', 'bis'], ['jixwe', 'sowieso, ja schon'], ['piştre', 'danach'], ['telefon', 'Telefon'], ['telefon kirin', 'anrufen'], ['dest pê kirin', 'anfangen'], ['poşman', 'bereuend'], ['şaş', 'falsch; verwirrt']],
  dlg: [['A', 'Tu çima dereng mayî?', 'Warum hast du dich verspätet?'], ['B', 'Dema ku ez gihîştim rawestgehê, otobus jixwe çûbû.', 'Als ich an der Haltestelle ankam, war der Bus schon weg.'], ['A', 'Te telefon nekir?', 'Hast du nicht angerufen?'], ['B', 'Min dixwest telefon bikim, lê min telefona xwe li malê hiştibû!', 'Ich wollte anrufen, aber ich hatte mein Telefon zu Hause gelassen!'], ['A', 'Baş e. Berî ku em dest pê bikin, rûne û çayek vexwe.', 'Gut. Bevor wir anfangen, setz dich und trink einen Tee.']],
  s: [['Otobus çûbû.', 'Der Bus war schon abgefahren.'], ['Min telefona xwe li malê hiştibû.', 'Ich hatte mein Telefon zu Hause gelassen.'], ['Berî ku tu biçî, were vir.', 'Bevor du gehst, komm her.'], ['Piştî ku me nan xwar, em derketin.', 'Nachdem wir gegessen hatten, gingen wir hinaus.'], ['Gava ku ez hatim, ew raketibû.', 'Als ich kam, war er eingeschlafen.'], ['Heta ku tu bêyî, ez ê li vir bimînim.', 'Bis du kommst, bleibe ich hier.']],
  g: [['Dema ku ez gihîştim, otobus ___. (war weg)', 'çûbû', ['çûbû', 'çû', 'diçû'], ''], ['Min telefon li malê ___. (hatte gelassen)', 'hiştibû', ['hiştibû', 'hişt', 'dihêlim'], ''], ['Berî ku tu ___, were vir. (gehst)', 'biçî', ['biçî', 'çûyî', 'diçî'], 'berî ku + Subjunktiv'], ['Piştî ku me nan ___, em derketin.', 'xwar', ['xwar', 'bixwin', 'dixwin'], 'piştî ku + Vergangenheit'], ['Ew ___. (war eingeschlafen)', 'raketibû', ['raketibû', 'raket', 'radikeve'], ''], ['Em ___. (waren gekommen)', 'hatibûn', ['hatibûn', 'hatin', 'hatibû'], '']],
  dia: `<p>Im Gespräch hörst du statt dema ku oft <b>wextê ku</b>, und das türkische <i>zaten</i> statt <b>jixwe</b>. Versuch bewusst jixwe zu sagen. Ältere Sprecher lieben das Wort.</p>` }
);

{ id: 'b1-6', lv: 'B1', title: 'Yê ku …', sub: 'Relativsätze mit ku', goal: 'Du verbindest Sätze mit „der, die, das“.',
  th: `<p>Ein Relativsatz hängt mit <b>Ezafe + ku</b> am Nomen:</p>
  ${EX([['mirov<b>ê ku</b> hat', 'der Mann, der kam'], ['jin<b>a ku</b> min dît', 'die Frau, die ich sah'], ['pirtûk<b>ên ku</b> te kirîn', 'die Bücher, die du gekauft hast']])}
  <p>Im Relativsatz gilt die normale Grammatik: <span class="ku">jina ku <b>min</b> dît</span> ist ergativ, weil dîtin transitiv ist.</p>
  <h4>Mit Präposition: das Rückverweis-Pronomen</h4><p>„Die Stadt, <i>in der</i> ich lebe“ = <span class="ku">bajarê ku ez <b>lê</b> dijîm</span> (lê = li + ihr). Ebenso <span class="ku">jê</span> (ji + …), <span class="ku">pê</span> (bi + …), <span class="ku">tê</span> (di + …).</p>
  <h4>Ohne Nomen</h4><p><span class="ku">Yê ku</span> (der, welcher), <span class="ku">ya ku</span> (die; das, was), <span class="ku">yên ku</span> (die, Pl.): <span class="ku">Ya ku tu dibêjî rast e.</span> (Was du sagst, stimmt.)</p>`,
  vocab: [['ku', 'der/die/das (Relativ); dass'], ['yê ku', 'derjenige, der'], ['ya ku', 'das, was; diejenige, die'], ['yên ku', 'diejenigen, die'], ['lê', 'darin, dort (li + ihm/ihr)'], ['jê', 'davon, von ihm/ihr'], ['pê', 'damit, mit ihm/ihr'], ['cîran', 'Nachbar/in'], ['sekinîn', 'stehen bleiben, stehen'], ['wêne', 'Bild, Foto'], ['bîr', 'Gedächtnis, Erinnerung']],
  dlg: [['A', 'Ew mirovê ku li ber derî sekiniye kî ye?', 'Wer ist der Mann, der vor der Tür steht?'], ['B', 'Ew cîranê me ye, yê ku li Almanyayê dixebitî.', 'Das ist unser Nachbar, der in Deutschland gearbeitet hat.'], ['A', 'Ha, ew mirovê ku diyarî ji te re anîbû?', 'Ach, der Mann, der dir ein Geschenk mitgebracht hatte?'], ['B', 'Erê. Pirtûka ku ez niha dixwînim, wî daye min.', 'Ja. Das Buch, das ich gerade lese, hat er mir gegeben.'], ['A', 'Bajarê ku ew lê dijî kîjan e?', 'Welche Stadt ist es, in der er lebt?'], ['B', 'Frankfurt. Ya ku ez nizanim ev e: çima ew vegeriya!', 'Frankfurt. Was ich nicht weiß: warum er zurückgekehrt ist!']],
  s: [['Mirovê ku hat bavê min e.', 'Der Mann, der kam, ist mein Vater.'], ['Jina ku min dît mamoste ye.', 'Die Frau, die ich sah, ist Lehrerin.'], ['Pirtûka ku tu dixwînî xweş e?', 'Ist das Buch, das du liest, gut?'], ['Bajarê ku ez lê dijîm mezin e.', 'Die Stadt, in der ich lebe, ist groß.'], ['Ya ku tu dibêjî rast e.', 'Was du sagst, stimmt.'], ['Yê ku zû radibe, gelek dike.', 'Wer früh aufsteht, schafft viel.']],
  g: [['Mirov___ ku hat bavê min e.', 'ê', ['ê', 'a', 'ên'], 'Ezafe vor ku: mirov ist männlich'], ['Jin___ ku min dît mamoste ye.', 'a', ['a', 'ê', 'î'], 'jin ist weiblich'], ['Pirtûk___ ku min kirîn li ser masê ne.', 'ên', ['ên', 'a', 'ê'], 'Plural'], ['Bajarê ku ez ___ dijîm mezin e.', 'lê', ['lê', 'li', 'jê'], 'li + Pronomen → lê'], ['___ ku tu dibêjî rast e. (das, was)', 'Ya', ['Ya', 'Yê', 'Yên'], ''], ['Mirovê ___ hat bavê min e.', 'ku', ['ku', 'kê', 'ka'], '']],
  dia: `<p>Gesprochen wird <b>ku</b> oft zu <b>ko</b> oder schrumpft zu einem bloßen <b>k’</b>: <i>mirovê k’hat</i>. In älteren Texten liest du auch <b>ko</b>, das ist dieselbe Partikel.</p>` },

{ id: 'b1-7', lv: 'B1', title: 'Ji ber ku', sub: 'Gründe, Bedingungen, Ziele', goal: 'Du begründest, stellst Bedingungen und drückst Absichten aus.',
  th: `${T(['Bindewort', 'Bedeutung', 'Verbform danach'], [['ji ber ku / çimkî', 'weil, denn', 'normal (Indikativ)'], ['lewma / loma / ji ber vê yekê', 'deshalb', 'normal'], ['heke / eger / ger', 'wenn, falls', 'Subjunktiv (Zukunft) oder Präsens'], ['da ku', 'damit, um zu', 'Subjunktiv'], ['bêyî ku', 'ohne dass', 'Subjunktiv'], ['tevî ku', 'obwohl', 'normal'], ['ku', 'dass', 'normal']])}
  ${EX([['Heke tu bêyî, em ê biçin.', 'Wenn du kommst, gehen wir.'], ['Ez dixebitim da ku pere qezenc bikim.', 'Ich arbeite, um Geld zu verdienen.'], ['Tevî ku ew westiyayî bû, ew hat.', 'Obwohl sie müde war, kam sie.']])}`,
  vocab: [['ji ber ku', 'weil'], ['çimkî', 'weil, denn'], ['lewma', 'deshalb'], ['heke', 'wenn, falls'], ['eger', 'wenn, falls'], ['da ku', 'damit'], ['bêyî ku', 'ohne dass'], ['tevî ku', 'obwohl'], ['îşev', 'heute Abend/Nacht'], ['qedîn', 'enden, fertig werden'], ['mijûl', 'beschäftigt'], ['qezenc kirin', 'verdienen, gewinnen'], ['fêm kirin', 'verstehen'], ['cih', 'Platz']],
  dlg: [['A', 'Tu yê îşev bêyî şahiyê?', 'Kommst du heute Abend zur Feier?'], ['B', 'Nizanim. Heke karê min biqede, ez ê bêm.', 'Weiß nicht. Wenn ich mit der Arbeit fertig werde, komme ich.'], ['A', 'Were! Ji ber ku Rojda jî tê, divê tu jî bêyî.', 'Komm! Weil Rojda auch kommt, musst du auch kommen.'], ['B', 'Baş e, lê ez ê dereng bêm, çimkî ez pir mijûl im.', 'Okay, aber ich komme spät, denn ich bin sehr beschäftigt.'], ['A', 'Ez ê ji te re cih bigirim, da ku tu li ber derî nemînî.', 'Ich halte dir einen Platz frei, damit du nicht an der Tür stehen bleibst.']],
  s: [['Ez nayêm, ji ber ku ez nexweş im.', 'Ich komme nicht, weil ich krank bin.'], ['Heke tu bêyî, em ê biçin.', 'Wenn du kommst, gehen wir.'], ['Ez dixebitim da ku pere qezenc bikim.', 'Ich arbeite, um Geld zu verdienen.'], ['Tevî ku ew westiyayî bû, ew hat.', 'Obwohl sie müde war, kam sie.'], ['Ez dizanim ku tu rast dibêjî.', 'Ich weiß, dass du die Wahrheit sagst.'], ['Baran dibare, lewma em li malê dimînin.', 'Es regnet, deshalb bleiben wir zu Hause.']],
  g: [['Ez nayêm, ___ ez nexweş im. (weil)', 'ji ber ku', ['ji ber ku', 'da ku', 'heke'], ''], ['___ tu bêyî, em ê biçin. (wenn)', 'Heke', ['Heke', 'Da ku', 'Lewma'], ''], ['Ez dixebitim da ku pere qezenc ___.', 'bikim', ['bikim', 'dikim', 'kir'], 'da ku + Subjunktiv'], ['___ ku ew westiyayî bû, ew hat. (obwohl)', 'Tevî', ['Tevî', 'Ji ber', 'Heta'], ''], ['Baran dibare, ___ em li malê dimînin. (deshalb)', 'lewma', ['lewma', 'çimkî', 'heke'], ''], ['Ez dizanim ___ tu rast dibêjî. (dass)', 'ku', ['ku', 'da', 'ji'], '']],
  dia: `<p>In Amed hörst du für „wenn“ sehr oft die Kurzform <b>ger</b>: <i>ger tu bêyî …</i>. Für „da ja, wo doch“ benutzen viele das Lehnwort <b>madem</b>. Rein kurdisch wäre <b>mademkî</b> oder <b>ji ber ku</b>.</p>` },

{ id: 'b1-8', lv: 'B1', title: 'Xwe û hev', sub: 'Reflexiv und reziprok', goal: 'Du benutzt „sich, selbst, einander“ richtig.',
  th: `<p><b>xwe</b> ersetzt jedes Pronomen, das sich auf das Subjekt desselben Satzes bezieht:</p>
  ${EX([['Ez mala <b>xwe</b> paqij dikim.', 'Ich putze mein (eigenes) Haus. Falsch wäre: mala min'], ['Ew bavê <b>xwe</b> dibîne.', 'Er sieht seinen (eigenen) Vater.'], ['Ew bavê <b>wî</b> dibîne.', 'Er sieht dessen Vater (einer anderen Person).'], ['Ew <b>xwe</b> dişo.', 'Er wäscht sich.']])}
  <p><b>bi xwe</b> = selbst: <span class="ku">Ez bi xwe hatim.</span> <b>ji xwe re</b> = für sich: <span class="ku">Ew ji xwe re dixwîne.</span></p>
  <p><b>hev / hevdu</b> = einander: <span class="ku">Em hev dibînin.</span> (Wir sehen uns.) <span class="ku">Ew ji hev hez dikin.</span> <span class="ku">bi hev re</span> = miteinander.</p>`,
  vocab: [['xwe', 'sich; eigen'], ['bi xwe', 'selbst'], ['hev', 'einander'], ['hevdu', 'einander'], ['paqij', 'sauber'], ['paqij kirin', 'putzen'], ['amade', 'bereit, fertig'], ['cil', 'Kleidung'], ['li xwe kirin', 'anziehen'], ['kor', 'blind'], ['cuda', 'verschieden'], ['şuştin', 'waschen (dişo)']],
  dlg: [['A', 'Tu xwe amade dikî? Dereng e!', 'Machst du dich fertig? Es ist spät!'], ['B', 'Erê, ez cilên xwe li xwe dikim.', 'Ja, ich ziehe mich an.'], ['A', 'Em ê Azad û Rojdayê bibînin?', 'Treffen wir Azad und Rojda?'], ['B', 'Erê. Ew ji hev hez dikin, tu dizanî?', 'Ja. Die beiden lieben sich, weißt du das?'], ['A', 'Bi rastî? Wan bi xwe ji te re got?', 'Wirklich? Haben sie es dir selbst gesagt?'], ['B', 'Na, lê ew her roj hev dibînin û alîkariya hev dikin. Ez ne kor im!', 'Nein, aber sie treffen sich jeden Tag und helfen einander. Ich bin nicht blind!']],
  s: [['Ez mala xwe paqij dikim.', 'Ich putze mein Haus.'], ['Ew xwe dişo.', 'Er wäscht sich.'], ['Em hev dibînin.', 'Wir sehen uns.'], ['Ez bi xwe hatim.', 'Ich bin selbst gekommen.'], ['Ew ji hev hez dikin.', 'Sie lieben einander.'], ['Cilên xwe li xwe bike!', 'Zieh dich an!']],
  g: [['Ez mala ___ paqij dikim.', 'xwe', ['xwe', 'min', 'ez'], 'Besitzer = Subjekt → xwe'], ['Ew bavê ___ dibîne. (seinen eigenen)', 'xwe', ['xwe', 'wî', 'wê'], ''], ['Em ___ dibînin. (einander)', 'hev', ['hev', 'xwe', 'me'], ''], ['Ez ___ xwe hatim. (selbst)', 'bi', ['bi', 'ji', 'li'], ''], ['Azad û Rojda ji ___ hez dikin.', 'hev', ['hev', 'xwe', 'wan'], ''], ['Ew bavê ___ dibîne. (den Vater eines anderen Mannes)', 'wî', ['wî', 'xwe', 'min'], 'Bezug nicht auf das Subjekt → wî']],
  dia: `<p><b>xwe</b> klingt in vielen Dörfern wie <b>xo</b> oder <b>xe</b>. In westlichen Dialekten wird xwe auch dort benutzt, wo der Standard wî/wê verlangt. Im Süden, also in Amed und Êlih, hält man sich an die Regel oben.</p>` },

{ id: 'b1-9', lv: 'B1', title: 'Rabe, derkeve!', sub: 'Verben mit Vorsilben', goal: 'Du konjugierst Verben mit ra-, ve-, der-, hil-, da-, wer-.',
  th: `<p>Vorsilben (Präverbien) bleiben vorne, alle Zeit- und Verneinungssilben kommen <b>dazwischen</b>:</p>
  ${T(['', 'Präsens', 'verneint', 'Vergangenheit', 'Subjunktiv'], [['rabûn (aufstehen)', 'ra<span class="m-pre">di</span>bim', 'ra<span class="m-pre">na</span>bim', 'rabûm / ra<span class="m-pre">ne</span>bûm', 'rabim'], ['vexwarin (trinken)', 've<span class="m-pre">di</span>xwim', 've<span class="m-pre">na</span>xwim', 'min vexwar', 'vexwim'], ['derketin (hinausgehen)', 'der<span class="m-pre">di</span>kevim', 'der<span class="m-pre">na</span>kevim', 'derketim', 'derkevim'], ['hilgirtin (aufheben)', 'hil<span class="m-pre">di</span>girim', 'hil<span class="m-pre">na</span>girim', 'min hilgirt', 'hilgirim']])}
  <p>Im Subjunktiv und Imperativ fällt <b>bi-</b> meist weg: <span class="ku">rabe! vexwe! derkeve! hilgire!</span></p>
  <p>Weitere: <span class="ku">vekirin</span> (öffnen), <span class="ku">vegerîn</span> (zurückkehren), <span class="ku">vemirandin</span> (ausmachen), <span class="ku">derxistin</span> (herausnehmen), <span class="ku">daketin</span> (hinuntergehen), <span class="ku">danîn</span> (hinlegen: datînim), <span class="ku">wergerandin</span> (übersetzen).</p>`,
  vocab: [['ra-', 'Vorsilbe: auf, hoch'], ['ve-', 'Vorsilbe: auf, wieder, zurück'], ['der-', 'Vorsilbe: hinaus'], ['hil-', 'Vorsilbe: hoch'], ['da-', 'Vorsilbe: hinab'], ['vemirandin', 'ausmachen, löschen'], ['derxistin', 'herausnehmen'], ['daketin', 'hinuntergehen, aussteigen'], ['danîn', 'hinlegen, abstellen'], ['wergerandin', 'übersetzen'], ['çira', 'Lampe, Licht'], ['nivîs', 'Text, Schrift']],
  dlg: [['A', 'Rabe, saet heft e!', 'Steh auf, es ist sieben!'], ['B', 'Ez rabûm, ez rabûm … Ez ê pêşî qehweyekê vexwim.', 'Bin ja schon auf … Ich trinke zuerst einen Kaffee.'], ['A', 'Pencereyê veke, hewa xweş e. Çirayê jî vemirîne.', 'Öffne das Fenster, die Luft ist schön. Mach auch das Licht aus.'], ['B', 'Baş e. Tu kengê derdikevî?', 'Okay. Wann gehst du los?'], ['A', 'Saet heşt. Çenteyê min hilgire û bide min, ji kerema xwe.', 'Um acht. Heb bitte meine Tasche auf und gib sie mir.']],
  s: [['Ez ranabim!', 'Ich stehe nicht auf!'], ['Pencereyê veke.', 'Öffne das Fenster.'], ['Ew saet heşt derdikeve.', 'Er geht um acht los.'], ['Çirayê vemirîne.', 'Mach das Licht aus.'], ['Me çay venexwar.', 'Wir haben keinen Tee getrunken.'], ['Wê ev nivîs wergerand.', 'Sie hat diesen Text übersetzt.']],
  g: [['Ez saet heşt ___. (gehe hinaus)', 'derdikevim', ['derdikevim', 'diderkevim', 'derkevim'], 'Vorsilbe + di + Stamm'], ['Ez ___! (stehe nicht auf)', 'ranabim', ['ranabim', 'narabim', 'ranebim'], 'Vorsilbe + na + Stamm'], ['Pencereyê ___! (öffne)', 'veke', ['veke', 'bivekê', 'vedike'], ''], ['Me çay ___. (tranken nicht)', 'venexwar', ['venexwar', 'nevexwar', 'venaxwar'], 'Vergangenheit: Vorsilbe + ne'], ['Divê ez ___. (hinausgehen)', 'derkevim', ['derkevim', 'biderkevim', 'derdikevim'], 'Subjunktiv ohne bi-'], ['Çenteyê min ___! (heb auf)', 'hilgire', ['hilgire', 'bihilgire', 'hildigire'], '']],
  dia: `<p>Ganz im Süden, etwa um Midyat, verschmelzen manche Vorsilben so fest mit dem Verb, dass di- und ne- davor rutschen. Für die Region Amed und Êlih gilt die Standardreihenfolge oben. Auf dem Markt hörst du oft <b>dakeve!</b> (Steig aus!) im Bus und <b>derkeve!</b> (Raus!) bei Kindern.</p>` },

{ id: 'b1-10', lv: 'B1', title: 'Hebû tunebû', sub: 'Geschichten erzählen', goal: 'Du kannst eine einfache Geschichte erzählen und verstehen.',
  th: `<p>Kurdische Märchen beginnen mit <span class="ku">Hebû tunebû …</span> (wörtl. „Es gab, es gab nicht“, also: Es war einmal) und enden oft mit <span class="ku">Çîroka me li vir qediya.</span> (Hier endet unsere Geschichte.)</p>
  <h4>Bausteine einer Erzählung</h4>${T(['Kurmancî', 'Bedeutung'], [['rojekê', 'eines Tages'], ['ji nişkê ve', 'plötzlich'], ['di cih de', 'sofort'], ['piştre / paşê', 'danach'], ['di dawiyê de', 'am Ende'], ['bi vî awayî', 'auf diese Weise']])}
  <p><b>Zeiten mischen:</b> Hintergrund in der Verlaufsform (<span class="ku">ew pir birçî bû, li xwarinê digeriya</span>), Ereignisse in der einfachen Vergangenheit (<span class="ku">wî qijikek dît</span>).</p>
  <p>Direkte Rede mit <span class="ku">got:</span> (sagte). In mündlichen Erzählungen wird daraus oft nur <span class="ku">go</span>.</p>`,
  vocab: [['hebû tunebû', 'es war einmal'], ['rojekê', 'eines Tages'], ['ji nişkê ve', 'plötzlich'], ['di cih de', 'sofort'], ['di dawiyê de', 'am Ende'], ['rovî', 'Fuchs'], ['gur', 'Wolf'], ['qijik', 'Krähe'], ['şivan', 'Hirte'], ['aqil', 'Verstand'], ['xapandin', 'überlisten, betrügen'], ['revîn', 'fliehen'], ['qediyan', 'enden'], ['dev', 'Mund; Schnabel']],
  dlg: [['A', 'Dapîrê, çîrokekê ji me re bêje!', 'Oma, erzähl uns eine Geschichte!'], ['B', 'Hebû tunebû, rovîyek hebû. Rojekê ew pir birçî bû.', 'Es war einmal ein Fuchs. Eines Tages war er sehr hungrig.'], ['A', 'Paşê çi bû?', 'Was passierte dann?'], ['B', 'Wî li ser darê qijikek dît. Di devê wê de perçeyek penîr hebû.', 'Er sah eine Krähe auf einem Baum. Sie hatte ein Stück Käse im Schnabel.'], ['B', 'Rovî got: „Dengê te çiqas xweş e! Ji min re stranekê bêje!“', 'Der Fuchs sagte: „Wie schön deine Stimme ist! Sing mir ein Lied!“'], ['A', 'Û qijikê stran got?', 'Und die Krähe sang?'], ['B', 'Erê. Wê devê xwe vekir, penîr ket û rovî di cih de ew xwar. Çîroka me li vir qediya!', 'Ja. Sie öffnete den Schnabel, der Käse fiel, und der Fuchs fraß ihn sofort. Hier endet unsere Geschichte!']],
  s: [['Hebû tunebû, rovîyek hebû.', 'Es war einmal ein Fuchs.'], ['Rojekê ew pir birçî bû.', 'Eines Tages war er sehr hungrig.'], ['Ji nişkê ve baran dest pê kir.', 'Plötzlich fing es an zu regnen.'], ['Rovî di cih de penîr xwar.', 'Der Fuchs fraß sofort den Käse.'], ['Di dawiyê de gur reviya.', 'Am Ende floh der Wolf.'], ['Çîroka me li vir qediya.', 'Hier endet unsere Geschichte.']],
  g: [['___ tunebû, rovîyek hebû.', 'Hebû', ['Hebû', 'Heye', 'Hebe'], ''], ['___ ew pir birçî bû. (eines Tages)', 'Rojekê', ['Rojekê', 'Îro', 'Her roj'], ''], ['Rovî ___: „Dengê te xweş e!“ (sagte)', 'got', ['got', 'gotin', 'dibêje'], ''], ['Qijikê dev___ xwe vekir.', 'ê', ['ê', 'a', 'ên'], 'dev ist männlich'], ['Penîr ___. (fiel)', 'ket', ['ket', 'dikeve', 'ketin'], 'ketin ist intransitiv'], ['Rovî penîr ___. (fraß)', 'xwar', ['xwar', 'xwarin', 'dixwar'], '']],
  dia: `<p>In alten Aufnahmen aus der Region um Midyat beginnt fast jeder zweite Satz mit <b>go</b> (sagte er). Viele Erzähler schließen mit der Formel <b>Ew gihîştin miradê xwe, em jî bigihîjin miradê xwe</b> (Sie erreichten ihren Wunsch, mögen auch wir unseren erreichen).</p>` }
);

{ id: 'b2-1', lv: 'B2', title: 'Tê gotin', sub: 'Das Passiv', goal: 'Du bildest und verstehst Passivsätze, wie sie in Nachrichten vorkommen.',
  th: `<p>Passiv = <b>hatin</b> (kommen) als Hilfsverb + <b>Infinitiv</b>. Das Hilfsverb trägt Zeit und Person:</p>
  ${T(['Zeit', 'Form', 'Beispiel'], [['Präsens', 'tê + Infinitiv', 'Nan <b>tê</b> xwarin. (Brot wird gegessen.)'], ['Vergangenheit', 'hat + Infinitiv', 'Pir <b>hat</b> avakirin. (Die Brücke wurde gebaut.)'], ['Perfekt', 'hatiye + Infinitiv', 'Pir <b>hatiye</b> nûkirin. (… ist renoviert worden.)'], ['Futur', 'ê bê + Infinitiv', 'Ew <b>ê bê</b> girtin. (… wird geschlossen werden.)'], ['nach divê', 'bê + Infinitiv', 'Divê ev <b>bê</b> parastin.']])}
  <p>Mehrzahl: <span class="ku">Pirtûk <b>hatin</b> çapkirin.</span> (Die Bücher wurden gedruckt.)</p>
  <p>Der Handelnde mit <b>ji aliyê … ve</b>: <span class="ku">ji aliyê mamoste ve</span> (von der Lehrerin).</p>
  <p>Sehr häufig unpersönlich: <span class="ku">tê gotin ku …</span> (man sagt, dass …), <span class="ku">tê zanîn</span> (es ist bekannt), <span class="ku">hat ragihandin</span> (es wurde bekanntgegeben).</p>`,
  vocab: [['avakirin', 'bauen, errichten'], ['çapkirin', 'drucken'], ['nûkirin', 'erneuern, renovieren'], ['parastin', 'schützen (diparêze)'], ['bikaranîn', 'benutzen'], ['ragihandin', 'bekanntgeben'], ['ji aliyê … ve', 'von, durch (Passiv)'], ['tê gotin', 'man sagt'], ['dîrok', 'Geschichte (Historie)'], ['sedsal', 'Jahrhundert'], ['kevnar', 'antik, uralt'], ['peya', 'Fußgänger/in']],
  dlg: [['A', 'Ev pir kengê hatiye avakirin?', 'Wann wurde diese Brücke gebaut?'], ['B', 'Tê gotin ku ew di sala 1065an de, di dema Merwaniyan de hatiye avakirin.', 'Es heißt, sie wurde im Jahr 1065 zur Zeit der Marwaniden gebaut.'], ['A', 'Ew hîn jî tê bikaranîn?', 'Wird sie noch benutzt?'], ['B', 'Berê erebe jî di ser re derbas dibûn, lê niha tenê peya di ser re derbas dibin.', 'Früher fuhren auch Autos darüber, heute gehen nur noch Fußgänger hinüber.'], ['A', 'Divê ev cih bê parastin.', 'Dieser Ort muss geschützt werden.']],
  s: [['Nan tê xwarin.', 'Das Brot wird gegessen.'], ['Pir hat avakirin.', 'Die Brücke wurde gebaut.'], ['Tê gotin ku ew hatiye.', 'Man sagt, dass er gekommen ist.'], ['Ev pirtûk ji aliyê Celadet ve hat nivîsîn.', 'Dieses Buch wurde von Celadet geschrieben.'], ['Derî hat girtin.', 'Die Tür wurde geschlossen.'], ['Divê ev cih bê parastin.', 'Dieser Ort muss geschützt werden.']],
  g: [['Nan ___ xwarin. (wird)', 'tê', ['tê', 'hat', 'bê'], 'Präsens-Passiv: tê'], ['Pir ___ avakirin. (wurde)', 'hat', ['hat', 'tê', 'hatin'], ''], ['Pirtûk ___ çapkirin. (wurden)', 'hatin', ['hatin', 'hat', 'tên'], 'Plural'], ['Divê ev cih ___ parastin.', 'bê', ['bê', 'tê', 'hat'], 'nach divê: Subjunktiv von hatin'], ['___ gotin ku ew nexweş e. (man sagt)', 'Tê', ['Tê', 'Hat', 'Dibe'], ''], ['Ji ___ mamoste ve hat nivîsîn.', 'aliyê', ['aliyê', 'ber', 'bo'], 'ji aliyê … ve']],
  dia: `<p>Im Gespräch bevorzugen die Leute das Aktiv mit „sie“: <i>Wan pir ava kir</i> (Sie haben die Brücke gebaut). Das Passiv begegnet dir vor allem in Nachrichten: <i>hat ragihandin, hat gotin, tê payîn</i> (es wird erwartet).</p>` },

{ id: 'b2-2', lv: 'B2', title: 'Kenandin', sub: 'Kausativ: jemanden etwas tun lassen', goal: 'Du bildest aus „lachen“ „zum Lachen bringen“ und unterscheidest bûn/kirin.',
  th: `<p>Aus vielen intransitiven Verben macht <b>-andin</b> ein transitives „bewirken“-Verb. Der Präsensstamm endet auf <b>-în</b>:</p>
  ${T(['Grundverb', 'Kausativ', 'Präsens'], [['kenîn (lachen)', 'kenandin (zum Lachen bringen)', 'dikenînim'], ['razan (schlafen)', 'razandin (schlafen legen)', 'dirazînim'], ['gerîn (herumgehen)', 'gerandin (herumführen)', 'digerînim'], ['qedîn (enden)', 'qedandin (beenden)', 'diqedînim'], ['tirsîn (Angst haben)', 'tirsandin (erschrecken)', 'ditirsînim'], ['şewitîn (brennen)', 'şewitandin (verbrennen)', 'dişewitînim'], ['pijîn (garen)', 'pijandin (kochen)', 'dipijînim']])}
  <h4>bûn ↔ kirin</h4><p>Bei zusammengesetzten Verben wechselt einfach das Hilfsverb: <span class="ku">fêr bûn</span> (lernen) – <span class="ku">fêr kirin</span> (lehren); <span class="ku">winda bûn</span> (verloren gehen) – <span class="ku">winda kirin</span> (verlieren); <span class="ku">xilas bûn</span> (fertig werden) – <span class="ku">xilas kirin</span> (beenden).</p>`,
  vocab: [['kenandin', 'zum Lachen bringen'], ['razandin', 'schlafen legen'], ['gerandin', 'herumführen'], ['qedandin', 'beenden'], ['tirsandin', 'erschrecken (jemanden)'], ['şewitandin', 'verbrennen'], ['pijandin', 'kochen, garen'], ['fêr kirin', 'lehren, beibringen'], ['winda bûn', 'verloren gehen'], ['winda kirin', 'verlieren'], ['xilas kirin', 'beenden; retten'], ['mifte', 'Schlüssel'], ['tarî', 'Dunkelheit; dunkel']],
  dlg: [['A', 'Tu çima dikenî?', 'Warum lachst du?'], ['B', 'Ev fîlm min pir dikenîne!', 'Dieser Film bringt mich so zum Lachen!'], ['A', 'Te zarok razandin?', 'Hast du die Kinder ins Bett gebracht?'], ['B', 'Erê, min ew razandin. Lê Berfîn ji tariyê ditirse.', 'Ja. Aber Berfîn hat Angst vor der Dunkelheit.'], ['A', 'Kê ew tirsand?', 'Wer hat sie erschreckt?'], ['B', 'Birayê wê! Wî çîrokên guran jê re gotin. Ez ê sibe pê re xeber bidim.', 'Ihr Bruder! Er hat ihr Wolfsgeschichten erzählt. Ich rede morgen mit ihm.']],
  s: [['Ev fîlm min dikenîne.', 'Dieser Film bringt mich zum Lachen.'], ['Wê zarok razand.', 'Sie hat das Kind schlafen gelegt.'], ['Ez kar diqedînim.', 'Ich beende die Arbeit.'], ['Mamoste me fêrî kurmancî dike.', 'Die Lehrerin bringt uns Kurmancî bei.'], ['Min mifteya xwe winda kir.', 'Ich habe meinen Schlüssel verloren.'], ['Wî em li bajêr gerandin.', 'Er hat uns durch die Stadt geführt.']],
  g: [['Ev fîlm min ___. (bringt zum Lachen)', 'dikenîne', ['dikenîne', 'dikene', 'kenî'], ''], ['Wê zarok ___. (legte schlafen)', 'razand', ['razand', 'raza', 'radize'], 'transitiv, ergativ'], ['Ez fêrî kurmancî ___. (lerne)', 'dibim', ['dibim', 'dikim', 'didim'], 'fêr bûn = lernen'], ['Mamoste me fêrî kurmancî ___. (lehrt)', 'dike', ['dike', 'dibe', 'dide'], 'fêr kirin = lehren'], ['Min mifteya xwe winda ___. (verloren)', 'kir', ['kir', 'bû', 'da'], 'winda kirin = verlieren'], ['Mifteya min winda ___. (ging verloren)', 'bû', ['bû', 'kir', 'hat'], 'winda bûn = verloren gehen']],
  dia: `<p>„Lernen“ und „lehren“ hörst du in der Region mit beiden Wörtern: <b>fêr bûn / fêr kirin</b> und <b>hîn bûn / hîn kirin</b>. Ein Kompliment unter Freunden: <i>Tu min dikenînî!</i> (Du bringst mich immer zum Lachen!)</p>` },

{ id: 'b2-3', lv: 'B2', title: 'Xwezî …', sub: 'Bedingungen und Wünsche', goal: 'Du drückst reale und irreale Bedingungen und Wünsche aus.',
  th: `<h4>Reale Bedingung</h4><p><b>heke / ger</b> + Subjunktiv, Hauptsatz im Futur: <span class="ku">Heke baran bibare, em ê li malê bimînin.</span></p>
  <h4>Irreale Bedingung</h4><p>Dafür gibt es einen <b>Vergangenheits-Subjunktiv</b>: bi + Vergangenheitsstamm + <b>-(y)a</b> mit Personalteil.</p>
  ${T(['', 'bûn', 'çûn', 'transitiv: gotin'], [['ich', 'bûma', 'biçûma', 'min bigota'], ['er/sie', 'bûya', 'biçûya', 'wî/wê bigota'], ['wir/sie', 'bûna', 'biçûna', 'me/wan bigota']])}
  ${EX([['Ger min zanîbûya, min ê ji te re bigota.', 'Hätte ich es gewusst, hätte ich es dir gesagt.'], ['Heke ez dewlemend bûma, ez ê bigeriyama.', 'Wenn ich reich wäre, würde ich reisen.']])}
  <h4>Wunsch</h4><p><b>xwezî</b> + Vergangenheits-Subjunktiv: <span class="ku">Xwezî ez li Amedê bûma!</span> (Wäre ich doch in Amed!) Bedauern: <span class="ku">mixabin</span> (leider).</p>`,
  vocab: [['xwezî', 'wenn doch nur'], ['mixabin', 'leider'], ['ger', 'wenn, falls'], ['heger', 'wenn, falls'], ['dewlemend', 'reich'], ['feqîr', 'arm'], ['derfet', 'Gelegenheit'], ['biryar', 'Entscheidung'], ['gerîn', 'herumreisen, spazieren'], ['heyf', 'schade']],
  dlg: [['A', 'Par ez çûm Amedê.', 'Letztes Jahr war ich in Amed.'], ['B', 'Bi rastî? Ger min zanîbûya, ez ê bi te re bihatama!', 'Wirklich? Hätte ich das gewusst, wäre ich mitgekommen!'], ['A', 'Heyf! Heke tu sala bê bêyî, em ê bi hev re biçin.', 'Schade! Wenn du nächstes Jahr mitkommst, fahren wir zusammen.'], ['B', 'Xwezî ez niha li wir bûma!', 'Wäre ich doch jetzt dort!']],
  s: [['Heke baran bibare, em ê li malê bimînin.', 'Wenn es regnet, bleiben wir zu Hause.'], ['Ger min zanîbûya, min ê ji te re bigota.', 'Hätte ich es gewusst, hätte ich es dir gesagt.'], ['Xwezî ez li Amedê bûma!', 'Wäre ich doch in Amed!'], ['Heke ez dewlemend bûma, ez ê bigeriyama.', 'Wenn ich reich wäre, würde ich reisen.'], ['Mixabin, ew nehat.', 'Leider ist er nicht gekommen.'], ['Ger tu bêyî, em ê kêfxweş bibin.', 'Wenn du kommst, werden wir uns freuen.']],
  g: [['Heke baran ___, em ê li malê bimînin.', 'bibare', ['bibare', 'barî', 'dibariya'], 'reale Bedingung: Subjunktiv'], ['Ger min ___, min ê ji te re bigota. (gewusst hätte)', 'zanîbûya', ['zanîbûya', 'zanî', 'dizanim'], ''], ['Xwezî ez li Amedê ___! (wäre)', 'bûma', ['bûma', 'bûm', 'im'], ''], ['Min ê ji te re ___. (hätte gesagt)', 'bigota', ['bigota', 'got', 'bibêjim'], ''], ['___, ew nehat. (leider)', 'Mixabin', ['Mixabin', 'Xwezî', 'Belkî'], ''], ['___ ez li wir bûma! (wenn doch nur)', 'Xwezî', ['Xwezî', 'Heke', 'Mixabin'], '']],
  dia: `<p>Die irrealen Formen schwanken von Ort zu Ort stark: <i>bûma, bûyama, biba</i> oder <i>hatibama</i> für „wäre gekommen“. Lerne die Standardformen oben und hör, wie deine Gesprächspartner es sagen. Ein Ausdruck, den du sofort benutzen kannst: <b>Xwezî!</b> (Schön wär’s!).</p>` },

{ id: 'b2-4', lv: 'B2', title: 'Wî got ku …', sub: 'Indirekte Rede und Meinungen', goal: 'Du gibst wieder, was andere sagen, und äußerst deine Meinung.',
  th: `<h4>Wiedergabe</h4><p>Nach <span class="ku">got ku</span> bleibt die Zeit des Originals meist erhalten, anders als im Deutschen: <span class="ku">Wî got ku ew ê bê.</span> (Er sagte, er werde kommen.)</p>
  <ul><li>Ja/Nein- und W-Fragen: <b>ka</b>: <span class="ku">Wê pirsî ka tu kengê têyî.</span></li><li>Aufforderungen: <b>ku</b> + Subjunktiv: <span class="ku">Wî ji min re got ku ez biçim.</span></li></ul>
  <h4>Meinung</h4>${T(['Kurmancî', 'Deutsch'], [['bi ya min / li gorî min', 'meiner Meinung nach'], ['ez bawer dikim ku …', 'ich glaube, dass …'], ['ez difikirim ku …', 'ich denke, dass …'], ['hêvî dikim ku …', 'ich hoffe, dass …'], ['xuya ye ku …', 'es scheint, dass …'], ['bê guman', 'zweifellos']])}`,
  vocab: [['ka', 'ob; (indirekte Frage)'], ['bawer kirin', 'glauben'], ['hêvî kirin', 'hoffen'], ['texmîn kirin', 'vermuten'], ['xuya ye', 'es scheint'], ['li gorî', 'laut, gemäß'], ['bi ya min', 'meiner Meinung nach'], ['derew', 'Lüge'], ['civîn', 'sich treffen, sich versammeln'], ['qey', 'anscheinend, wohl'], ['di wextê xwe de', 'pünktlich']],
  dlg: [['A', 'Azad çi got?', 'Was hat Azad gesagt?'], ['B', 'Wî got ku ew ê sibe bê, lê ez bawer nakim.', 'Er sagte, er komme morgen, aber ich glaube es nicht.'], ['A', 'Çima? Ew derewan dike?', 'Warum? Lügt er?'], ['B', 'Na, lê ew her tim dereng dimîne. Wî pirsî ka em ê li ku bicivin.', 'Nein, aber er kommt immer zu spät. Er hat gefragt, wo wir uns treffen.'], ['A', 'Ji wî re bêje ku em li çayxaneya li ber Mizgefta Mezin in.', 'Sag ihm, dass wir im Teehaus vor der Großen Moschee sind.'], ['B', 'Baş e. Hêvî dikim ku vê carê ew di wextê xwe de bê!', 'Gut. Ich hoffe, er kommt diesmal pünktlich!']],
  s: [['Wî got ku ew ê bê.', 'Er sagte, er werde kommen.'], ['Wê pirsî ka tu kengê têyî.', 'Sie fragte, wann du kommst.'], ['Ez bawer dikim ku tu rast dibêjî.', 'Ich glaube, dass du die Wahrheit sagst.'], ['Hêvî dikim ku hûn baş in.', 'Ich hoffe, dass es euch gut geht.'], ['Bi ya min, ev ne rast e.', 'Meiner Meinung nach stimmt das nicht.'], ['Xuya ye ku ew westiyayî ye.', 'Es scheint, dass er müde ist.']],
  g: [['Wî got ___ ew ê bê.', 'ku', ['ku', 'ka', 'da'], ''], ['Wê pirsî ___ tu kengê têyî.', 'ka', ['ka', 'ku', 'çi'], 'indirekte Frage: ka'], ['Wî ji min re got ku ez ___. (gehen soll)', 'biçim', ['biçim', 'diçim', 'çûm'], 'Aufforderung → Subjunktiv'], ['Ez ___ dikim ku tu rast dibêjî. (glaube)', 'bawer', ['bawer', 'hêvî', 'fêm'], ''], ['___ ya min, ev ne rast e.', 'Bi', ['Bi', 'Ji', 'Li'], ''], ['___ ye ku ew westiyayî ye. (es scheint)', 'Xuya', ['Xuya', 'Dibe', 'Divê'], '']],
  dia: `<p>Sehr typisch für die Umgangssprache: <b>qey</b> (wohl, anscheinend): <i>Qey ew nayê.</i> (Er kommt wohl nicht.) Erzählt man Gehörtes weiter, beginnt man gern mit <b>dibêjin …</b> (man sagt …).</p>` }
);

{ id: 'b2-8', lv: 'B2', title: 'Bi zarê Amedê', sub: 'Umgangssprache in Amed und Êlih', goal: 'Du verstehst die gesprochene Sprache der Region und klingst natürlich.',
  th: `<h4>Kleine Wörter mit großer Wirkung</h4>${T(['Wort', 'Funktion', 'Beispiel'], [['ka', 'wo ist …?', 'Ka Azad? (Wo ist Azad?)'], ['ma', 'etwa? doch?', 'Ma tu nizanî? (Weißt du das etwa nicht?)'], ['qey', 'wohl, anscheinend', 'Qey ew nayê.'], ['hela', 'mal, doch', 'Hela were! (Komm mal!)'], ['de', 'los, na', 'De bêje! (Na sag schon!)'], ['lo / lê', 'Anrede an Mann / Frau', 'Lo Azad! Lê Rojda!'], ['bi Xwedê', 'ehrlich, ich schwöre', 'Bi Xwedê rast e.']])}
  <h4>Herzliche Ausdrücke</h4><p><span class="ku">Heyranê te me!</span> (wörtl. „Ich bin dein Bewunderer“ – Ausdruck großer Zuneigung), <span class="ku">Ez qurban!</span> (etwa: Ich würde alles für dich geben), <span class="ku">çavên min</span> (wörtl. „meine Augen“ = mein Schatz).</p>
  <h4>Gesprochene Formen</h4><p><span class="ku">ez dibêjim → ez d’bêjim</span>, <span class="ku">min → mi</span>, <span class="ku">rojekê → rojikê</span>, <span class="ku">ez ê biçim → ezê herim</span>.</p>`,
  vocab: [['ka', 'wo ist …?'], ['ma', 'etwa? (Fragepartikel)'], ['qey', 'wohl, anscheinend'], ['hela', 'mal, doch'], ['lawo', 'Junge! (Anrede)'], ['bi Xwedê', 'ehrlich, bei Gott'], ['heyran', 'Bewunderer; Liebling'], ['qurban', 'Opfer (herzliche Floskel)'], ['ango', 'das heißt (statt „yanî“)'], ['temam', 'in Ordnung, okay'], ['keko', 'Bruder, Kumpel (Anrede)'], ['xalo', 'Onkel (Anrede für ältere Männer)']],
  dlg: [['A', 'Lo keko, ka Azad?', 'He, Kumpel, wo ist Azad?'], ['B', 'Qey li çayxaneyê ye. Ma tu nizanî? Ew her êvar li wir e.', 'Wohl im Teehaus. Weißt du das etwa nicht? Er ist jeden Abend dort.'], ['A', 'Hela telefonî wî bike. Bi Xwedê ez sê caran gerîm, min ew nedît!', 'Ruf ihn doch mal an. Ehrlich, ich habe dreimal gesucht und ihn nicht gefunden!'], ['B', 'Temam, temam. Heyran, bêhna xwe fireh bike!', 'Okay, okay. Mein Lieber, hab Geduld!']],
  s: [['Ka Azad?', 'Wo ist Azad?'], ['Qey ew nayê.', 'Er kommt wohl nicht.'], ['Ma tu nizanî?', 'Weißt du das etwa nicht?'], ['Hela were vir!', 'Komm mal her!'], ['Bi Xwedê ez rast dibêjim.', 'Ehrlich, ich sage die Wahrheit.'], ['Heyranê te me!', 'Ich hab dich so gern!']],
  g: [['___ Azad? (wo ist)', 'Ka', ['Ka', 'Ma', 'Çi'], ''], ['___ ew nayê. (wohl)', 'Qey', ['Qey', 'Ka', 'Hela'], ''], ['___ tu nizanî? (etwa)', 'Ma', ['Ma', 'Ka', 'Ku'], ''], ['___ were vir! (mal)', 'Hela', ['Hela', 'Qey', 'Ma'], ''], ['yanî → ___ (kurdisch)', 'ango', ['ango', 'jixwe', 'lê'], ''], ['zaten → ___ (kurdisch)', 'jixwe', ['jixwe', 'ango', 'qet'], '']],
  dia: `<p>Diese ganze Lektion ist Dialekt. Wichtig: Umgangssprache ist kein „schlechtes Kurdisch“. Schreib in der Standardform, aber sprich ruhig so, wie man es in Amed und Êlih spricht. Wenn du dir unsicher bist, frag: <b>Hûn li vir çawa dibêjin?</b> (Wie sagt ihr das hier?)</p>` }
);

  vocab: [['herwiha', 'ebenso, außerdem'], ['wekî din', 'außerdem'], ['ji xeynî vê', 'abgesehen davon'], ['lêbelê', 'jedoch'], ['berovajî vê', 'im Gegensatz dazu'], ['digel vê yekê', 'trotzdem'], ['nexasim', 'insbesondere'], ['bi taybetî', 'besonders'], ['wek mînak', 'zum Beispiel'], ['di encamê de', 'im Ergebnis, letztlich'], ['bi kurtî', 'kurz gesagt'], ['dêûbav', 'Eltern'], ['hêsan', 'einfach, leicht'], ['kevneşopî', 'Tradition'], ['medya', 'Medien']],
  dlg: [['A', 'Ji aliyekî ve, zarok li Almanyayê bi almanî mezin dibin; ji aliyê din ve, ziman li malê dimîne.', 'Einerseits wachsen die Kinder in Deutschland mit Deutsch auf, andererseits bleibt die Sprache im Zuhause.'], ['B', 'Rast e, lêbelê heke dêûbav bi wan re kurmancî xeber nedin, ziman winda dibe.', 'Stimmt, aber wenn die Eltern nicht Kurmancî mit ihnen sprechen, geht die Sprache verloren.'], ['A', 'Wekî din, pirtûk û medyaya kurdî jî girîng in, nexasim ji bo ciwanan.', 'Außerdem sind kurdische Bücher und Medien wichtig, insbesondere für Jugendliche.'], ['B', 'Bi kurtî: ziman bi xwe najî; divê em pê re bijîn.', 'Kurz gesagt: Eine Sprache lebt nicht von allein; wir müssen mit ihr leben.']],
  s: [['Ji aliyekî ve ew baş e, ji aliyê din ve biha ye.', 'Einerseits ist es gut, andererseits teuer.'], ['Wekî din, ez dixwazim tiştekî bibêjim.', 'Außerdem möchte ich etwas sagen.'], ['Lêbelê ev ne hêsan e.', 'Jedoch ist das nicht einfach.'], ['Bi kurtî, em amade ne.', 'Kurz gesagt, wir sind bereit.'], ['Wek mînak, dengbêjî kevneşopiyeke kevn e.', 'Zum Beispiel ist Dengbêjî eine alte Tradition.'], ['Digel vê yekê, ew hat.', 'Trotzdem ist er gekommen.']],
  g: [['Ji aliyekî ve …, ji aliyê ___ ve …', 'din', ['din', 'yek', 'pêş'], ''], ['___ din, ez dixwazim tiştekî bibêjim. (außerdem)', 'Wekî', ['Wekî', 'Bi', 'Ji'], ''], ['Bi ___, em amade ne. (kurz gesagt)', 'kurtî', ['kurtî', 'dirêjî', 'rastî'], ''], ['___ vê yekê, ew hat. (trotzdem)', 'Digel', ['Digel', 'Ji ber', 'Berî'], ''], ['___ mînak … (zum Beispiel)', 'Wek', ['Wek', 'Li', 'Bi'], ''], ['Di ___ de, me biryar da. (letztlich)', 'encamê', ['encamê', 'destpêkê', 'navê'], '']],
  dia: `<p>C1 heißt auch: das Register wechseln können. Im Teehaus von Amed klingt man mit <i>yanî</i> und <i>hem</i> natürlich. In einer Rede, einem Brief oder einem Artikel greifst du zu <b>ango, herwiha, lêbelê</b>. Beides gehört zur Sprache.</p>` },

{ id: 'c1-2', lv: 'C1', title: 'Nîqaş', sub: 'Argumentieren und Widersprechen', goal: 'Du vertrittst eine Position, gehst auf Gegenargumente ein und widersprichst höflich.',
  th: `<h4>Aufbau eines Arguments</h4><ol><li>These: <span class="ku">Ez difikirim ku …</span></li><li>Begründung: <span class="ku">ji ber ku …</span></li><li>Beispiel: <span class="ku">wek mînak …</span></li><li>Gegenargument: <span class="ku">Hinek kes dibêjin ku …, lêbelê …</span></li><li>Schluss: <span class="ku">Di encamê de …</span></li></ol>
  <h4>Höflich zustimmen und widersprechen</h4>${T(['Kurmancî', 'Deutsch'], [['Ez bi te re hemfikir im.', 'Ich bin deiner Meinung.'], ['Ez tevlî vê ramanê dibim.', 'Ich schließe mich diesem Gedanken an.'], ['Dibe ku tu rast bî, lê …', 'Vielleicht hast du recht, aber …'], ['Ez bi te re ne hemfikir im.', 'Ich sehe das anders.'], ['Ev xaleke girîng e.', 'Das ist ein wichtiger Punkt.'], ['Destûrê bide ez tiştekî zêde bikim.', 'Erlaube mir, etwas hinzuzufügen.']])}`,
  vocab: [['nîqaş', 'Diskussion'], ['raman', 'Gedanke, Idee'], ['hemfikir', 'gleicher Meinung'], ['xal', 'Punkt'], ['delîl', 'Beweis, Beleg'], ['îdia', 'Behauptung'], ['rexne', 'Kritik'], ['rexne kirin', 'kritisieren'], ['piştgirî', 'Unterstützung'], ['tevlî … bûn', 'sich anschließen, teilnehmen'], ['armanc', 'Ziel'], ['dijwar', 'schwierig, hart'], ['wergirtin', 'übernehmen, erhalten'], ['bikaranîn', 'benutzen']],
  dlg: [['A', 'Ez difikirim ku divê em peyvên tirkî ji axaftina xwe derxin.', 'Ich finde, wir sollten die türkischen Wörter aus unserer Sprache entfernen.'], ['B', 'Dibe ku tu rast bî, lê ziman her tim ji hev peyvan werdigirin.', 'Vielleicht hast du recht, aber Sprachen übernehmen immer Wörter voneinander.'], ['A', 'Ev xaleke girîng e. Lêbelê dema ku peyveke kurdî heye, çima em ya tirkî bi kar bînin?', 'Das ist ein wichtiger Punkt. Aber wenn es ein kurdisches Wort gibt, warum das türkische benutzen?'], ['B', 'Ez tevlî vê ramanê dibim, lê divê em kesên ku wisa xeber didin rexne nekin.', 'Dem schließe ich mich an, aber wir sollten Menschen, die so sprechen, nicht kritisieren.'], ['A', 'Bi rastî jî. Di encamê de, armanc ew e ku ziman bijî.', 'In der Tat. Letztlich ist das Ziel, dass die Sprache lebt.']],
  s: [['Ez bi te re hemfikir im.', 'Ich bin deiner Meinung.'], ['Ez bi te re ne hemfikir im.', 'Ich sehe das anders.'], ['Ev xaleke girîng e.', 'Das ist ein wichtiger Punkt.'], ['Ez tevlî vê ramanê dibim.', 'Ich schließe mich diesem Gedanken an.'], ['Hinek kes dibêjin ku ev ne rast e.', 'Manche sagen, dass das nicht stimmt.'], ['Di encamê de, armanc ew e ku ziman bijî.', 'Letztlich ist das Ziel, dass die Sprache lebt.']],
  g: [['Ez bi te re ___ im. (gleicher Meinung)', 'hemfikir', ['hemfikir', 'dijber', 'nîqaş'], ''], ['Dibe ku tu rast ___. (seist)', 'bî', ['bî', 'î', 'yî'], 'nach dibe ku: Subjunktiv von bûn'], ['Ev xal___ girîng e. (ein wichtiger Punkt)', 'eke', ['eke', 'ekî', 'a'], 'xal ist weiblich'], ['Ez ___ vê ramanê dibim. (schließe mich an)', 'tevlî', ['tevlî', 'ji', 'li'], ''], ['Divê em wan rexne ___. (nicht kritisieren)', 'nekin', ['nekin', 'nakin', 'bikin'], 'verneinter Subjunktiv: ne-'], ['___ kes dibêjin ku … (manche)', 'Hinek', ['Hinek', 'Hemû', 'Tu'], '']],
  dia: `<p>Diskussionen in Amed sind lebhaft, man redet gern durcheinander. Um zu Wort zu kommen: <b>Ka bila ez jî tiştekî bibêjim!</b> (Lass mich auch mal was sagen!) Höflicher: <b>Destûrê bide …</b></p>` },

{ id: 'c1-3', lv: 'C1', title: 'Wêje', sub: 'Literatur und ihre Sprache', goal: 'Du sprichst über kurdische Literatur und verstehst literarischen Wortschatz.',
  th: `<h4>Wegmarken der Kurmancî-Literatur</h4><ul><li><b>Melayê Cizîrî</b> und <b>Feqiyê Teyran</b>: klassische Dichtung (16./17. Jh.).</li><li><b>Ehmedê Xanî</b>: <i>Mem û Zîn</i> (1692), das Nationalepos über zwei Liebende in Cizîra Botan.</li><li><b>Celadet Bedirxan</b>: Zeitschrift <i>Hawar</i> (ab 1932) und das lateinische Alphabet.</li><li><b>Erebê Şemo</b>: <i>Şivanê Kurmanca</i> (1935), einer der ersten Romane auf Kurmancî.</li><li><b>Cegerxwîn</b> (1903–1984): Dichter, dessen Verse vielfach vertont wurden.</li><li><b>Mehmed Uzun</b>: moderne Romane, die dem Kurmancî-Roman ein breites Publikum brachten.</li></ul>
  <h4>Literarische Sprache</h4><p>In Gedichten ändert sich oft die Wortstellung (Verb vorne), und es gibt lange Ezafe-Ketten: <span class="ku">dilê min ê bi xem</span> (mein kummervolles Herz). Typische Wörter: <span class="ku">evîn, dildar, yar, xem, keder, hesret</span> (Sehnsucht).</p>`,
  vocab: [['wêje', 'Literatur'], ['helbest', 'Gedicht'], ['helbestvan', 'Dichter/in'], ['roman', 'Roman'], ['nivîskar', 'Schriftsteller/in'], ['berhem', 'Werk'], ['evîn', 'Liebe'], ['dildar', 'Geliebte/r'], ['yar', 'Geliebte/r'], ['xem', 'Kummer'], ['keder', 'Leid, Gram'], ['hesret', 'Sehnsucht'], ['navdar', 'berühmt'], ['fesadî', 'Intrige'], ['giran', 'schwer']],
  dlg: [['A', 'Te Mem û Zîn xwendiye?', 'Hast du Mem û Zîn gelesen?'], ['B', 'Erê, lê zimanê berhemê giran e. Ehmedê Xanî ew di sala 1692an de nivîsiye.', 'Ja, aber die Sprache des Werks ist schwer. Ehmedê Xanî hat es 1692 geschrieben.'], ['A', 'Çîrok li ser çi ye?', 'Worum geht es?'], ['B', 'Li ser evîna Mem û Zînê, ku ji ber fesadiya Bekoyê Ewan negihîştin hev.', 'Um die Liebe von Mem und Zîn, die wegen der Intrige von Beko nicht zueinanderfanden.'], ['A', 'Pir xemgîn e. Ez ê pêşî helbestên Cegerxwîn bixwînim, ew hêsantir in.', 'Sehr traurig. Ich lese zuerst Cegerxwîns Gedichte, die sind leichter.']],
  s: [['Ehmedê Xanî Mem û Zîn nivîsiye.', 'Ehmedê Xanî hat Mem û Zîn geschrieben.'], ['Ev helbest li ser evînê ye.', 'Dieses Gedicht handelt von der Liebe.'], ['Zimanê berhemê giran e.', 'Die Sprache des Werks ist schwer.'], ['Cegerxwîn helbestvanekî navdar e.', 'Cegerxwîn ist ein berühmter Dichter.'], ['Ez romanên kurdî dixwînim.', 'Ich lese kurdische Romane.'], ['Evîna wan bi xemê qediya.', 'Ihre Liebe endete in Kummer.']],
  g: [['Ehmedê Xanî Mem û Zîn ___. (hat geschrieben)', 'nivîsiye', ['nivîsiye', 'dinivîse', 'binivîse'], ''], ['Cegerxwîn helbestvan___ navdar e.', 'ekî', ['ekî', 'eke', 'ê'], 'unbestimmt, männlich, mit Adjektiv'], ['Ev helbest ___ ser evînê ye.', 'li', ['li', 'ji', 'bi'], ''], ['Zimanê berhem___ giran e.', 'ê', ['ê', 'a', 'î'], 'Besitzer im Oblique'], ['hêsan → ___ (leichter)', 'hêsantir', ['hêsantir', 'hêsantirîn', 'herî hêsan'], ''], ['Mem û ___', 'Zîn', ['Zîn', 'Leyla', 'Xecê'], '']],
  dia: `<p>Viele Epen leben neben dem Buch in der mündlichen Tradition weiter. Die Geschichte von Mem und Zîn erzählen Dengbêjs als <b>Memê Alan</b>. In der Bibliothek oder Buchhandlung in Amed findest du Klassiker oft mit Wörterverzeichnis. Ein guter C1-Schritt: ein Gedicht pro Woche auswendig lernen.</p>` },

{ id: 'c1-4', lv: 'C1', title: 'Ramanên razber', sub: 'Abstrakte Begriffe und Nominalstil', goal: 'Du verstehst und schreibst sachliche, abstrakte Texte.',
  th: `<p>Sachtexte verwandeln Verben in Nomen. Der Infinitiv wird dabei zum <b>weiblichen</b> Nomen mit Ezafe -a:</p>
  ${EX([['fêr bûn → <b>fêrbûna</b> zimên', 'das Erlernen der Sprache'], ['xwendin → <b>xwendina</b> pirtûkan', 'das Lesen von Büchern'], ['pêş ketin → <b>pêşketina</b> aboriyê', 'die Entwicklung der Wirtschaft']])}
  <h4>Feste Wendungen</h4>${T(['Kurmancî', 'Deutsch'], [['bandor li … kirin', 'beeinflussen'], ['girîngî dan …', 'Bedeutung beimessen'], ['berpirsiyarî girtin', 'Verantwortung übernehmen'], ['di vê pêvajoyê de', 'in diesem Prozess'], ['ji bo … rê vekirin', 'den Weg ebnen für …']])}
  <p>Im Gespräch klingt Nominalstil schnell steif. Dort sagt man lieber: <span class="ku">Dema mirov zimanekî fêr dibe …</span> (Wenn man eine Sprache lernt …).</p>`,
  vocab: [['rewş', 'Lage, Situation'], ['pêvajo', 'Prozess'], ['encam', 'Ergebnis'], ['bandor', 'Einfluss, Wirkung'], ['têkilî', 'Beziehung'], ['berpirsiyarî', 'Verantwortung'], ['nasname', 'Identität'], ['çand', 'Kultur'], ['pêşketin', 'Entwicklung, Fortschritt'], ['hewldan', 'Bemühung'], ['girîngî', 'Bedeutung, Wichtigkeit'], ['lawaz', 'schwach'], ['xurt', 'stark'], ['mêjî', 'Gehirn'], ['duzimanî', 'Zweisprachigkeit']],
  dlg: [['A', 'Fêrbûna zimanekî nû bandoreke mezin li mirov dike.', 'Das Erlernen einer neuen Sprache hat großen Einfluss auf den Menschen.'], ['B', 'Hinek lêkolîn dibêjin ku duzimanî bandoreke erênî li mêjî dike, lê nîqaş hîn berdewam e.', 'Manche Studien sagen, dass Zweisprachigkeit das Gehirn positiv beeinflusst, aber die Debatte geht weiter.'], ['A', 'Ji bo min, girîngiya zimên di nasnameyê de ye.', 'Für mich liegt die Bedeutung der Sprache in der Identität.'], ['B', 'Têkiliya ziman û çandê jî heye: bêyî zimên, çand jî lawaz dibe.', 'Und es gibt die Beziehung von Sprache und Kultur: Ohne Sprache wird auch die Kultur schwach.']],
  s: [['Fêrbûna zimên dem dixwaze.', 'Das Erlernen der Sprache braucht Zeit.'], ['Ev rewş bandorê li me dike.', 'Diese Lage beeinflusst uns.'], ['Têkiliya ziman û çandê xurt e.', 'Die Beziehung zwischen Sprache und Kultur ist stark.'], ['Berpirsiyariya me mezin e.', 'Unsere Verantwortung ist groß.'], ['Di vê pêvajoyê de em gelek fêr bûn.', 'In diesem Prozess haben wir viel gelernt.'], ['Divê em girîngiyê bidin perwerdeyê.', 'Wir müssen der Bildung Bedeutung beimessen.']],
  g: [['___ zimên dem dixwaze. (das Erlernen)', 'Fêrbûna', ['Fêrbûna', 'Fêrbûn', 'Fêrbûnê'], 'Infinitiv als Nomen + Ezafe -a'], ['Ev rewş bandorê ___ me dike.', 'li', ['li', 'ji', 'bi'], 'bandor li … kirin'], ['Têkiliya ziman û çand___ xurt e.', 'ê', ['ê', 'a', 'î'], 'Oblique nach Ezafe'], ['Di vê pêvajoy___ de …', 'ê', ['ê', 'a', 'î'], ''], ['Divê em girîngiyê ___ perwerdeyê.', 'bidin', ['bidin', 'bikin', 'bibin'], 'girîngî dan'], ['Bêyî zimên, çand ___ dibe. (schwach)', 'lawaz', ['lawaz', 'xurt', 'mezin'], '']],
  dia: `<p>Beachte <b>zimên</b> statt ziman nach Präpositionen (<i>bêyî zimên, fêrbûna zimên</i>): der Stammvokal-Wechsel aus dem Oblique, den du in Amed täglich hörst. In der Schriftsprache stehen beide Formen nebeneinander.</p>` }
);
