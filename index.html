/* ===== Pira Ziman · pronunciation audio (Meta MMS neural Kurmanji voice, pre-rendered) ===== */
const PZA = window.PZA = { banks: {}, wait: {}, add(n, map) { this.banks[n] = map; if (this.wait[n]) this.wait[n].res(); } };
const AKEYS = new Set((PZ.audio && PZ.audio.keys) ? PZ.audio.keys.split('\n') : []);
const ANB = (PZ.audio && PZ.audio.nb) || 1;
const akey = s => norm(String(s).replace(/\([^)]*\)/g, ' ').replace(/[„“"«»]/g, ' ').replace(/…|___/g, ' '));
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0; return h; };
const bankOf = k => fnv(k) % ANB;
function loadBank(n) {
  if (PZA.banks[n]) return Promise.resolve();
  if (PZA.wait[n]) return PZA.wait[n].p;
  let res, rej; const p = new Promise((a, b) => { res = a; rej = b; });
  PZA.wait[n] = { p, res };
  const s = document.createElement('script'); s.src = 'audio/m' + n + '.js'; s.async = true;
  s.onerror = () => { delete PZA.wait[n]; s.remove(); rej(new Error('audio bank ' + n)); };
  document.head.append(s);
  return p;
}
/* which recordings make up this text: the whole phrase if we have it, otherwise word by word */
function sayParts(text) {
  const k = akey(text); if (!k) return [];
  if (AKEYS.has(k)) return [k];
  return k.split(' ').filter(w => AKEYS.has(w));
}
function canSay(text) { const k = akey(text); if (!k) return false; return AKEYS.has(k) || k.split(' ').every(w => AKEYS.has(w)); }

/* one shared <audio> element: unlocked on the first tap so later (async) plays work on iPhone too */
const AU = new Audio(); AU.preload = 'auto';
let auUnlocked = false, sayTok = 0, sayEl = null;
function unlockAudio() { if (auUnlocked) return; auUnlocked = true; try { AU.src = 'data:audio/mpeg;base64,' + PZ.silent; AU.play().catch(() => { }); } catch (e) { } }
document.addEventListener('pointerdown', unlockAudio, { capture: true, once: true });
document.addEventListener('keydown', unlockAudio, { capture: true, once: true });
function playOne(b64) {
  return new Promise(res => {
    const done = () => { AU.onended = AU.onerror = null; res(); };
    AU.onended = AU.onerror = done;
    AU.src = 'data:audio/mpeg;base64,' + b64;
    AU.playbackRate = S.rate || 1; try { AU.preservesPitch = true; } catch (e) { }
    const p = AU.play(); if (p) p.catch(done);
  });
}
function stopSay() { sayTok++; try { AU.pause(); } catch (e) { } if (sayEl) { sayEl.classList.remove('playing'); sayEl = null; } }
/* play a list of texts one after another (a dialog, a paragraph); el gets .playing meanwhile */
async function sayList(texts, el) {
  const parts = texts.map(sayParts).filter(p => p.length);
  if (!parts.length) { toast('Dafür gibt es keine Aufnahme.'); return; }
  stopSay(); const my = sayTok;
  try { await Promise.all([...new Set(parts.flat().map(bankOf))].map(loadBank)); }
  catch (e) { toast('Die Aufnahme konnte nicht geladen werden. Bist du offline?'); return; }
  if (my !== sayTok) return;
  sayEl = el || null; if (sayEl) sayEl.classList.add('playing');
  for (const seq of parts) {
    for (const w of seq) { if (my !== sayTok) return; const b = PZA.banks[bankOf(w)]; if (b && b[w]) await playOne(b[w]); }
    if (my !== sayTok) return;
    if (parts.length > 1) await new Promise(r => setTimeout(r, 350));
  }
  if (my === sayTok && sayEl) { sayEl.classList.remove('playing'); sayEl = null; }
}
const say = (text, el) => sayList([text], el);
const autoSay = text => { if (S.autoplay !== false) say(text); };

const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function sayBtn(text, cls = '', label) {
  if (!canSay(text)) return '';
  return `<button type="button" class="say ${cls}" data-say="${esc(text)}" aria-label="${esc(label || 'Anhören: ' + text)}" title="Anhören">${SPK}</button>`;
}
function sayListBtn(texts, label) {
  const ok = texts.filter(canSay); if (!ok.length) return '';
  return `<button type="button" class="btn sm say-all" data-say-list="${esc(JSON.stringify(ok))}">${SPK}<span>${esc(label)}</span></button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { e.preventDefault(); e.stopPropagation(); if (b.classList.contains('playing')) { stopSay(); return; } say(b.dataset.say, b); return; }
  const l = e.target.closest('[data-say-list]');
  if (l) { e.preventDefault(); if (l.classList.contains('playing')) { stopSay(); return; } sayList(JSON.parse(l.dataset.sayList), l); return; }
  const k = e.target.closest('.sayable');
  if (k && !e.target.closest('a, button')) { if (k.classList.contains('playing')) { stopSay(); return; } say(k.dataset.text, k); }
});
document.addEventListener('keydown', e => {
  const k = e.target.closest && e.target.closest('.sayable');
  if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); say(k.dataset.text, k); }
});
/* make every Kurdish snippet in explanations, tables and examples clickable */
const SAY_SEL = '.theory .ku, .theory .ex .k, .theory td, .theory li b, .dialect b, .dialect i, .dialect .ku, .page .ku, .page .ex .k, .list .it .k, .conj, .alpha .ku';
const NOT_KU = new Set(['du', 'wir', 'ich', 'er', 'sie', 'ihr', 'es', 'in', 'an']);
function enhanceSay(root) {
  if (!root || !AKEYS.size) return;
  root.querySelectorAll(SAY_SEL).forEach(el => {
    if (el.classList.contains('sayable') || el.closest('button, .tile, .choice, .pair, .sayable, [data-say]')) return;
    const t = el.textContent.replace(/^\s*\d+\s+/, '').trim();
    if (!t || !/[a-zêîûçş]/i.test(t) || !canSay(t)) return;
    if (el.matches('td') && NOT_KU.has(t.toLowerCase())) return;
    el.classList.add('sayable'); el.dataset.text = t; el.tabIndex = 0; el.title = 'Anhören';
  });
}

/* ===== Pira Ziman · lesson player & exercises ===== */
let P = null;
const PRAISE = [['Rast e!', 'Richtig!'], ['Aferîn!', 'Bravo!'], ['Pir baş!', 'Sehr gut!'], ['Gelek xweş!', 'Sehr schön!'], ['Tu jêhatî yî!', 'Du bist begabt!']];
const showKu = s => String(s).split('|')[0];

/* ---------- exercise generation ---------- */
function vocabPool(lv) { const out = []; for (const l of PZ.lessons) if (!lv || l.lv === lv) for (const v of l.vocab || []) out.push(v); return out; }
function distract(correct, pool, field, n = 3) {
  const seen = new Set([norm(correct)]), out = [];
  for (const v of shuffle(pool)) { const c = v[field]; if (!seen.has(norm(c))) { seen.add(norm(c)); out.push(c); } if (out.length >= n) break; }
  return out;
}
function mcItem(v, l, dir) {
  const pool = [...(l.vocab || []), ...vocabPool(l.lv)];
  if (dir === 'kd') return { t: 'mc', dir, p: showKu(v[0]), a: v[1], o: shuffle([v[1], ...distract(v[1], pool, 1)]), key: showKu(v[0]) };
  return { t: 'mc', dir, p: v[1], a: showKu(v[0]), o: shuffle([showKu(v[0]), ...distract(showKu(v[0]), pool.map(x => [showKu(x[0]), x[1]]), 0)]), key: showKu(v[0]) };
}
const toks = s => showKu(s).replace(/[.,!?;:«»"]/g, '').split(/\s+/).filter(Boolean);
function buildItem(s, l) {
  const ans = toks(s[0]), have = new Set(ans.map(norm));
  const others = (l.s || []).filter(x => x !== s).flatMap(x => toks(x[0])).concat((l.vocab || []).map(v => showKu(v[0])).filter(w => !w.includes(' ')));
  const extra = []; for (const w of shuffle(others)) { if (!have.has(norm(w))) { have.add(norm(w)); extra.push(w); } if (extra.length >= Math.min(4, Math.max(2, Math.ceil(ans.length / 2)))) break; }
  return { t: 'build', p: s[1], a: s[0], tiles: shuffle([...ans, ...extra]) };
}
function gapItem(g) { return { t: 'gap', s: g[0], a: g[1], o: g[2] && g[2].length ? shuffle(g[2]) : null, h: g[3] || '' }; }
function buildExercises(l) {
  const V = shuffle(l.vocab || []), items = [];
  if (V.length >= 4) items.push({ t: 'pairs', pairs: V.slice(0, 5).map(v => [showKu(v[0]), v[1]]) });
  V.slice(0, 3).forEach(v => items.push(mcItem(v, l, 'kd')));
  V.slice(3, 6).forEach(v => items.push(mcItem(v, l, 'dk')));
  V.filter(v => showKu(v[0]).split(' ').length <= 2).slice(6, 8).forEach(v => items.push({ t: 'type', p: v[1], a: v[0], key: showKu(v[0]) }));
  pick(l.s || [], 4).forEach(s => items.push(buildItem(s, l)));
  (l.g || []).forEach(g => items.push(gapItem(g)));
  const first = items.filter(x => x.t === 'pairs'), rest = shuffle(items.filter(x => x.t !== 'pairs'));
  return [...first, ...rest];
}
function testExercises(lv) {
  const out = [];
  for (const l of byLevel(lv)) {
    if (l.g?.length) out.push(gapItem(pick(l.g, 1)[0]));
    if (l.s?.length) out.push(buildItem(pick(l.s, 1)[0], l));
    if (l.vocab?.length) out.push(mcItem(pick(l.vocab, 1)[0], l, Math.random() < .5 ? 'kd' : 'dk'));
  }
  return pick(out, 20);
}

function doCheck() {

}

/* ---------- finish ---------- */
function finish() {

/* ===== Pira Ziman · verb engine & trainer ===== */
const PRON = ['ez', 'tu', 'ew', 'ew', 'em', 'hûn', 'ew'];
const OBL = ['min', 'te', 'wî', 'wê', 'me', 'we', 'wan'];
const DE_P = ['ich', 'du', 'er', 'sie (Sg.)', 'wir', 'ihr', 'sie (Pl.)'];
const FUTP = ['ê', 'yê', 'ê', 'ê', 'ê', 'ê', 'ê'];
const SLOT = [0, 1, 2, 2, 3, 4, 5];
const isV = s => /[aeêiîouû]$/.test(s);
const TENSES = {
  prs: ['Präsens', 'A1'], neg: ['Präsens verneint', 'A1'], imp: ['Imperativ', 'A2'], sub: ['Subjunktiv', 'A2'], fut: ['Futur', 'A2'],
  pst: ['Vergangenheit', 'A2'], prog: ['Verlaufsform Vergangenheit', 'B1'], prf: ['Perfekt', 'B1'], plp: ['Plusquamperfekt', 'B1'], erg: ['Ergativ mit Objekt', 'B1']

/* a "form" is [prefix, stem, ending]; returned per slot 0..5 */
function presEnd(stem, s) {
  if (!isV(stem)) return ['im', 'î', 'e', 'in', 'in', 'in'][s];
  if (/î$/.test(stem)) return ['m', '', '', 'n', 'n', 'n'][s];
  return ['m', 'yî', '', 'n', 'n', 'n'][s];
}
function pastEnd(stem, s) {

}
function full(v) { // resolve light verbs onto base verb
  if (!v.base) return v;
  const b = PZ.verbs.find(x => x.inf === v.base); return { ...b, ...v, lvn: v.lvn };
}
function vForms(v0, tense) {

    switch (tense) {
      case 'prs': f = v.prs ? ['', v.prs[s], ''] : [pv + 'di', v.pr, presEnd(v.pr, s)]; break;
      case 'neg': f = v.negs ? ['', v.negs[s], ''] : [pv + (v.ng || 'na'), v.pr, presEnd(v.pr, s)]; break;
      case 'sub': { const st = v.sb ? v.sb : (pv ? pv : 'bi') + v.pr; const k = v.sb ? '' : (pv || 'bi'); f = [k, st.slice(k.length), presEnd(st, s)]; break; }
      case 'pst': f = [pv, v.pa, v.tr ? '' : pastEnd(v.pa, s)]; break;
      case 'prog': f = [pv + 'di', v.pa, v.tr ? '' : pastEnd(v.pa, s)]; break;
      case 'prf': { const base = /î$/.test(v.pa) ? v.pa.slice(0, -1) + 'i' : v.pa; const e = isV(v.pa) && !/î$/.test(v.pa) ? ['me', 'yî', 'ye', 'ne', 'ne', 'ne'] : ['me', 'yî', 'ye', 'ne', 'ne', 'ne'];
        const stem = isV(base) ? base : base + 'i'; f = [pv, stem, v.tr ? 'ye' : e[s]]; break; }
      case 'plp': f = [pv, v.pa + (isV(v.pa) ? '' : 'i'), v.tr ? 'bû' : ['bûm', 'bûyî', 'bû', 'bûn', 'bûn', 'bûn'][s]]; break;
    }

  }

}
const ftxt = f => f.join('');
const fhtml = f => `<span class="m-pre">${esc(f[0])}</span>${esc(f[1])}<span class="m-end">${esc(f[2])}</span>`;
const lvPre = v => v.lvn ? v.lvn + ' ' : '';
const lvPreH = v => v.lvn ? esc(v.lvn) + ' ' : '';
function canTense(v0, t) {
  const v = full(v0);

  if (t === 'imp') return !v.noImp;

}
/* phrase for person p (0..6) */
function phrase(v0, t, p, o) {

  if (t === 'erg') { const os = SLOT[o]; const f = [v.pv || '', v.pa, pastEnd(v.pa, os)]; return OBL[p] + ' ' + PRON[o] + ' ' + ftxt(f); }
  if (t === 'fut') { return PRON[p] + ' ' + FUTP[p] + ' ' + lvPre(v) + ftxt(vForms(v, 'sub')[s]); }
  const f = vForms(v, t)[s];
  const subj = (v.tr && ['pst', 'prog', 'prf', 'plp'].includes(t)) ? OBL[p] : PRON[p];

}
function impForms(v) {

}
function phraseHTML(v0, t, p, o) {
  const v = full(v0), s = SLOT[p];

  if (t === 'erg') { const os = SLOT[o]; return `<span class="m-erg">${OBL[p]}</span> ${PRON[o]} ${fhtml([v.pv || '', v.pa, pastEnd(v.pa, os)])}`; }
  if (t === 'fut') return `${PRON[p]} <span class="m-erg">${FUTP[p]}</span> ${lvPreH(v)}${fhtml(vForms(v, 'sub')[s])}`;
  const f = vForms(v, t)[s], erg = v.tr && ['pst', 'prog', 'prf', 'plp'].includes(t);

}
function answers(v, t, p, o) {
  const a = phrase(v, t, p, o), alts = [a];
  if (t === 'fut') alts.push(a.replace(/^(\S+) (y?ê) /, '$1$2 '), a.replace(/ y?ê /, ' dê '));
  const fv = full(v);
  if (SLOT[p] === 1 && ((/î$/.test(fv.pr || '') && ['prs', 'neg'].includes(t)) || (!fv.tr && /î$/.test(fv.pa || '') && ['pst', 'prog'].includes(t)))) alts.push(a + 'yî', a.replace(/î$/, 'iyî'));

/* reverse index: conjugated form -> verb, tense, person (for the reader) */
const VFORM = new Map();
function buildVForms() {
  VFORM.clear();
  for (const v of PZ.verbs) {
    if (v.lvn) continue;
    for (const t of ['prs', 'neg', 'sub', 'pst', 'prog', 'prf', 'plp']) {
      if (!canTense(v, t)) continue;
      vForms(v, t).forEach((f, s) => { const k = ftxt(f).toLowerCase(); if (!VFORM.has(k)) VFORM.set(k, { v, t, s }); });
    }
    impForms(full(v)).forEach(f => { if (!VFORM.has(f)) VFORM.set(f, { v, t: 'imp', s: 1 }); });
    const pv = v.pv || '', add = (k, o) => { k = k.toLowerCase(); if (!VFORM.has(k)) VFORM.set(k, { v, ...o }); };
    for (let s = 0; s < 6; s++) { const e = presEnd(v.pr, s); add(pv + 'ne' + v.pr + e, { t: 'sub', s, neg: true }); if (v.sb && !pv) add('bi' + v.pr + e, { t: 'sub', s }); }
    if (v.tr) { add(pv + v.pa + (isV(v.pa) ? 'n' : 'in'), { t: 'pst', s: 3, pl: true }); add(pv + 'di' + v.pa + (isV(v.pa) ? 'n' : 'in'), { t: 'prog', s: 3, pl: true }); add(pv + 'ne' + v.pa, { t: 'pst', s: 2, neg: true }); add(pv + 'nedi' + v.pa, { t: 'prog', s: 2, neg: true }); }
    else for (let s = 0; s < 6; s++) { add(pv + 'ne' + v.pa + pastEnd(v.pa, s), { t: 'pst', s, neg: true }); add(pv + 'nedi' + v.pa + pastEnd(v.pa, s), { t: 'prog', s, neg: true }); }
  }
}

/* ---------- trainer view ---------- */

};
function vtCard() {

function lookup(word) {
  const k = word.toLowerCase().replace(/[^a-zêîûçşA-ZÊÎÛÇŞ\-]/g, '');
  if (!k) return null;
  const t = PZ.texts.find(x => x.id === RD.id);
  const g = t?.gloss?.find(x => x[0].toLowerCase() === k); if (g) return { ku: g[0], de: g[1], form: '' };
  if (DICT.has(k)) return { ...DICT.get(k), form: '' };
  const fw = PZ.func[k] || PZ.func[word.replace(/[^A-Za-zÇçÊêÎîÛûŞşÂâ]/g, '')];
  if (fw) return { ku: word.replace(/[^A-Za-zÇçÊêÎîÛûŞşÂâ\-]/g, ''), de: fw, form: '' };
  const vb = PZ.verbs.find(v => v.inf === k); if (vb) return { ku: vb.inf, de: vb.de, form: 'Infinitiv', verb: true };
  if (VFORM.has(k)) { const f = VFORM.get(k); return { ku: f.v.inf, de: f.v.de, form: `${TENSES[f.t][0]}${f.neg ? ' verneint' : ''}${f.pl ? ', Objekt im Plural' : ', ' + ['1. Sg.', '2. Sg.', '3. Sg.', '1. Pl.', '2. Pl.', '3. Pl.'][f.s]}`, verb: true }; }
  const suf = ['ekê', 'ekî', 'eke', 'yên', 'ên', 'yê', 'ya', 'an', 'ê', 'a', 'î', 'e', 'ne', 'ye', 'iye', 'in', 'im', 'ek', 'yan'];
  for (const s of suf) if (k.endsWith(s) && k.length > s.length + 1) { const st = k.slice(0, -s.length); for (const c of [...new Set([st, st.replace(/i$/, 'î'), st.replace(/y$/, ''), st.replace(/iy$/, 'î')])]) { if (DICT.has(c)) return { ...DICT.get(c), form: 'Endung -' + s }; const tg = t?.gloss?.find(x => x[0].toLowerCase() === c); if (tg) return { ku: tg[0], de: tg[1], form: 'Endung -' + s }; if (PZ.func[c]) return { ku: c, de: PZ.func[c], form: 'Endung -' + s }; } const cap = word.replace(/[^A-Za-zÇçÊêÎîÛûŞşÂâ]/g, '').slice(0, st.length); if (PZ.func[cap]) return { ku: cap, de: PZ.func[cap], form: 'Oblique/Ezafe -' + s }; if (PZ.func[st]) return { ku: st, de: PZ.func[st], form: 'Endung -' + s }; if (DICT.has(st.replace(/ê/, 'a'))) return { ...DICT.get(st.replace(/ê/, 'a')), form: 'Endung -' + s + ', Stammvokal a → ê' }; }
  const raised = k.replace(/ê(?=[^ê]*$)/, 'a'); if (raised !== k && DICT.has(raised)) return { ...DICT.get(raised), form: 'Oblique mit Stammvokal a → ê' };
  if (/^[A-ZÇÊÎÛŞ]/.test(word)) return { ku: word.replace(/[^A-Za-zÇçÊêÎîÛûŞşÂâ]/g, ''), de: 'wahrscheinlich ein Eigenname (Person oder Ort)', form: '' };
  return null;
}

/* ---------- sun of the flag (21 rays) ---------- */
function sunSVG(cls, lit = 21, label = '') {
  const cx = 60, cy = 60, r0 = 30, r1 = 56, n = 21, w = Math.PI / n * 0.62;
  let rays = '';

    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const p = (r, d) => `${(cx + r * Math.cos(a + d)).toFixed(2)},${(cy + r * Math.sin(a + d)).toFixed(2)}`;
    rays += `<polygon class="ray${i < lit ? ' on' : ''}" points="${p(r0 - 2, -w)} ${p(r1, 0)} ${p(r0 - 2, w)}"/>`;
  }
  return `<svg class="${cls}" viewBox="0 0 120 120" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${rays}<circle class="disc" cx="${cx}" cy="${cy}" r="${r0}"/></svg>`;
}
function flagMark() {

}

const lvlXP = n => 25 * n * (n - 1);                 // total XP needed to reach level n
function levelOf(xp) { let n = 1; while (xp >= lvlXP(n + 1)) n++; return n; }
function rankOf(n) { let r = RANKS[0]; for (const x of RANKS) if (n >= x[0]) r = x; return r; }
function levelInfo() { const n = levelOf(S.xp), a = lvlXP(n), b = lvlXP(n + 1); return { n, rank: rankOf(n), into: S.xp - a, need: b - a, pct: Math.round((S.xp - a) / (b - a) * 100) }; }

const startOfDay = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };

  { id: 'perfect', ic: 'star', t: 'Schaffe eine Lektion mit 3 Sternen', n: 1, get: () => perfectToday(), ok: () => Object.keys(S.lessons).length >= 1 },
  { id: 'cards', ic: 'cards', t: 'Wiederhole 15 Karteikarten', n: 15, get: d => (S.reviews || 0) - d.base.reviews, ok: () => Object.keys(S.cards).length >= 15 },
  { id: 'pron', ic: 'mic', t: 'Nimm 3 Sätze im Aussprache-Trainer auf', n: 3, get: d => (S.pron?.n || 0) - d.base.pron, ok: () => true },

  { id: 'verbs', ic: 'verb', t: 'Bilde 10 Verbformen richtig', n: 10, get: d => (S.verbs.ok || 0) - d.base.verbs, ok: () => Object.keys(S.lessons).length >= 6 },
  { id: 'text', ic: 'book', t: 'Lies einen Lesetext', n: 1, get: () => textsToday(), ok: () => Object.keys(S.lessons).length >= 4 },
  { id: 'xp', ic: 'bolt', t: 'Sammle heute 60 XP', n: 60, get: () => todayXP(), ok: () => true }
];
function seeded(seed) { let x = seed >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function pickQuests(date) {
  let h = 2166136261; for (const c of date) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = seeded(h), pool = QUESTS.filter(q => q.ok()), out = [];
  const learn = pool.filter(q => q.id === 'lesson' || q.id === 'lesson2' || q.id === 'cards');
  if (learn.length) out.push(learn[Math.floor(rnd() * learn.length)].id);
  const rest = pool.filter(q => !out.includes(q.id) && !(out.includes('lesson') && q.id === 'lesson2') && !(out.includes('lesson2') && q.id === 'lesson'));
  while (out.length < 3 && rest.length) out.push(rest.splice(Math.floor(rnd() * rest.length), 1)[0].id);

function lastActiveBefore(today) {

  return keys.sort().pop() || null;
}
function ensureDay() {

  const last = lastActiveBefore(today);
  if (last) {
    const missed = []; let t = new Date(last + 'T12:00:00').getTime() + DAY;
    while (dkey(t) < today) { missed.push(dkey(t)); t += DAY; }
    if (missed.length && missed.length <= g.shields) {

  const svg = sunSVG('sun-goal', lit, `Tagesziel: ${tx} von ${goal} XP`);
  return svg.replace('</svg>', `<text x="60" y="62" font-size="20" font-weight="800">${tx}</text><text x="60" y="76" font-size="9" fill="var(--muted)">von ${goal} XP</text></svg>`);
}

/* ---------- celebration overlay ---------- */
function celebrate(title, sub, reward, lvl) {
  if (document.querySelector('.fx')) return;
  const el = document.createElement('div'); el.className = 'fx'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<canvas></canvas><div class="fx-card">${sunSVG('fx-sun', 21)}<div class="eyebrow">Pîroz be!</div><div class="fx-title">${esc(title)}</div><h3>${esc(sub)}</h3>${reward ? `<span class="coin">${GI.coin}${esc(reward)}</span>` : ''}${lvl ? levelBarHTML(true) : ''}<button class="btn primary big" id="fxOk">Berdewam · Weiter</button></div>`;
  document.body.append(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey);
  el.querySelector('#fxOk').onclick = close; el.querySelector('#fxOk').focus();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#ED2024', '#FFFFFF', '#278E43', '#FEBD11'], parts = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 3, s: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * 4)], r: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    if (!el.isConnected) return; const dt = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }
    if (dt < 2200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- shop (in Profîl) ---------- */
function shopHTML() {
  const g = G(), can = g.zer >= SHIELD_PRICE && g.shields < SHIELD_MAX;
  return `<section class="card widget w-sun stack"><div class="row"><h2 class="grow">Dikan · Laden</h2><span class="coin">${GI.coin}${g.zer} Zêr</span></div>
    <div class="shop-item"><span style="width:40px;height:40px">${GI.shield}</span><div><b>Mertal · Serienschutz</b><br><span class="muted" style="font-size:.9rem">Schützt deine Serie, wenn du einen Tag nicht lernst. Wird automatisch eingesetzt. Du kannst bis zu ${SHIELD_MAX} besitzen (aktuell ${g.shields}).</span></div>
      <button class="btn ${can ? 'primary' : ''}" id="buyShield" ${can ? '' : 'disabled'}>${SHIELD_PRICE} Zêr</button></div>
    <p class="muted" style="font-size:.88rem">Zêr verdienst du mit Tagesaufgaben (+5), der täglichen Schatzkiste (+15) und jedem Stufenaufstieg (+10).</p></section>`;
}
document.addEventListener('click', e => {
  if (!e.target.closest('#buyShield')) return;
  const g = G(); if (g.zer < SHIELD_PRICE || g.shields >= SHIELD_MAX) return;
  g.zer -= SHIELD_PRICE; g.shields++; g.bought = (g.bought || 0) + 1; save(); toast('Mertal gekauft. Deine Serie ist geschützt.'); route();
});

/* ---------- views: home & profile ---------- */
const _home = VIEWS.home;
VIEWS.home = () => {
  ensureDay();
  let h = _home();
  // daily-goal ring → sun of the flag
  h = h.replace(/<div class="ring" style="--p:\d+"><i>(\d+)<small>von (\d+) XP<\/small><\/i><\/div>/, (m, tx, goal) => sunGoalHTML(+tx, +goal));
  // stats row → game stats
  h = h.replace(/<div class="stats">[\s\S]*?<\/div>\s*<\/div>\s*(?=<section class="card stack">)/, '');
  const i = h.indexOf('<section class="card stack">');
  return i < 0 ? h + playerCardHTML() + questsHTML() : h.slice(0, i) + playerCardHTML() + questsHTML() + h.slice(i);
};
const _profile = VIEWS.profile;
VIEWS.profile = () => { const h = _profile(); const i = h.indexOf('<section class="stack"><h2>Serkeftin'); return i < 0 ? h + shopHTML() : h.slice(0, i) + shopHTML() + h.slice(i); };
VIEWS.profile.after = _profile.after;

/* start of day: snapshot counters before any activity */
const _boot = boot;
boot = function () { _boot(); ensureDay(); save(false); renderSideFoot(); };

/* brand mark: flag with sun */
(function () { const b = document.querySelector('.brand svg'); if (b) b.outerHTML = flagMark(); })();

/* ---------- look: juicy flag tints on every tab ----------
   After each page renders, top-level cards and stat tiles get the widget tints of the start page
   in turn (red, gold, green). Cards that already carry a tint keep it and set the rhythm; the
   bridge stays neutral so its arches read clearly. Levels (Lernpfad, Lesen) are coloured in CSS. */
const TINTS = ['w-red', 'w-sun', 'w-green'];
function tintPage(root) {
  const top = el => !el.parentElement.closest('.card, .widget, .stat');
  let i = 0;
  $$('.card', root).filter(top).forEach(c => {
    const own = TINTS.findIndex(t => c.classList.contains(t));
    if (own >= 0) { i = own + 1; return; }
    if (c.classList.contains('bridge-wrap') || c.querySelector('.bridge-wrap')) return;
    c.classList.add('widget', TINTS[i++ % 3]);
  });
  let k = 0;
  $$('.stat', root).filter(top).forEach(s => { if (!TINTS.some(t => s.classList.contains(t))) s.classList.add(TINTS[k++ % 3]); });
}
function afterRoute(m) { tintPage(m); }

/* ---------- legal pages & support ----------
   Adds "Über die App" to the profile: links to Impressum, Datenschutz and Nutzungsbedingungen
   (static pages next to index.html, written by tools/build_pages.py from source/site/) and an
   optional donation link. The stores do not allow donation links for private developers inside
   native apps, so the link only shows on the website, never inside the Capacitor app. */
const LEGAL = {
  donate: '',   // e.g. 'https://ko-fi.com/…' — empty: no donation link at all
  pages: [['impressum.html', 'Impressum'], ['datenschutz.html', 'Datenschutz'], ['nutzungsbedingungen.html', 'Nutzungsbedingungen']]
};
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function legalHTML() {
  const links = LEGAL.pages.map(([href, t]) => `<a class="btn sm" href="${href}">${t}</a>`).join('');
  const give = LEGAL.donate && !isNative()
    ? `<p class="muted">Pira Ziman ist kostenlos und werbefrei. Wenn dir die App hilft, kannst du die Arbeit freiwillig unterstützen.</p>
       <div class="row"><a class="btn primary" href="${esc(LEGAL.donate)}" target="_blank" rel="noopener">Unterstützen</a></div>` : '';
  return `<section class="card stack"><h2>Über die App</h2>
    <p class="muted">Kostenlos, ohne Werbung, ohne Konto. Dein Lernstand und deine Aufnahmen bleiben auf diesem Gerät.</p>
    ${give}<div class="row">${links}</div></section>`;
}
const _profileLegal = VIEWS.profile;
VIEWS.profile = () => _profileLegal() + legalHTML();
VIEWS.profile.after = _profileLegal.after;

buildVForms(); boot();

}
</script>
