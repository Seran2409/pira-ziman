{ id: 'c1-5', lv: 'C1', title: 'Girtî, vekirî', sub: 'Partizipien und Täter-Nomen', goal: 'Du bildest Adjektive aus Verben und benennst Handelnde.',
  th: `<h4>Partizip Perfekt</h4><p>Vergangenheitsstamm + <b>-î</b> (nach Vokal <b>-yî</b>) ergibt ein Adjektiv:</p>
  ${T(['Verb', 'Partizip', 'Beispiel'], [['girtin', 'girtî (geschlossen)', 'deriyê girtî'], ['vekirin', 'vekirî (offen)', 'Dikan vekirî ye.'], ['şikestin', 'şikestî (zerbrochen)', 'qedeha şikestî'], ['xwendin', 'xwendî (gebildet)', 'jineke xwendî'], ['zewicîn', 'zewicî (verheiratet)', 'Ew zewicî ye.'], ['kelandin', 'kelandî (gekocht)', 'hêkên kelandî'], ['derbas bûn', 'derbasbûyî (vergangen)', 'sala derbasbûyî']])}
  <h4>Wer etwas tut</h4><p><b>-kar / -ker / -van / -er</b>: <span class="ku">nivîskar</span> (Schriftsteller/in), <span class="ku">alîkar</span> (Helfer/in), <span class="ku">temaşevan</span> (Zuschauer/in), <span class="ku">afirîner</span> (schöpferisch; Schöpfer/in).</p>`,
  vocab: [['girtî', 'geschlossen'], ['vekirî', 'offen, geöffnet'], ['şikestî', 'zerbrochen'], ['şikestin', 'brechen, zerbrechen'], ['xwendî', 'gebildet'], ['zewicî', 'verheiratet'], ['kelandî', 'gekocht'], ['qelandî', 'gebraten'], ['derbasbûyî', 'vergangen'], ['alîkar', 'Helfer/in'], ['temaşevan', 'Zuschauer/in'], ['afirîner', 'kreativ; Schöpfer/in'], ['cejn', 'Feiertag, Fest'], ['firin', 'Bäckerei, Ofen'], ['qedeh', 'Glas, Becher']],
  dlg: [['A', 'Çima dikan girtî ye?', 'Warum ist der Laden zu?'], ['B', 'Îro cejn e. Hemû dikan girtî ne, tenê firin vekirî ye.', 'Heute ist Feiertag. Alle Läden sind zu, nur die Bäckerei hat offen.'], ['A', 'Wê demê em nanê germ bikirin û hêkên kelandî bixwin.', 'Dann kaufen wir warmes Brot und essen gekochte Eier.'], ['B', 'Fikreke baş e. Lê pêşî ez ê vê qedeha şikestî bavêjim.', 'Gute Idee. Aber zuerst werfe ich dieses zerbrochene Glas weg.']],
  s: [['Derî girtî ye.', 'Die Tür ist geschlossen.'], ['Firin vekirî ye.', 'Die Bäckerei hat offen.'], ['Ez hêkên kelandî dixwim.', 'Ich esse gekochte Eier.'], ['Ew jineke xwendî ye.', 'Sie ist eine gebildete Frau.'], ['Sala derbasbûyî em çûn Wanê.', 'Letztes Jahr sind wir nach Wan gefahren.'], ['Nivîskarê pirtûkeke nû nivîsî.', 'Die Schriftstellerin hat ein neues Buch geschrieben.']],
  g: [['Derî ___ ye. (geschlossen)', 'girtî', ['girtî', 'girt', 'digire'], ''], ['Firin ___ ye. (offen)', 'vekirî', ['vekirî', 'vedike', 'veke'], ''], ['qedeha ___ (das zerbrochene Glas)', 'şikestî', ['şikestî', 'şikand', 'dişkê'], ''], ['Ew jineke ___ ye. (gebildet)', 'xwendî', ['xwendî', 'xwendekar', 'dixwîne'], ''], ['Sala ___ (letztes Jahr)', 'derbasbûyî', ['derbasbûyî', 'bê', 'nû'], ''], ['nivîs + ___ = Schriftsteller/in', 'kar', ['kar', 'van', 'xane'], '']],
  dia: `<p>In westlichen Dialekten benutzen viele türkische Partizipien auf <i>-miş</i> mit kirin (<i>kapatmîş kirin</i>). In Amed und Êlih ist das unüblich: Hier sagt man <b>girtin</b>, <b>girtî</b>. Für „müde“ hörst du neben <b>westiyayî</b> oft <b>betilî</b>.</p>` },

{ id: 'c1-6', lv: 'C1', title: 'Yê min, ya te', sub: 'Freie Ezafe und Ezafe-Ketten', goal: 'Du baust lange Nominalgruppen sicher und elegant.',
  th: `<h4>Freie Ezafe als Pronomen</h4><p><span class="ku">yê</span> (m.), <span class="ku">ya</span> (f.), <span class="ku">yên</span> (Pl.) ersetzen das Nomen: <span class="ku">Ev pirtûk ya min e.</span> (Das Buch ist meins.) <span class="ku">Kîjan erebe? Ya sor.</span> (Das rote.)</p>
  <h4>Zweites Merkmal anhängen</h4><p>Hat ein Nomen schon einen Besitzer, kommt ein Adjektiv mit freier Ezafe dazu: <span class="ku">birayê min <b>ê</b> mezin</span> (mein älterer Bruder), <span class="ku">bajarê Amedê <b>yê</b> kevn</span> (die Altstadt von Amed). Nach Konsonant schreibt man ê/a/ên, nach Vokal yê/ya/yên.</p>
  <h4>Ketten</h4><p><span class="ku">mala bavê hevalê min</span> = das Haus des Vaters meines Freundes. Jedes Glied bekommt die Ezafe des vorherigen Nomens.</p>
  <h4>Hervorheben</h4><p>Was betont werden soll, rückt nach vorn: <span class="ku">Ev pirtûk, min duh kirî.</span> (Dieses Buch habe ich gestern gekauft.)</p>`,
  vocab: [['yê', 'der (eine) – freie Ezafe, m.'], ['ya', 'die (eine) – freie Ezafe, f.'], ['yên', 'die (Pl.) – freie Ezafe'], ['birc', 'Turm'], ['sûr', 'Stadtmauer'], ['dergeh', 'Tor'], ['keleh', 'Burg, Festung'], ['mîras', 'Erbe'], ['ecêb', 'erstaunlich, wunderbar'], ['cîhan', 'Welt'], ['yek ji', 'einer/eine von']],
  dlg: [['A', 'Ev birc kîjan e?', 'Welcher Turm ist das?'], ['B', 'Ev Birca Heft Birayan e, yek ji bircên navdar ên sûra Amedê.', 'Das ist der Turm der Sieben Brüder, einer der berühmten Türme der Mauer von Amed.'], ['A', 'Û ya din, ya li wê derê?', 'Und der andere, der dort drüben?'], ['B', 'Ew jî bircek kevn e. Sûra Amedê ya reş yek ji sûrên herî dirêj ên cîhanê ye.', 'Das ist auch ein alter Turm. Die schwarze Mauer von Amed ist eine der längsten Stadtmauern der Welt.'], ['A', 'Mîraseke ecêb e!', 'Was für ein wunderbares Erbe!']],
  s: [['Ev pirtûk ya min e.', 'Dieses Buch ist meins.'], ['Kîjan erebe? Ya sor.', 'Welches Auto? Das rote.'], ['Birayê min ê mezin li Êlihê dijî.', 'Mein älterer Bruder lebt in Êlih.'], ['Bajarê Amedê yê kevn pir xweş e.', 'Die Altstadt von Amed ist sehr schön.'], ['Mala bavê hevalê min mezin e.', 'Das Haus des Vaters meines Freundes ist groß.'], ['Ev pirtûk, min duh kirî.', 'Dieses Buch habe ich gestern gekauft.']],
  g: [['Ev pirtûk ___ min e. (meins)', 'ya', ['ya', 'yê', 'yên'], 'pirtûk ist weiblich'], ['Ev xanî ___ we ye? (eures)', 'yê', ['yê', 'ya', 'yên'], 'xanî ist männlich'], ['Ev pirtûk ___ min in. (Pl.)', 'yên', ['yên', 'ya', 'yê'], ''], ['birayê min ___ mezin', 'ê', ['ê', 'a', 'ên'], 'freie Ezafe nach Konsonant: ê'], ['bajarê Amedê ___ kevn', 'yê', ['yê', 'ya', 'ê'], 'nach Vokal: yê'], ['mala bav___ hevalê min', 'ê', ['ê', 'a', 'î'], 'bav ist männlich']],
  dia: `<p>Die Stadtmauer von Amed mit ihren Türmen und Toren (<b>Deriyê Çiyê</b>, <b>Deriyê Mêrdînê</b> …) gehört seit 2015 gemeinsam mit den Hevsel-Gärten zum UNESCO-Welterbe. Beim Sprechen wird die freie Ezafe oft verschluckt: <i>birayê min mezin</i>. Im Schreiben setzt du sie.</p>` },

{ id: 'c1-7', lv: 'C1', title: 'Dengbêjî', sub: 'Die Kunst der Erzählsänger', goal: 'Du verstehst Themen, Wortschatz und Stil des Dengbêj-Gesangs.',
  th: `<p><b>Dengbêjs</b> („die die Stimme sagen“) sind Erzählsänger. Ihre Lieder (<span class="ku">kilam</span>, <span class="ku">stran</span>) erzählen von Liebe, Krieg, Fremde und Natur, oft ohne Instrument, mit langen, verzierten Tönen. Lieder werden im Kurmancî übrigens „gesagt“: <span class="ku">kilamekê gotin</span>.</p>
  <h4>Typische Formeln</h4><p><span class="ku">Lê lê, lê dayê …</span> (Ach, Mutter …), <span class="ku">Wey li min!</span> (Weh mir!), <span class="ku">Lo lo …</span> als Anruf an einen Mann.</p>
  <h4>Bekannte Stimmen</h4><p><b>Karapetê Xaço</b> (armenischer Dengbêj, der auf Kurmancî sang), <b>Mihemed Arifê Cizrawî</b>, <b>Meryem Xan</b>. In der Altstadt von Amed pflegt das <b>Mala Dengbêjan</b> die Tradition.</p>
  <h4>Ein Beispiel im Stil der Kilams</h4><p class="ku" style="font-style:italic">Lê lê dayê, çiyayên bilind bi mij in,<br>rêya zozanan teng e, dilê min bi xem e,<br>yarê, tu li ku yî, ez xerîbê vê şevê me.</p><p class="muted">(Ach Mutter, die hohen Berge sind voller Nebel, der Weg zu den Sommerweiden ist eng, mein Herz ist voll Kummer, Liebste, wo bist du, ich bin der Fremde dieser Nacht.) Eigene Zeilen für diesen Kurs.</p>`,
  vocab: [['kilam', 'Gesangsstück der Dengbêjs'], ['şîn', 'Totenklage, Trauer'], ['xerîbî', 'Fremde, Exil'], ['xerîb', 'fremd; Fremder'], ['koçer', 'Nomade'], ['zozan', 'Sommerweide in den Bergen'], ['çiya', 'Berg'], ['mij', 'Nebel'], ['xort', 'junger Mann'], ['berîvan', 'Melkerin (häufige Liedfigur)'], ['mîr', 'Fürst'], ['teng', 'eng'], ['wey li min', 'weh mir']],
  dlg: [['A', 'Ev çi deng e?', 'Was ist das für eine Stimme?'], ['B', 'Dengbêjek kilamekê dibêje. Li Mala Dengbêjan her roj wisa ye.', 'Ein Dengbêj singt ein Kilam. Im Mala Dengbêjan ist das jeden Tag so.'], ['A', 'Ez nikarim hemû gotinan fêm bikim.', 'Ich verstehe nicht alle Wörter.'], ['B', 'Zimanê kilaman kevn e. Ev kilam li ser xerîbiyê ye: xortek ji welatê xwe dûr ketiye.', 'Die Sprache der Kilams ist alt. Dieses handelt von der Fremde: Ein junger Mann ist fern seiner Heimat.'], ['A', 'Dengê wî dilê mirov dişewitîne.', 'Seine Stimme zerreißt einem das Herz.']],
  s: [['Dengbêj kilamekê dibêje.', 'Der Dengbêj singt ein Kilam.'], ['Ev stran li ser evînê ye.', 'Dieses Lied handelt von der Liebe.'], ['Çiya bilind in û zozan dûr in.', 'Die Berge sind hoch und die Sommerweiden fern.'], ['Dengê wê dilê mirov dişewitîne.', 'Ihre Stimme zerreißt einem das Herz.'], ['Xort ji welatê xwe dûr ketiye.', 'Der junge Mann ist fern seiner Heimat.'], ['Wey li min!', 'Weh mir!']],
  g: [['Dengbêj kilamekê ___. (singt, wörtl. sagt)', 'dibêje', ['dibêje', 'dike', 'dide'], 'Lieder werden „gesagt“'], ['Ev stran ___ ser evînê ye.', 'li', ['li', 'ji', 'bi'], ''], ['Xort ji welatê ___ dûr ketiye.', 'xwe', ['xwe', 'wî', 'min'], 'Bezug aufs Subjekt'], ['Wey li ___! (weh mir)', 'min', ['min', 'ez', 'me'], ''], ['Dengê wê dilê mirov ___.', 'dişewitîne', ['dişewitîne', 'dişewite', 'şewitî'], 'Kausativ: verbrennen machen'], ['Çiya bilind in û ___ dûr in. (Sommerweiden)', 'zozan', ['zozan', 'gund', 'bajar'], '']],
  dia: `<p>Dengbêj-Lieder sind die anspruchsvollste und zugleich schönste Hörübung für C1. Tipp: Nimm ein Lied, schreib Zeile für Zeile mit, was du verstehst, und lass dir die Lücken von älteren Verwandten erklären. So lernst du Wörter, die in keinem Lehrbuch stehen.</p>` },

{ id: 'c1-8', lv: 'C1', title: 'Hûrgilî', sub: 'Feinheiten und typische Fehler', goal: 'Du vermeidest die häufigsten Fehler und kennst regionale Feinheiten.',
  th: `<h4>Die fünf häufigsten Fehler</h4>${T(['falsch', 'richtig', 'Regel'], [['ez xwar', '<b>min</b> xwar', 'transitive Vergangenheit = Oblique'], ['ez mala min dibînim', 'ez mala <b>xwe</b> dibînim', 'Bezug aufs Subjekt = xwe'], ['ez na baş im', 'ez <b>ne</b> baş im', 'bei „sein“: ne'], ['ez nakarim', 'ez <b>ni</b>karim', 'karîn, zanîn: ni-'], ['di malê', 'di malê <b>de</b>', 'di … de gehört zusammen']])}
  <h4>Genus</h4><p>Die meisten Lehnwörter sind in der Türkei <b>weiblich</b>: <span class="ku">erebeya min, telefona min, otobusa Êlihê</span>. Männlich sind z. B. <span class="ku">xanî, bajar, gund, çiya, derî, ban</span>.</p>
  <h4>Regionale Feinheiten</h4><ul><li>Stammvokal-Hebung: <span class="ku">ji bajêr, li welêt, bi zimên</span>. Mit Demonstrativ aber immer mit Endung: <span class="ku">li vî welatî</span>.</li><li>Unbestimmter Plural mit <b>-in</b>, vor allem Richtung Mêrdîn: <i>zarokin hatin</i> (es kamen einige Kinder).</li><li>Unbestimmtes <b>-ik</b> statt -ek, ebenfalls im Süden: <i>rojikê</i>.</li></ul>
  <h4>Grammatik-Fachwörter auf Kurmancî</h4><p><span class="ku">navdêr</span> (Nomen), <span class="ku">lêker</span> (Verb), <span class="ku">rengdêr</span> (Adjektiv), <span class="ku">cînav</span> (Pronomen), <span class="ku">daçek</span> (Präposition), <span class="ku">gerguhêz / negerguhêz</span> (transitiv / intransitiv), <span class="ku">nêr / mê</span> (männlich / weiblich).</p>`,
  vocab: [['navdêr', 'Nomen'], ['lêker', 'Verb'], ['rengdêr', 'Adjektiv'], ['cînav', 'Pronomen'], ['daçek', 'Präposition'], ['gerguhêz', 'transitiv'], ['negerguhêz', 'intransitiv'], ['nêr', 'männlich'], ['mê', 'weiblich'], ['zayend', 'Genus, Geschlecht'], ['devok', 'Mundart'], ['zarava', 'Dialekt'], ['rastnivîs', 'Rechtschreibung'], ['bilêvkirin', 'Aussprache'], ['dengdêr', 'Vokal'], ['dewlemend', 'reich']],
  dlg: [['A', 'Mamosteyê, min got „ez xwar“. Çima şaş e?', 'Frau Lehrerin, ich habe „ez xwar“ gesagt. Warum ist das falsch?'], ['B', 'Ji ber ku „xwarin“ lêkereke gerguhêz e. Di dema borî de divê tu bibêjî „min xwar“.', 'Weil xwarin ein transitives Verb ist. In der Vergangenheit musst du „min xwar“ sagen.'], ['A', 'Û çima „ji bajêr“, ne „ji bajar“?', 'Und warum „ji bajêr“ und nicht „ji bajar“?'], ['B', 'Ev guherîna dengdêrê ye. Li herêma me gelek kes wisa dibêjin.', 'Das ist ein Vokalwechsel. In unserer Gegend sagen es viele so.'], ['A', 'Zimanê me çiqas dewlemend e!', 'Wie reich unsere Sprache ist!']],
  s: [['Xwarin lêkereke gerguhêz e.', 'Xwarin ist ein transitives Verb.'], ['Min xwar, ne ez xwar.', '„Min xwar“, nicht „ez xwar“.'], ['Ez ji bajêr têm.', 'Ich komme aus der Stadt.'], ['Li vî welatî gelek ziman hene.', 'In diesem Land gibt es viele Sprachen.'], ['Devoka Amedê xweş e.', 'Die Mundart von Amed ist schön.'], ['Zimanê me dewlemend e.', 'Unsere Sprache ist reich.']],
  g: [['___ nan xwar. (ich, Vergangenheit)', 'Min', ['Min', 'Ez', 'Em'], ''], ['Ez mala ___ dibînim. (meine eigene)', 'xwe', ['xwe', 'min', 'ez'], ''], ['Ez ___ baş im. (nicht)', 'ne', ['ne', 'na', 'ni'], ''], ['Ez ___ bêm. (kann nicht)', 'nikarim', ['nikarim', 'nakarim', 'nekarim'], ''], ['Ez ji ___ têm. (Stadt, mit Vokalwechsel)', 'bajêr', ['bajêr', 'bajar', 'bajarê'], ''], ['Li vî welat___ (in diesem Land)', 'î', ['î', 'ê', 'a'], 'Nach Demonstrativ immer mit Endung']],
  dia: `<p>Dein letzter Schritt über die Brücke: Nimm Gespräche mit älteren Verwandten auf (mit ihrer Erlaubnis) und schreib sie ab. Jede Familie bewahrt Wörter, Lieder und Wendungen, die nirgends aufgeschrieben sind. <b>Ziman bi axaftinê dijî</b>: Eine Sprache lebt durchs Sprechen.</p>` }
);

{ id: 'c2-1', lv: 'C2', title: 'Zaravayên kurmancî', sub: 'Alle Dialekte verstehen', goal: 'Du verstehst Sprecher aus Behdînan, Serhed, dem Westen und dem Süden und erkennst ihre Formen.',
  th: `<p>Kurmancî ist ein Dialektkontinuum. Benachbarte Orte verstehen sich gut, die Ränder (Südosten und Westen) unterscheiden sich am stärksten. Auf C2 musst du nicht alle Varianten sprechen, aber alle verstehen. Die Sprachwissenschaft teilt grob ein in <b>Südosten</b> (Behdînan in Nordirak, Hekarî, Şemzînan), <b>Süden/Mitte</b> (Mêrdîn, Amed, Êlih, Sêrt, Botan) und <b>Westen</b> (Meraş, Semsûr, Elbistan). Serhed (Wan, Qers, Agirî) liegt im Norden der Mitte.</p>
  ${T(['Merkmal', 'Standard / Amed', 'andere Regionen'], [
    ['Futur', 'ez ê biçim', 'Behdînan: <b>ez dê çim</b> (ohne bi-)'],
    ['3. Person Präsens', 'ew dibêje', 'Behdînan: <b>ew dibêjît</b>'],
    ['„gehen“ im Präsens', 'ez diçim', 'Westen: <b>ez terim</b>, verneint <b>narim</b>'],
    ['„für“', 'ji te re', 'Südosten: <b>bo te</b>'],
    ['„mit“', 'bi min re', 'Südosten: <b>digel min / ligel min</b>'],
    ['„von, aus“', 'ji ku derê', 'Südosten: auch <b>li kê derê</b>'],
    ['Plural-Ezafe', 'pirtûkên min', 'Südosten: <b>pirtûkêt min</b>'],
    ['„ein“ (unbestimmt)', 'rojekê', 'Mêrdîn, Midyat: <b>rojikê</b>'],
    ['Präsens-Vorsilbe', 'ez dibêjim', 'Raum Mêrdîn: oft ganz ohne di-'],
    ['„sprechen“', 'xeber dan (Amed), peyivîn (Schrift)', 'axaftin (Südosten), deng kirin (Westen), qise kirin'],
    ['11, 12', 'yazdeh, dazdeh', 'Westen: <b>dehûyek, dehûdu</b>']])}
  <h4>Lautliche Unterschiede</h4><ul><li>Westen: langes a klingt wie o: <span class="ku">av</span> → „ov“, <span class="ku">hatin</span> → „hotin“.</li><li>Südosten: v wird zu w: <span class="ku">av, şev, çav</span> → „aw, şew, çaw“; û wird zu ü: <span class="ku">bûk</span> → „bük“.</li><li>Westen: viele türkische Verben mit -miş plus kirin, etwa <i>anlamîş kirin</i> (verstehen). In Amed und Êlih ist das selten.</li></ul>
  <p>Die Einteilung folgt der Dialektforschung von Geoffrey Haig und Ergin Öpengin (Universität Bamberg).</p>`,
  vocab: [['zarava', 'Dialekt'], ['devok', 'Mundart, Ortsdialekt'], ['zimanê standard', 'Standardsprache'], ['cudahî', 'Unterschied'], ['hevpar', 'gemeinsam'], ['têgihîştin', 'verstehen, begreifen'], ['behdînî', 'Behdînî (Dialekt in Nordirak)'], ['serhedî', 'Serhedî (Dialekt im Norden)'], ['botanî', 'Botanî (Dialekt um Cizîr)'], ['bo', 'für (Südosten)'], ['digel', 'mit (Südosten)'], ['terim', 'ich gehe (Westen)'], ['pêşgir', 'Vorsilbe, Präfix'], ['bilêvkirin', 'Aussprache'], ['cihêreng', 'vielfältig, verschieden']],
  dlg: [['A', 'Tu ji ku yî? Axaftina te hinekî cuda ye.', 'Woher kommst du? Du sprichst ein bisschen anders.'], ['B', 'Ez ji Zaxoyê me. Em dibêjin „ez dê çim“, hûn dibêjin „ez ê biçim“.', 'Ich bin aus Zaxo. Wir sagen „ez dê çim“, ihr sagt „ez ê biçim“.'], ['A', 'Rast e! Û ji bo „ji te re“ hûn çi dibêjin?', 'Stimmt! Und was sagt ihr für „ji te re“?'], ['B', 'Em dibêjin „bo te“. Lê em hev baş fêm dikin, ne wisa?', 'Wir sagen „bo te“. Aber wir verstehen uns gut, oder?'], ['A', 'Belê. Zarava cuda ne, lê ziman yek e.', 'Ja. Die Dialekte sind verschieden, aber die Sprache ist eine.'], ['B', 'Cihêrengî dewlemendî ye.', 'Vielfalt ist Reichtum.']],
  s: [['Zarava cuda ne, lê ziman yek e.', 'Die Dialekte sind verschieden, aber die Sprache ist eine.'], ['Li Behdînan dibêjin: ez dê çim.', 'In Behdînan sagt man: ez dê çim.'], ['Ez axaftina wan baş fêm dikim.', 'Ich verstehe ihre Sprechweise gut.'], ['Her herêmek xwedî devoka xwe ye.', 'Jede Region hat ihre eigene Mundart.'], ['Cihêrengî dewlemendî ye.', 'Vielfalt ist Reichtum.'], ['Divê mirov hemû zaravayan nas bike.', 'Man sollte alle Dialekte kennen.']],
  g: [['Behdînan: ez dê ___. (gehen)', 'çim', ['çim', 'biçim', 'terim'], 'Im Südosten fällt bi- im Futur weg.'], ['Standard: ez ê ___. (gehen)', 'biçim', ['biçim', 'çim', 'diçim'], ''], ['Westen: ez ___. (ich gehe)', 'terim', ['terim', 'diçim', 'herim'], 'aus di-her-im'], ['Südosten: ___ min (für mich)', 'bo', ['bo', 'ji', 'li'], ''], ['Standard: bi min ___ (mit mir)', 're', ['re', 'de', 've'], ''], ['Südosten: pirtûk___ min (meine Bücher)', 'êt', ['êt', 'ên', 'an'], '']],
  dia: `<p>Amed und Êlih liegen in der Mitte des Kontinuums, nah an der Schriftsprache. Das ist ein Vorteil: Wer hier spricht, wird fast überall verstanden. Eine gute Übung auf C2: Hör dir Sprecher aus Duhok, Wan und Meraş an (zum Beispiel in der Sammlung „The Dialects of Kurdish“) und schreib mit, welche Formen anders sind.</p>` },

  <h4>Anrede</h4><p>Älteren und Fremden gegenüber benutzt man <span class="ku">hûn</span> (Sie). Im Schriftverkehr gilt <span class="ku">Birêz</span> für alle: <span class="ku">Birêz Kemal</span> (Herr Kemal), <span class="ku">Birêz Gulistan</span> (Frau Gulistan). Mündlich und traditionell sagt man auch <span class="ku">Gulistan Xanim</span>, mit dem Titel nach dem Namen.</p>

  s: [['Serê we sax be.', 'Mein Beileid.'], ['Cejna we pîroz be!', 'Frohes Fest!'], ['Bi xêr biçî û bi xêr werî!', 'Gute Reise und komm gut zurück!'], ['Çavê we ronî be!', 'Herzlichen Glückwunsch! (zur Geburt)'], ['Ez dixwazim we agahdar bikim ku civîn hat paşxistin.', 'Ich möchte Sie informieren, dass die Sitzung verschoben wurde.'], ['Ji bo bersiva we ya zû spas dikim.', 'Danke für Ihre rasche Antwort.']],
  g: [['Serê we ___ be. (Beileid)', 'sax', ['sax', 'xweş', 'baş'], ''], ['Cejna we ___ be!', 'pîroz', ['pîroz', 'sax', 'ronî'], ''], ['Bi xêr biçî û bi xêr ___!', 'werî', ['werî', 'têyî', 'hatî'], 'Subjunktiv von hatin, 2. Person'], ['Çavê we ___ be!', 'ronî', ['ronî', 'sax', 'razî'], ''], ['Bi silav û ___,', 'rêz', ['rêz', 'spas', 'xêr'], ''], ['Xwedê ji te ___ be!', 'razî', ['razî', 'sax', 'pîroz'], '']],

{ id: 'c2-3', lv: 'C2', title: 'Zimanê klasîk', sub: 'Klassische Dichtung und ihre Wörter', goal: 'Du erkennst den Stil der klassischen Dichtung und verstehst ihre Schlüsselwörter.',
  th: `<p>Die klassische Kurmancî-Dichtung entstand an den Fürstenhöfen und Medresen des 16. und 17. Jahrhunderts: <b>Melayê Cizîrî</b> (Dîwan), <b>Feqiyê Teyran</b> und <b>Ehmedê Xanî</b> (Mem û Zîn, 1692). Sie wurde in arabischer Schrift geschrieben und ist heute in lateinischer Umschrift verfügbar, oft in leicht verschiedenen Schreibweisen.</p>
  <h4>Typische Merkmale</h4><ul><li>Viele arabische und persische Wörter: <span class="ku">eşq</span> (glühende Liebe), <span class="ku">dîdar</span> (Anblick der Geliebten), <span class="ku">derd</span> (Leid), <span class="ku">mey</span> (Wein, meist Sinnbild für göttliche Liebe).</li><li>Freie Wortstellung: Das Verb steht oft vorne, damit der Reim am Versende sitzt.</li><li>Lange Ezafe-Ketten: <span class="ku">derdê dilê aşiqê şeyda</span> (das Leid des Herzens des verrückt Verliebten).</li><li>Alte Formen: <span class="ku">ko</span> statt ku, <span class="ku">ji bona</span> statt ji bo.</li></ul>
  <h4>Ein Vers im klassischen Stil</h4><p class="ku" style="font-style:italic">Dil bûye şeyda ji eşqa dildarê,<br>şev û roj dinale ji derdê yarê.</p><p class="muted">„Das Herz ist toll geworden vor Liebe zur Geliebten, Tag und Nacht klagt es vor Kummer um die Liebste.“ (Für diesen Kurs geschrieben, kein Originalvers.)</p>
  <p>Tipp: Lies klassische Texte mit einer zweisprachigen Ausgabe und lerne pro Woche ein <span class="ku">beyt</span> (Verspaar) auswendig.</p>`,
  vocab: [['eşq', 'glühende Liebe'], ['şeyda', 'verrückt vor Liebe, hingerissen'], ['aşiq', 'Liebender'], ['dîdar', 'Anblick (der Geliebten)'], ['derd', 'Leid, Kummer'], ['nalîn', 'klagen, stöhnen'], ['mey', 'Wein (oft sinnbildlich)'], ['dîwan', 'Gedichtsammlung'], ['beyt', 'Verspaar'], ['qafiye', 'Reim'], ['qedîm', 'uralt, antik'], ['medrese', 'Koranschule, Gelehrtenschule'], ['mîr', 'Fürst'], ['sembol', 'Symbol, Sinnbild']],
  dlg: [['A', 'Mamoste, çima zimanê Melayê Cizîrî ewqas zehmet e?', 'Herr Lehrer, warum ist die Sprache von Melayê Cizîrî so schwer?'], ['B', 'Ji ber ku gelek peyvên erebî û farisî tê de hene, û rêza peyvan jî cuda ye.', 'Weil viele arabische und persische Wörter darin sind und auch die Wortstellung anders ist.'], ['A', 'Wek mînak?', 'Zum Beispiel?'], ['B', 'Wek „eşq“, „dîdar“ û „mey“. Di helbesta klasîk de mey ne tenê vexwarin e, sembola evîna Xwedê ye.', 'Wie „eşq“, „dîdar“ und „mey“. In der klassischen Dichtung ist Wein nicht nur ein Getränk, sondern ein Sinnbild für die Liebe zu Gott.'], ['A', 'Ez ê dîwana wî bi ferhengê bixwînim.', 'Ich werde seinen Dîwan mit dem Wörterbuch lesen.'], ['B', 'Aferîn. Hêdî hêdî, beyt bi beyt.', 'Bravo. Langsam, Vers für Vers.']],
  s: [['Ehmedê Xanî Mem û Zîn di sala 1692an de nivîsiye.', 'Ehmedê Xanî hat Mem û Zîn im Jahr 1692 geschrieben.'], ['Di helbesta klasîk de gelek peyvên erebî hene.', 'In der klassischen Dichtung gibt es viele arabische Wörter.'], ['Mey sembola evîna Xwedê ye.', 'Der Wein ist ein Sinnbild für die Liebe zu Gott.'], ['Ez her hefte beytekê ji ber dikim.', 'Ich lerne jede Woche ein Verspaar auswendig.'], ['Dil bûye şeyda ji eşqa dildarê.', 'Das Herz ist toll geworden vor Liebe zur Geliebten.'], ['Zimanê dîwanê qedîm û dewlemend e.', 'Die Sprache des Dîwan ist alt und reich.']],
  g: [['Dil bûye ___ ji eşqa dildarê.', 'şeyda', ['şeyda', 'sar', 'biçûk'], ''], ['Şev û roj ___ ji derdê yarê. (klagt)', 'dinale', ['dinale', 'dikene', 'direqise'], 'nalîn → dinale'], ['Ehmedê Xanî Mem û ___ nivîsiye.', 'Zîn', ['Zîn', 'Leyla', 'Xecê'], ''], ['Mey ___ evîna Xwedê ye. (Sinnbild)', 'sembola', ['sembola', 'semboleke', 'sembolê'], 'sembol ist weiblich → -a'], ['Ez beytekê ji ___ dikim. (auswendig)', 'ber', ['ber', 'bîr', 'dil'], 'ji ber kirin = auswendig lernen'], ['Melayê Cizîrî ___ xwe nivîsî. (Gedichtsammlung)', 'dîwana', ['dîwana', 'dîwanê', 'dîwan'], '']],
  dia: `<p>Die Region Amed, Êlih und Botan ist das Herzland dieser Tradition. Cizîra Botan war der Ort des Fürstenhofs, an dem Mem û Zîn spielt. In vielen Familien rezitieren Ältere noch Verse von Cizîrî auswendig. Frag danach: <b>Tu beytekê ji Melayê Cizîrî dizanî?</b></p>` },

{ id: 'c2-4', lv: 'C2', title: 'Mamik û pêkenok', sub: 'Rätsel, Witze, Wortspiele', goal: 'Du verstehst Humor, Rätsel und doppeldeutige Wörter.',
  th: `<p>Humor ist eine der letzten Hürden auf dem Weg zur Muttersprachlichkeit. Kurdisch hat eine reiche Tradition von <span class="ku">mamik</span> (Rätseln) und <span class="ku">pêkenok</span> (lustigen Geschichten), besonders über <b>Mela Nesredîn</b>.</p>
  <h4>Rätsel lösen</h4>${EX([['Diranên min hene, lê ez nikarim bixwim. Ez çi me?', 'Ich habe Zähne, kann aber nicht essen. Was bin ich? → şe (Kamm)'], ['Çiqas tu ji min bigirî, ez ewqas mezintir dibim.', 'Je mehr du von mir wegnimmst, desto größer werde ich. → çal (Grube)'], ['Şev tên, roj diçin. Ew çi ne?', 'Sie kommen nachts und gehen am Tag. → stêrk (Sterne)']])}
  <h4>Wortspiele mit Doppeldeutigkeiten</h4>${T(['Wort', 'Bedeutung 1', 'Bedeutung 2'], [['pir', 'viel, sehr', 'Brücke'], ['şîn', 'blau', 'Trauer, Wehklage'], ['ser', 'Kopf', 'auf (li ser)'], ['dest', 'Hand', 'Anfang (dest pê kirin)'], ['ker', 'Esel', 'taub (mit gerolltem r); Stück'], ['kar', 'Arbeit', 'Zicklein']])}
  <p>Für Türkischsprachige trügerisch: <span class="ku">dil</span> heißt Herz (türkisch: Sprache), <span class="ku">baş</span> heißt gut (türkisch: Kopf).</p>`,
  vocab: [['mamik', 'Rätsel'], ['pêkenok', 'Witz, lustige Geschichte'], ['henek', 'Scherz'], ['henek kirin', 'scherzen'], ['tinaz', 'Spott'], ['şe', 'Kamm'], ['çal', 'Grube, Loch'], ['stêrk', 'Stern'], ['zirîn', 'iahen (Esel)'], ['axur', 'Stall'], ['cîran', 'Nachbar/in'], ['lîstika peyvan', 'Wortspiel'], ['wateya duyem', 'zweite Bedeutung'], ['bersiva rast', 'richtige Antwort']],
  dlg: [['A', 'Mamikek ji te re: diranên min hene, lê ez nikarim bixwim. Ez çi me?', 'Ein Rätsel für dich: Ich habe Zähne, kann aber nicht essen. Was bin ich?'], ['B', 'Hmm … kevroşk? Na … şe!', 'Hmm … ein Hase? Nein … ein Kamm!'], ['A', 'Aferîn! Niha tu yekê bêje.', 'Bravo! Jetzt erzähl du eins.'], ['B', 'Çiqas tu ji min bigirî, ez ewqas mezintir dibim.', 'Je mehr du von mir wegnimmst, desto größer werde ich.'], ['A', 'Ev hêsan e: çal!', 'Das ist leicht: eine Grube!'], ['B', 'Te zû dît. Tu ji min jîrtir î!', 'Du hast es schnell gefunden. Du bist klüger als ich!']],
  s: [['Diranên min hene, lê ez nikarim bixwim.', 'Ich habe Zähne, kann aber nicht essen.'], ['Pêkenokên Mela Nesredîn pir xweş in.', 'Die Geschichten über Mela Nesredîn sind sehr lustig.'], ['Ev lîstikeke peyvan e.', 'Das ist ein Wortspiel.'], ['Ker di axur de zirî.', 'Der Esel iahte im Stall.'], ['Tu ji min bawer dikî an ji vî kerî?', 'Glaubst du mir oder diesem Esel?'], ['Ew her tim henekan dike.', 'Er macht ständig Witze.']],
  g: [['Diranên min hene, lê ez ___ bixwim. (kann nicht)', 'nikarim', ['nikarim', 'nakarim', 'dikarim'], ''], ['Bersiv: ___ (Kamm)', 'şe', ['şe', 'çal', 'stêrk'], ''], ['Ker di axur de ___. (iahte)', 'zirî', ['zirî', 'kenî', 'girî'], ''], ['Tu ji min bawer dikî an ji vî ker___?', 'î', ['î', 'ê', 'a'], 'Nach vî/wî bekommen männliche Wörter immer -î.'], ['„pir“ bedeutet viel und ___.', 'Brücke', ['Brücke', 'Haus', 'Fluss'], ''], ['Ew her tim ___ dike. (Witze)', 'henekan', ['henekan', 'henek', 'henekê'], 'Plural-Oblique']],
  dia: `<p>Witze über Mela Nesredîn erzählt man von Amed bis Duhok. In Gesellschaft beginnt man gern mit <b>Pêkenokek bêjim?</b> (Soll ich einen Witz erzählen?). Ein beliebtes Spiel an Winterabenden ist das Rätselraten: Wer die Lösung nicht findet, muss zur Strafe ein Lied singen.</p>` }
);

  dlg: [['A', 'Ez dixwazim „Ich vermisse dich“ wergerînim. Ez bibêjim „ez te winda dikim“?', 'Ich möchte „Ich vermisse dich“ übersetzen. Soll ich „ez te winda dikim“ sagen?'], ['B', 'Na, ew wergera peyv bi peyv e û xelet e. Em dibêjin „ez bêriya te dikim“.', 'Nein, das ist Wort für Wort übersetzt und falsch. Wir sagen „ez bêriya te dikim“.'], ['A', 'Û „ich warte auf dich“?', 'Und „ich warte auf dich“?'], ['B', '„Ez li benda te me.“ Wergêrekî baş wateyê werdigerîne, ne peyvan.', '„Ez li benda te me.“ Ein guter Übersetzer überträgt die Bedeutung, nicht die Wörter.'], ['A', 'Ji ber vê yekê werger ewqas zehmet e!', 'Deshalb ist Übersetzen so schwer!']],

{ id: 'c2-6', lv: 'C2', title: 'Zimanê zanistî', sub: 'Wissenschaft, Beruf, Präsentation', goal: 'Du hältst einen Vortrag, zitierst Quellen und formulierst vorsichtig.',
  th: `<h4>Aufbau</h4><p><span class="ku">destpêk</span> (Einleitung) → <span class="ku">beşa sereke</span> (Hauptteil) → <span class="ku">encam</span> (Schluss).</p>
  <h4>Bausteine</h4>${T(['Funktion', 'Kurmancî'], [
    ['Thema ankündigen', 'Di vê gotarê de ez ê … binirxînim.'],
    ['Quelle nennen', 'Li gorî … / Wek ku … destnîşan kiriye, …'],
    ['vorsichtig formulieren', 'Wisa xuya dike ku … / Dibe ku … / Bi îhtimaleke mezin …'],
    ['verallgemeinern', 'Bi giştî … / Di piraniya rewşan de …'],
    ['Daten nennen', 'Li gorî daneyan, ji sedî sî …'],
    ['Einwand aufgreifen', 'Dibe ku hinek bibêjin ku …, lêbelê …'],
    ['abschließen', 'Wekî encam, … / Di dawiyê de, …'],
    ['Fragen einladen', 'Heke pirsên we hebin, kerem bikin.']])}
  <p>Der Nominalstil aus C1 ist hier normal: <span class="ku">parastina zimên</span> (der Schutz der Sprache), <span class="ku">pêşxistina perwerdeyê</span> (die Entwicklung der Bildung).</p>`,
  vocab: [['lêkolîner', 'Forscher/in'], ['çavkanî', 'Quelle'], ['rêbaz', 'Methode'], ['dane', 'Daten'], ['gotar', 'Artikel, Aufsatz'], ['kurte', 'Zusammenfassung'], ['pêşkêşî', 'Präsentation, Vortrag'], ['destnîşan kirin', 'aufzeigen, feststellen'], ['nirxandin', 'bewerten, untersuchen'], ['îhtimal', 'Wahrscheinlichkeit'], ['bi giştî', 'im Allgemeinen'], ['beşa sereke', 'Hauptteil'], ['pêşxistin', 'entwickeln, fördern'], ['zanîngeh', 'Universität']],
  dlg: [['A', 'Spas ji bo pêşkêşiya we. Rêbaza lêkolînê çi bû?', 'Danke für Ihren Vortrag. Was war die Forschungsmethode?'], ['B', 'Me bi sed malbatan re hevpeyvîn kirin û dane berhev kirin.', 'Wir haben Interviews mit hundert Familien geführt und Daten gesammelt.'], ['A', 'Encama herî girîng çi ye?', 'Was ist das wichtigste Ergebnis?'], ['B', 'Wisa xuya dike ku zarok li malê kêmtir kurmancî diaxivin. Lêbelê ev hîn ne encama dawî ye.', 'Es scheint, dass Kinder zu Hause weniger Kurmancî sprechen. Das ist aber noch kein endgültiges Ergebnis.'], ['A', 'Çavkaniyên we li ku derê hatine weşandin?', 'Wo wurden Ihre Quellen veröffentlicht?'], ['B', 'Hemû çavkanî di dawiya gotarê de hene.', 'Alle Quellen stehen am Ende des Artikels.']],
  s: [['Di vê gotarê de ez ê rewşa zimên binirxînim.', 'In diesem Aufsatz werde ich die Lage der Sprache untersuchen.'], ['Li gorî daneyan, ji sedî sî ji zarokan kurmancî naaxivin.', 'Laut den Daten sprechen dreißig Prozent der Kinder kein Kurmancî.'], ['Wisa xuya dike ku encam rast e.', 'Es scheint, dass das Ergebnis stimmt.'], ['Dibe ku hinek bibêjin ku ev ne girîng e.', 'Manche mögen sagen, dass das nicht wichtig ist.'], ['Wekî encam, divê perwerde bê pêşxistin.', 'Als Ergebnis sollte die Bildung gefördert werden.'], ['Heke pirsên we hebin, kerem bikin.', 'Wenn Sie Fragen haben, bitte sehr.']],
  g: [['Di vê ___ de ez ê … binirxînim. (Aufsatz)', 'gotarê', ['gotarê', 'gotar', 'gotara'], 'nach di … de: Oblique'], ['Li ___ daneyan … (laut)', 'gorî', ['gorî', 'ser', 'ber'], ''], ['Wisa ___ dike ku … (scheint)', 'xuya', ['xuya', 'fêm', 'nas'], ''], ['Wekî ___, … (als Ergebnis)', 'encam', ['encam', 'destpêk', 'pirs'], ''], ['Divê perwerde bê ___. (gefördert)', 'pêşxistin', ['pêşxistin', 'pêşxist', 'pêşdixe'], 'Passiv: bê + Infinitiv'], ['Heke pirsên we ___, kerem bikin.', 'hebin', ['hebin', 'hene', 'heye'], 'nach heke: Subjunktiv']],
  dia: `<p>In Universitäten mit Kurdologie (zum Beispiel an der Artuklu-Universität in Mêrdîn) wird so geschrieben und vorgetragen. Im Alltag in Amed würde man dieselbe Sache viel einfacher sagen. Übe beides: Erzähle das Ergebnis deines „Vortrags“ danach einem Freund im Teehaus.</p>` },

{ id: 'c2-7', lv: 'C2', title: 'Rêzimana kûr', sub: 'Feinheiten der Grammatik', goal: 'Du beherrschst die Nuancen, an denen man Muttersprachler erkennt.',
  th: `<h4>Zustand oder Vorgang?</h4>${EX([['Derî vekirî bû.', 'Die Tür war offen. (Zustand: bûn + Partizip)'], ['Derî hat vekirin.', 'Die Tür wurde geöffnet. (Vorgang: Passiv mit hatin)']])}
  <h4>Ergativ mit weggelassenem Subjekt</h4><p>Steht ein transitives Verb ohne ausgesprochenes Plural-Subjekt nach einem intransitiven Satz, bekommt es oft die Plural-Endung: <span class="ku">Herdu çûn cem rovî û doza xwe jê re gotin.</span> (Die beiden gingen zum Fuchs und trugen ihm ihren Fall vor.)</p>
  <h4>Kurzformen beim Empfänger</h4><p><span class="ku">Min jê re got</span> wird im Gespräch oft zu <span class="ku">min gotê</span> (ich sagte ihm/ihr). Ebenso <span class="ku">dayê</span> (gab ihm/ihr).</p>
  <h4>Das Richtungs-e</h4><p><span class="ku">Ez çûme bajêr.</span> <span class="ku">Ew hatine hev.</span> (Sie kamen zusammen.) Mit dem -e klingt Bewegung natürlicher.</p>
  <h4>Grammatik-Fachwörter</h4>${T(['Kurmancî', 'Deutsch'], [['kirde', 'Subjekt'], ['bireser', 'Objekt'], ['lêker', 'Verb'], ['dema borî / niha / bê', 'Vergangenheit / Gegenwart / Zukunft'], ['raweya fermanî', 'Imperativ'], ['raweya daxwazî', 'Subjunktiv'], ['tewandin', 'beugen (Fall)'], ['pêşgir / paşgir', 'Präfix / Suffix']])}`,
  vocab: [['kirde', 'Subjekt'], ['bireser', 'Objekt'], ['dema borî', 'Vergangenheit'], ['dema bê', 'Futur'], ['raweya fermanî', 'Imperativ'], ['raweya daxwazî', 'Subjunktiv'], ['tewandin', 'beugen, deklinieren'], ['paşgir', 'Suffix, Nachsilbe'], ['rewş', 'Zustand, Lage'], ['kirin û bûn', 'Tun und Werden'], ['doz', 'Fall, Anliegen'], ['herdu', 'beide']],
  dlg: [['A', 'Çima tu dibêjî „derî vekirî bû“ û ne „derî hat vekirin“?', 'Warum sagst du „derî vekirî bû“ und nicht „derî hat vekirin“?'], ['B', 'Ji ber ku dema ez hatim, derî jixwe vekirî bû. Ez behsa rewşê dikim, ne behsa kirinê.', 'Weil die Tür schon offen war, als ich kam. Ich spreche vom Zustand, nicht von der Handlung.'], ['A', 'Û „min gotê“ rast e?', 'Und ist „min gotê“ richtig?'], ['B', 'Di axaftinê de belê, ew kurteya „min jê re got“ e. Di nivîsê de forma dirêj baştir e.', 'Beim Sprechen ja, das ist die Kurzform von „min jê re got“. Beim Schreiben ist die lange Form besser.']],
  s: [['Derî vekirî bû.', 'Die Tür war offen.'], ['Derî hat vekirin.', 'Die Tür wurde geöffnet.'], ['Herdu çûn cem rovî û doza xwe jê re gotin.', 'Die beiden gingen zum Fuchs und trugen ihm ihren Fall vor.'], ['Min gotê ku ez nayêm.', 'Ich sagte ihm, dass ich nicht komme.'], ['Ez çûme bajêr.', 'Ich bin in die Stadt gegangen.'], ['Di dema borî de, bi lêkerên gerguhêz re kirde tê tewandin.', 'In der Vergangenheit wird das Subjekt eines transitiven Verbs gebeugt.']],
  g: [['Derî ___ bû. (offen, Zustand)', 'vekirî', ['vekirî', 'vekirin', 'vekir'], 'bûn + Partizip'], ['Derî hat ___. (geöffnet, Vorgang)', 'vekirin', ['vekirin', 'vekirî', 'vekir'], 'hatin + Infinitiv'], ['Herdu çûn û doza xwe jê re ___.', 'gotin', ['gotin', 'got', 'gotî'], 'Plural-Endung mit weggelassenem Subjekt'], ['Min ___ ku ez nayêm. (sagte ihm)', 'gotê', ['gotê', 'got', 'gotin'], ''], ['Ez çû___ bajêr.', 'me', ['me', 'm', 'ye'], 'Richtungs-e nach çûm'], ['Subjekt heißt auf Kurmancî ___.', 'kirde', ['kirde', 'bireser', 'lêker'], '']],
  dia: `<p>Die Kurzformen <b>gotê, dayê</b> und das Richtungs-e sind typisch für den Süden und Südosten, also auch für Amed und Êlih. In Schulbüchern stehen sie selten, im Gespräch hörst du sie ständig.</p>` },

{ id: 'c2-8', lv: 'C2', title: 'Wek zimanê dayikê', sub: 'Flüssig sprechen wie Muttersprachler', goal: 'Du sprichst flüssig, hältst Gespräche am Laufen und umschreibst, was dir fehlt.',

    ['wey!', 'oh! (Staunen, Schreck)', 'Wey, ev çi ye!']])}
  <h4>Zuhören zeigen</h4><p><span class="ku">Erê, erê … Rast dibêjî. Bi rastî? Ne mimkûn e! Paşê?</span></p>
  <h4>Umschreiben, wenn ein Wort fehlt</h4><p><span class="ku">Ew tiştê ku pê … dikin</span> (das Ding, mit dem man … macht), <span class="ku">yê ku …</span> (derjenige, der …), <span class="ku">wek … lê …</span> (wie …, aber …). Beispiel: <span class="ku">Ew tiştê ku pê dar dibirin</span> = Säge.</p>
  <h4>Was Fließend wirklich heißt</h4><p>Nicht fehlerfrei, sondern ohne Stocken weitersprechen. Übe täglich fünf Minuten <b>Selbstgespräch</b>: Beschreibe laut auf Kurmancî, was du gerade tust. Nimm dich im Aussprache-Trainer auf und vergleiche.</p>`,
  vocab: [['îcar', 'nun, also'], ['wele', 'ehrlich, wirklich'], ['belê', 'ja doch, genau'], ['de bila', 'na gut'], ['bes e', 'genug'], ['ka em binêrin', 'mal sehen'], ['ji xwe re', 'einfach so'], ['ne mimkûn e', 'unmöglich'], ['herikbar', 'flüssig (Rede)'], ['bi xwezayî', 'natürlich'], ['şaşî', 'Fehler'], ['devjêberdan', 'Aufgeben'], ['bawerî', 'Selbstvertrauen, Glaube'], ['birîn', 'schneiden (dibire)']],
  dlg: [['A', 'Îcar, tu duh çûyî daweta Azad?', 'Und, warst du gestern auf Azads Hochzeit?'], ['B', 'Wele çûm! Heta nîvê şevê me govend girt.', 'Ehrlich, ja! Wir haben bis Mitternacht getanzt.'], ['A', 'Bi rastî? Paşê?', 'Wirklich? Und dann?'], ['B', 'Paşê ji nişkê ve elektrîk qut bû. Hemû der tarî bû!', 'Dann fiel plötzlich der Strom aus. Alles war dunkel!'], ['A', 'Wey! Ne mimkûn e!', 'Oh! Unglaublich!'], ['B', 'De bila, dengbêjek rabû û bê mîkrofon stran got. Ew şeva herî xweş bû.', 'Na ja, ein Dengbêj stand auf und sang ohne Mikrofon. Es war der schönste Abend.']],
  s: [['Îcar, çi bû?', 'Und, was ist passiert?'], ['Wele nizanim.', 'Ehrlich, ich weiß es nicht.'], ['Ew ji xwe re rûniştibû.', 'Er saß einfach so da.'], ['Ew tiştê ku pê dar dibirin li ku ye?', 'Wo ist das Ding, mit dem man Holz sägt?'], ['De bila, em herin.', 'Na gut, gehen wir.'], ['Şaşî ne girîng in, ya girîng axaftin e.', 'Fehler sind nicht wichtig, wichtig ist das Sprechen.']],
  g: [['___, çi bû? (und, also)', 'Îcar', ['Îcar', 'Bes', 'Wey'], ''], ['___ nizanim. (ehrlich)', 'Wele', ['Wele', 'Belê', 'Îcar'], ''], ['De ___, em herin. (na gut)', 'bila', ['bila', 'bes', 'belê'], ''], ['___ e, ez westiyam! (genug)', 'Bes', ['Bes', 'Bila', 'Baş'], ''], ['Ew ji xwe ___ rûniştibû.', 're', ['re', 'de', 've'], ''], ['Ew tiştê ku ___ dar dibirin. (mit dem)', 'pê', ['pê', 'jê', 'lê'], 'bi + es → pê']],
  dia: `<p>In Amed und Êlih hörst du sehr oft <b>wele</b>, <b>îcar</b> und <b>yanî</b>. Statt yanî klingt <b>ango</b> kurdischer. Ein Satz, mit dem du sofort dazugehörst: <b>Ka em binêrin, Xwedê mezin e.</b> (Mal sehen, Gott ist groß, also: Es wird schon.)</p>` }
);

PZ.texts.push(
{ id: 't-a1-malbat', lv: 'A1', title: 'Ez û malbata xwe', de: 'Ich und meine Familie', intro: 'Berfîn stellt sich vor.',
  body: ['Navê min Berfîn e. Ez bîst û du salî me. Ez ji Êlihê me, lê niha ez li Amedê dijîm. Ez xwendekar im.',
    'Malbata min ne pir mezin e. Bavê min Kemal e, ew karker e. Diya min Gulistan e, ew li malê dixebite. Birayekî min û xwişkeke min hene. Birayê min Rêzan çardeh salî ye. Xwişka min Hêvî mamoste ye.',
    'Em her Yekşem bi hev re taştê dixwin. Diya min nan, penîr û hêk tîne. Bavê min çay çêdike. Ez ji van rojan pir hez dikim.'],
  tr: ['Ich heiße Berfîn. Ich bin zweiundzwanzig Jahre alt. Ich komme aus Êlih, aber jetzt lebe ich in Amed. Ich bin Studentin.',
    'Meine Familie ist nicht sehr groß. Mein Vater ist Kemal, er ist Arbeiter. Meine Mutter ist Gulistan, sie arbeitet zu Hause. Ich habe einen Bruder und eine Schwester. Mein Bruder Rêzan ist vierzehn. Meine Schwester Hêvî ist Lehrerin.',
    'Jeden Sonntag frühstücken wir zusammen. Meine Mutter bringt Brot, Käse und Eier. Mein Vater macht Tee. Ich liebe diese Tage sehr.'],
  gloss: [['dijîm', 'ich lebe (jiyan)'], ['niha', 'jetzt'], ['dixebite', 'arbeitet'], ['birayekî', 'einen Bruder'], ['xwişkeke', 'eine Schwester'], ['çardeh', 'vierzehn'], ['taştê', 'Frühstück'], ['tîne', 'bringt (anîn)'], ['çêdike', 'macht, bereitet zu'], ['van', 'diese (Oblique Pl.)'], ['rojan', 'Tage (Oblique Pl.)']],
  q: [['Woher kommt Berfîn?', 'Aus Êlih', ['Aus Amed', 'Aus Mêrdîn', 'Aus Wan']], ['Was ist Berfîns Schwester von Beruf?', 'Lehrerin', ['Studentin', 'Ärztin', 'Arbeiterin']], ['Wer macht sonntags den Tee?', 'Der Vater', ['Die Mutter', 'Berfîn', 'Rêzan']]] },

{ id: 't-a1-bazar', lv: 'A1', title: 'Li bazara Amedê', de: 'Auf dem Markt von Amed', intro: 'Ein Samstag mit der Großmutter.',
  body: ['Îro Şemî ye. Ez û dapîra xwe diçin bazarê. Bazar nêzîkî Mizgefta Mezin e. Li bazarê gelek tişt hene: fêkî, sebze, penîr, bîber û biharat.',
    'Dapîra min sêv, tirî û zebeşek dikire. Zebeşên Amedê pir mezin û şîrîn in. Firoşkar dibêje: „Kîloyek deh lîre ye.“ Dapîra min dibêje: „Pir biha ye! Heşt lîre?“ Firoşkar dikene û dibêje: „Baş e, ji bo te heşt lîre.“',
    'Paşê em diçin çayxaneyê û çayekê vedixwin. Ez westiyayî me, lê dilxweş im.'],
  tr: ['Heute ist Samstag. Meine Großmutter und ich gehen auf den Markt. Der Markt ist in der Nähe der Großen Moschee. Auf dem Markt gibt es viele Dinge: Obst, Gemüse, Käse, Paprika und Gewürze.',
    'Meine Großmutter kauft Äpfel, Trauben und eine Wassermelone. Die Wassermelonen aus Amed sind sehr groß und süß. Der Verkäufer sagt: „Zehn Lira das Kilo.“ Meine Großmutter sagt: „Viel zu teuer! Acht Lira?“ Der Verkäufer lacht und sagt: „Gut, für dich acht Lira.“',
    'Danach gehen wir ins Teehaus und trinken einen Tee. Ich bin müde, aber glücklich.'],
  gloss: [['Şemî', 'Samstag'], ['bîber', 'Paprika, Pfeffer'], ['biharat', 'Gewürze'], ['zebeşek', 'eine Wassermelone'], ['firoşkar', 'Verkäufer/in'], ['dikene', 'lacht'], ['çayekê', 'einen Tee (Oblique)'], ['mizgefta', 'Moschee (mit Ezafe)']],
  q: [['Welcher Tag ist heute?', 'Samstag', ['Sonntag', 'Freitag', 'Montag']], ['Wie viel zahlt die Großmutter am Ende pro Kilo?', '8 Lira', ['10 Lira', '5 Lira', '12 Lira']], ['Wohin gehen die beiden danach?', 'Ins Teehaus', ['Nach Hause', 'In die Moschee', 'Zur Brücke']]] },

{ id: 't-a2-heskif', lv: 'A2', title: 'Rojek li Heskîfê', de: 'Ein Tag in Heskîf', intro: 'Ein Ausflug mit Freunden, schön und traurig zugleich.',
  body: ['Havîna par ez û hevalên xwe çûn Heskîfê. Heskîf bajarekî kevnar e li ser çemê Dîcleyê, li herêma Êlihê. Em sibê zû bi otobusê ji Êlihê derketin. Rê nêzîkî saetekê kişand.',
    'Dema ku em gihîştin, hewa pir germ bû. Em li kêleka avê rûniştin û me bêhna xwe veda. Berê şikeftên li çiyê û pira kevn li wir bûn. Niha piraniya bajarê kevn di bin ava bendavê de ye.',
    'Kalekî ji gund ji me re got: „Ez li vir mezin bûm. Mala min jî niha di bin avê de ye.“ Em hemû bêdeng man. Êvarê em vegeriyan Êlihê. Ew rojeke xweş û xemgîn bû.'],
  tr: ['Letzten Sommer sind meine Freunde und ich nach Heskîf gefahren. Heskîf ist eine uralte Stadt am Tigris, in der Region Êlih. Wir fuhren früh morgens mit dem Bus von Êlih los. Die Fahrt dauerte etwa eine Stunde.',
    'Als wir ankamen, war es sehr heiß. Wir setzten uns ans Wasser und ruhten uns aus. Früher waren dort die Höhlen am Berg und die alte Brücke. Heute liegt der größte Teil der Altstadt unter dem Wasser des Stausees.',
    'Ein alter Mann aus dem Dorf sagte uns: „Ich bin hier aufgewachsen. Auch mein Haus liegt jetzt unter Wasser.“ Wir alle schwiegen. Am Abend kehrten wir nach Êlih zurück. Es war ein schöner und trauriger Tag.'],
  gloss: [['havîna par', 'letzten Sommer'], ['kevnar', 'uralt'], ['herêm', 'Region'], ['herêma', 'Region (mit Ezafe)'], ['kişand', 'dauerte (wörtl. zog)'], ['kêleka', 'Seite, neben'], ['bêhna xwe veda', 'ruhte sich aus'], ['şikeft', 'Höhle'], ['şikeftên', 'Höhlen (mit Ezafe)'], ['piraniya', 'der größte Teil'], ['bendav', 'Staudamm'], ['bendavê', 'des Staudamms'], ['kalekî', 'ein alter Mann (Oblique)'], ['mezin bûm', 'ich bin aufgewachsen'], ['bêdeng man', 'blieben still'], ['vegeriyan', 'kehrten zurück']],
  q: [['Wo liegt Heskîf?', 'Am Tigris, in der Region Êlih', ['Am Euphrat bei Riha', 'In den Bergen bei Wan', 'Am Meer']], ['Wie war das Wetter?', 'Sehr heiß', ['Regnerisch', 'Kalt', 'Neblig']], ['Was erzählt der alte Mann?', 'Sein Haus liegt heute unter Wasser', ['Er ist Busfahrer', 'Er hat die Brücke gebaut', 'Er zieht nach Amed']]] },

{ id: 't-a2-newroz', lv: 'A2', title: 'Newroz', de: 'Das Neujahrsfest', intro: 'Feuer, Tanz und eine alte Legende.',
  body: ['Newroz roja yekem a biharê ye. Kurd wê her sal di 21ê Adarê de pîroz dikin. Li gorî efsaneyê, hesinkarekî bi navê Kawa li dijî mîrê zalim Dehak serî hilda û li ser çiyê agirek pê xist. Ji wê rojê ve, agirê Newrozê nîşana azadiyê û destpêkeke nû ye.',
    'Li Amedê bi hezaran kes tên meydana Newrozê. Ew cilên rengîn li xwe dikin, govendê digirin û stranan dibêjin. Zarok li dora agir dilîzin.',
    'Malbat xwarinên taybet çêdikin û diçin serdana xizmên xwe. Gelek kes dibêjin: „Newroz pîroz be!“ Bersiv ev e: „Li te jî pîroz be!“'],
  tr: ['Newroz ist der erste Frühlingstag. Die Kurden feiern es jedes Jahr am 21. März. Der Legende nach erhob sich ein Schmied namens Kawa gegen den grausamen Herrscher Dehak und entzündete auf dem Berg ein Feuer. Seit diesem Tag ist das Newroz-Feuer ein Zeichen der Freiheit und eines Neubeginns.',
    'In Amed kommen Tausende Menschen auf den Newroz-Platz. Sie ziehen bunte Kleider an, tanzen Govend und singen Lieder. Die Kinder spielen rund um das Feuer.',
    'Familien kochen besondere Gerichte und besuchen ihre Verwandten. Viele sagen: „Frohes Newroz!“ Die Antwort lautet: „Dir auch ein frohes Fest!“'],
  gloss: [['yekem', 'erste/r'], ['Adar', 'März'], ['Adarê', 'März (Oblique)'], ['pîroz kirin', 'feiern'], ['pîroz dikin', 'feiern'], ['efsane', 'Legende'], ['efsaneyê', 'Legende (Oblique)'], ['hesinkar', 'Schmied'], ['hesinkarekî', 'ein Schmied (Oblique)'], ['zalim', 'grausam, tyrannisch'], ['serî hilda', 'erhob sich, rebellierte'], ['agir', 'Feuer'], ['agirek', 'ein Feuer'], ['pê xist', 'zündete an'], ['nîşan', 'Zeichen'], ['nîşana', 'Zeichen (mit Ezafe)'], ['meydan', 'Platz'], ['rengîn', 'bunt'], ['dora', 'rund um'], ['taybet', 'besonders'], ['xizm', 'Verwandte/r'], ['pîroz be', 'gesegnet sei / frohes Fest']],
  q: [['Wann wird Newroz gefeiert?', 'Am 21. März', ['Am 1. Januar', 'Am 21. Juni', 'Am 15. Mai']], ['Wer ist Kawa in der Legende?', 'Ein Schmied', ['Ein Hirte', 'Ein Fürst', 'Ein Sänger']], ['Was antwortet man auf „Newroz pîroz be!“?', 'Li te jî pîroz be!', ['Spas, baş im.', 'Bi xêr hatî!', 'Oxir be!']]] }
);

PZ.texts.push(
{ id: 't-b1-pir', lv: 'B1', title: 'Pira Dehderî', de: 'Die Zehn-Bogen-Brücke', intro: 'Ein Stück Geschichte über dem Tigris.',
  body: ['Li başûrê Amedê, li ser çemê Dîcleyê, pireke kevn heye ku jê re Pira Dehderî tê gotin, ji ber ku deh derî, ango deh kevanên wê hene. Pir di sala 1065an de, di dema Merwaniyan de hatiye avakirin. Merwanî xanedaneke kurd bûn ku navenda wan Farqîn bû.',
    'Bi sedan salan karwan, gundî û bazirgan di ser vê pirê re derbas bûn. Kalikên me digotin ku av di biharên berê de ewqas zêde dibû ku digihîşt kevanan.',
    'Îro pir ji bo peyayan e. Êvaran malbat û ciwan tên vir, li rojavabûnê temaşe dikin û çay vedixwin. Ne dûrî pirê, di navbera sûran û çem de, baxçeyên Hevselê hene, ku bi sedsalan e bajar xwedî dikin.'],
  tr: ['Im Süden von Amed steht über dem Tigris eine alte Brücke, die man Pira Dehderî nennt, weil sie zehn Tore, also zehn Bögen hat. Die Brücke wurde im Jahr 1065 zur Zeit der Marwaniden gebaut. Die Marwaniden waren eine kurdische Dynastie, deren Zentrum Farqîn (Silvan) war.',
    'Jahrhundertelang zogen Karawanen, Dorfbewohner und Händler über diese Brücke. Unsere Großväter erzählten, dass das Wasser in früheren Frühjahren so stark anstieg, dass es bis an die Bögen reichte.',
    'Heute gehört die Brücke den Fußgängern. Abends kommen Familien und junge Leute her, schauen den Sonnenuntergang an und trinken Tee. Nicht weit von der Brücke, zwischen den Stadtmauern und dem Fluss, liegen die Hevsel-Gärten, die die Stadt seit Jahrhunderten ernähren.'],
  gloss: [['başûr', 'Süden'], ['başûrê', 'Süden (mit Ezafe)'], ['kevan', 'Bogen'], ['kevanên', 'Bögen (mit Ezafe)'], ['kevanan', 'Bögen (Oblique)'], ['xanedan', 'Dynastie'], ['xanedaneke', 'eine Dynastie'], ['navend', 'Zentrum'], ['navenda', 'Zentrum (mit Ezafe)'], ['Farqîn', 'Silvan (Stadt)'], ['karwan', 'Karawane'], ['bazirgan', 'Händler/in'], ['kalikên', 'Großväter (mit Ezafe)'], ['ewqas', 'so sehr, so viel'], ['digihîşt', 'reichte, gelangte'], ['peyayan', 'Fußgänger (Oblique Pl.)'], ['rojavabûn', 'Sonnenuntergang'], ['rojavabûnê', 'Sonnenuntergang (Oblique)'], ['navbera', 'zwischen'], ['baxçe', 'Garten'], ['baxçeyên', 'Gärten (mit Ezafe)'], ['xwedî dikin', 'ernähren, versorgen']],
  q: [['Pira Dehderî li ser kîjan çemî ye?', 'Dîcle', ['Firat', 'Zap', 'Botan']], ['Pir kengê hatiye avakirin?', 'Di sala 1065an de', ['Di sala 1923an de', 'Di sala 1500an de', 'Par']], ['Îro kî di ser pirê re derbas dibin?', 'Peya', ['Erebe', 'Trên', 'Karwan']]] },

{ id: 't-b1-name', lv: 'B1', title: 'Name ji dapîrê re', de: 'Ein Brief an die Großmutter', intro: 'Azad schreibt aus Deutschland nach Hause.',
  body: ['Dapîra delal, silav!',
    'Ez hêvî dikim ku tu baş î. Ev du meh in ku ez li Almanyayê me. Berê min nizanîbû ku zivistan li vir ewqas dirêj e! Roj zû diçe ava û hema bêje her roj baran dibare.',
    'Min li vir karekî dît. Ez li xwaringeheke kurdî dixebitim. Xwediyê xwaringehê ji Êlihê ye, lewma em bi kurmancî xeber didin. Hefteya borî min kutilk çêkirin, lê ew ne wekî yên te bûn!',
    'Ez bêriya te, bêriya kolanên Amedê û bêriya çaya êvarê ya li ser banî dikim. Havîna bê ez ê bêm. Heta wê demê, xwe baş biparêze.',
    'Bi hezkirin, nevîyê te Azad'],
  tr: ['Liebe Oma, sei gegrüßt!', 'Ich hoffe, es geht dir gut. Seit zwei Monaten bin ich jetzt in Deutschland. Ich wusste vorher nicht, dass der Winter hier so lang ist! Die Sonne geht früh unter, und es regnet fast jeden Tag.',
    'Ich habe hier eine Arbeit gefunden. Ich arbeite in einem kurdischen Restaurant. Der Besitzer ist aus Êlih, deshalb sprechen wir Kurmancî. Letzte Woche habe ich Kutilk gemacht, aber sie waren nicht wie deine!',
    'Ich vermisse dich, die Gassen von Amed und den Abendtee auf dem Dach. Nächsten Sommer komme ich. Bis dahin pass gut auf dich auf.', 'In Liebe, dein Enkel Azad'],
  gloss: [['delal', 'lieb'], ['ev du meh in', 'seit zwei Monaten'], ['nizanîbû', 'wusste nicht'], ['ewqas', 'so sehr'], ['diçe ava', 'geht unter (Sonne)'], ['hema bêje', 'fast, beinahe'], ['karekî', 'eine Arbeit (Oblique)'], ['xwaringeheke', 'ein Restaurant (Oblique)'], ['xwedî', 'Besitzer/in'], ['xwediyê', 'Besitzer (mit Ezafe)'], ['wekî', 'wie'], ['bêriya … dikim', 'ich vermisse …'], ['bêriya', 'Sehnsucht nach'], ['biparêze', 'schütze, pass auf'], ['hezkirin', 'Liebe'], ['nevî', 'Enkel/in'], ['nevîyê', 'Enkel (mit Ezafe)']],
  q: [['Azad çend meh in li Almanyayê ye?', 'Du meh', ['Salek', 'Sê roj', 'Deh meh']], ['Azad li ku dixebite?', 'Li xwaringeheke kurdî', ['Li nexweşxaneyê', 'Li dibistanê', 'Li bazarê']], ['Azad bêriya çi dike?', 'Çaya êvarê li ser banî', ['Berfa Almanyayê', 'Baranê', 'Karê xwe']]] },

{ id: 't-b2-kutilk', lv: 'B2', title: 'Kutilkên Amedê', de: 'Ein Rezept aus Amed', intro: 'Passiv und Imperativ in der Küche.',
  body: ['Kutilk yek ji xwarinên herî navdar ên Amedê ye. Amadekirina wê dem û sebr dixwaze, lê tama wê hêjayî hewldanê ye.',
    'Pêşî, ji bo hundirê wê, goştê hêrayî bi pîvaz û gwîzan re di rûn de tê qelandin. Paşê îsot û xwê lê tên zêdekirin.',
    'Savara hûr nîv saetê di avê de tê hiştin. Piştre savar bi hinek goşt, xwê û îsotê re tê şêlan, heta ku hevîrekî nerm çêbibe.',
    'Ji hevîr gogên biçûk tên çêkirin. Her gog bi tiliyê tê kolan û bi tevliheviya goşt tê dagirtin. Devê gogê bi baldarî tê girtin. Di dawiyê de kutilk di ava kelandî de an jî di rûn de tên pijandin. Noşî can be!'],
  tr: ['Kutilk ist eines der berühmtesten Gerichte aus Amed. Die Zubereitung braucht Zeit und Geduld, aber der Geschmack ist die Mühe wert.',
    'Zuerst wird für die Füllung Hackfleisch mit Zwiebeln und Walnüssen in Öl angebraten. Dann werden Paprika und Salz hinzugefügt.',
    'Feiner Bulgur wird eine halbe Stunde in Wasser eingeweicht. Danach wird der Bulgur mit etwas Fleisch, Salz und Paprika geknetet, bis ein weicher Teig entsteht.',
    'Aus dem Teig werden kleine Kugeln geformt. Jede Kugel wird mit dem Finger ausgehöhlt und mit der Fleischmischung gefüllt. Die Öffnung wird sorgfältig verschlossen. Zum Schluss werden die Kutilk in kochendem Wasser oder in Öl gegart. Guten Appetit!'],
  gloss: [['amadekirin', 'Zubereitung'], ['amadekirina', 'Zubereitung (mit Ezafe)'], ['sebr', 'Geduld'], ['tam', 'Geschmack'], ['tama', 'Geschmack (mit Ezafe)'], ['hêja', 'wert'], ['hêjayî', 'wert (+ Ezafe)'], ['hewldanê', 'der Mühe'], ['hundir', 'Innenseite, Füllung'], ['hêrayî', 'gemahlen, gehackt'], ['gwîz', 'Walnuss'], ['gwîzan', 'Walnüssen'], ['rûn', 'Öl, Fett'], ['qelandin', 'braten'], ['îsot', 'scharfe Paprikaflocken'], ['zêdekirin', 'hinzufügen'], ['savar', 'Bulgur'], ['hûr', 'fein, klein'], ['şêlan', 'kneten'], ['hevîr', 'Teig'], ['hevîrekî', 'ein Teig (Oblique)'], ['nerm', 'weich'], ['çêbibe', 'entstehe'], ['gog', 'Kugel'], ['gogên', 'Kugeln (mit Ezafe)'], ['tilî', 'Finger'], ['tiliyê', 'Finger (Oblique)'], ['kolan', 'aushöhlen; auch: Gasse'], ['tevlihevî', 'Mischung'], ['tevliheviya', 'Mischung (mit Ezafe)'], ['dagirtin', 'füllen'], ['baldarî', 'Sorgfalt'], ['kelandî', 'gekocht, kochend'], ['pijandin', 'garen, kochen']],
  q: [['Ji bo hundirê kutilkê çi tê qelandin?', 'Goşt, pîvaz û gwîz', ['Savar û av', 'Penîr û hêk', 'Sêv û tirî']], ['Savar çiqas dem di avê de dimîne?', 'Nîv saet', ['Saetek', 'Deh deqîqe', 'Rojek']], ['Kutilk di dawiyê de çawa tên pijandin?', 'Di ava kelandî de an di rûn de', ['Li ser agir', 'Di firinê de bi şekir', 'Bi xav']]] },

{ id: 't-b2-dengbej', lv: 'B2', title: 'Mala Dengbêjan', de: 'Das Haus der Erzählsänger', intro: 'Ein Besuch in der Altstadt von Amed.',
  body: ['Di nav kolanên teng ên Sûrê de, xaniyekî kevn ê ji kevirên reş heye ku jê re Mala Dengbêjan tê gotin. Her roj, dengbêjên pîr li odeya mezin a xênî li dora hev rûdinin. Yek ji wan destê xwe datîne ser guhê xwe, çavên xwe digire û dest bi kilamekê dike.',
    'Dengbêjî hunereke kevn e. Di demên ku radyo û televizyon tunebûn de, dengbêjan bûyerên dîrokî, şer, evîn û koçberî bi dengê xwe vediguhestin nifşên nû. Ji ber vê yekê ji wan re „rojnameyên zindî“ jî tê gotin.',
    'Gelek ciwan îro ji dengbêjiyê dûr in. Lêbelê li Mala Dengbêjan carinan xortek an keçeke ciwan jî rûdine û guhdarî dike. Belkî ew ê rojekê bibin dengbêjên nû. Ji ber ku heta ku kesek kilamê bibêje, çîrok namirin.'],
  tr: ['In den engen Gassen von Sûr steht ein altes Haus aus schwarzem Stein, das man Mala Dengbêjan nennt. Jeden Tag sitzen dort die alten Dengbêjs im großen Raum des Hauses im Kreis. Einer von ihnen legt die Hand ans Ohr, schließt die Augen und beginnt ein Kilam.',
    'Dengbêjî ist eine alte Kunst. In Zeiten ohne Radio und Fernsehen trugen die Dengbêjs historische Ereignisse, Krieg, Liebe und Vertreibung mit ihrer Stimme an neue Generationen weiter. Deshalb nennt man sie auch „lebende Zeitungen“.',
    'Viele junge Leute stehen der Dengbêjî heute fern. Doch manchmal setzt sich im Mala Dengbêjan auch ein junger Mann oder eine junge Frau dazu und hört zu. Vielleicht werden sie eines Tages die neuen Dengbêjs. Denn solange jemand ein Kilam singt, sterben die Geschichten nicht.'],
  gloss: [['Sûr', 'Altstadt von Amed'], ['xênî', 'Haus (Oblique von xanî)'], ['li dora hev', 'im Kreis, beieinander'], ['datîne', 'legt hin (danîn)'], ['huner', 'Kunst'], ['hunereke', 'eine Kunst'], ['bûyer', 'Ereignis'], ['bûyerên', 'Ereignisse (mit Ezafe)'], ['dîrokî', 'historisch'], ['şer', 'Krieg, Kampf'], ['koçberî', 'Vertreibung, Auswanderung'], ['vediguhestin', 'übertrugen, gaben weiter'], ['nifş', 'Generation'], ['nifşên', 'Generationen (mit Ezafe)'], ['zindî', 'lebendig'], ['dengbêjiyê', 'Dengbêj-Kunst (Oblique)'], ['namirin', 'sterben nicht']],
  q: [['Mala Dengbêjan li kîjan taxa Amedê ye?', 'Li Sûrê', ['Li Êlihê', 'Li Hevselê', 'Li Farqînê']], ['Çima ji dengbêjan re „rojnameyên zindî“ tê gotin?', 'Ji ber ku wan bûyer û dîrok vediguhestin', ['Ji ber ku ew rojnameyan dixwînin', 'Ji ber ku ew li radyoyê dixebitin', 'Ji ber ku ew pir zû xeber didin']], ['Dengbêj dema dest bi kilamê dike çi dike?', 'Destê xwe datîne ser guhê xwe', ['Saz lêdixe', 'Radibe û direqise', 'Pirtûkekê dixwîne']]] },

{ id: 't-c1-ziman', lv: 'C1', title: 'Ziman û nasname', de: 'Sprache und Identität', intro: 'Ein kurzer Essay.',
  body: ['Ziman ne tenê amûreke ragihandinê ye; ew herwiha bîra civakekê ye. Di peyvan de dîrok, xweza û awayê jiyanê veşartî ne. Wek mînak, di kurmancî de gelek peyv hene ku têkiliya mirov bi çiya, pez û zozanan re nîşan didin: koçer, warge, berîvan, kon. Dema ku ziman lawaz dibe, ev bîr jî kêm dibe.',
    'Ji aliyekî ve, mirovên ku li bajarên mezin an li derveyî welêt mezin dibin, bi gelek zimanan re dijîn, û ev dewlemendiyek e. Ji aliyê din ve, heke zimanê dayikê tenê li malê û tenê di axaftina rojane de bimîne, peyvên kevn û şêweyên vegotinê yên dewlemend hêdî hêdî winda dibin.',
    'Lêbelê ziman ne muzexane ye; ew dijî, diguhere û peyvên nû werdigire. Ya girîng ew e ku axaftvan xwedî li zimanê xwe derkevin: pirtûkan bixwînin, binivîsin, bi zarokên xwe re bipeyivin û ji zimanê xwe şerm nekin. Bi kurtî, temenê zimanekî bi qasî evîna axaftvanên wî dirêj e.'],
  tr: ['Sprache ist nicht nur ein Werkzeug der Verständigung; sie ist auch das Gedächtnis einer Gemeinschaft. In den Wörtern sind Geschichte, Natur und Lebensweise verborgen. Im Kurmancî etwa gibt es viele Wörter, die die Verbindung des Menschen zu Bergen, Herden und Sommerweiden zeigen: Nomade, Lagerplatz, Melkerin, Zelt. Wenn eine Sprache schwach wird, schwindet auch dieses Gedächtnis.',
    'Einerseits leben Menschen, die in Großstädten oder im Ausland aufwachsen, mit vielen Sprachen, und das ist ein Reichtum. Andererseits gehen, wenn die Muttersprache nur zu Hause und nur im Alltagsgespräch bleibt, die alten Wörter und die reichen Ausdrucksformen nach und nach verloren.',
    'Doch eine Sprache ist kein Museum; sie lebt, verändert sich und nimmt neue Wörter auf. Wichtig ist, dass die Sprecher sich ihrer Sprache annehmen: Bücher lesen, schreiben, mit ihren Kindern sprechen und sich ihrer Sprache nicht schämen. Kurz gesagt: Das Leben einer Sprache währt so lange wie die Liebe ihrer Sprecher.'],
  gloss: [['amûr', 'Werkzeug'], ['amûreke', 'ein Werkzeug'], ['ragihandin', 'Kommunikation, Verständigung'], ['ragihandinê', 'der Kommunikation'], ['civakekê', 'einer Gemeinschaft'], ['xweza', 'Natur'], ['awa', 'Art, Weise'], ['awayê', 'Art (mit Ezafe)'], ['veşartî', 'verborgen'], ['warge', 'Lagerplatz'], ['kon', 'Zelt'], ['derveyî', 'außerhalb'], ['dewlemendî', 'Reichtum'], ['dewlemendiyek', 'ein Reichtum'], ['rojane', 'täglich, alltäglich'], ['şêwe', 'Form, Art'], ['şêweyên', 'Formen (mit Ezafe)'], ['vegotin', 'Erzählung, Ausdruck'], ['vegotinê', 'des Ausdrucks'], ['muzexane', 'Museum'], ['diguhere', 'verändert sich'], ['werdigire', 'nimmt auf, übernimmt'], ['axaftvan', 'Sprecher/in'], ['xwedî li … derketin', 'sich annehmen, eintreten für'], ['derkevin', 'eintreten (Subjunktiv)'], ['şerm', 'Scham'], ['temen', 'Lebensdauer, Alter'], ['bi qasî', 'so viel wie']],
  q: [['Li gorî nivîsê, ziman ji bilî amûra ragihandinê çi ye?', 'Bîra civakê', ['Muzexaneyek', 'Tenê dîrok', 'Lîstikek']], ['Kîjan peyv têkiliya mirov bi çiya û pez re nîşan dide?', 'Zozan', ['Muzexane', 'Rojname', 'Televizyon']], ['Nivîskar dibêje ziman çawa ye?', 'Dijî û diguhere', ['Qet naguhere', 'Tenê li malê heye', 'Divê bê girtin']]] }
);

{ id: 't-c2-nesredin', lv: 'C2', title: 'Pêkenokên Mela Nesredîn', de: 'Geschichten von Mela Nesredîn', intro: 'Zwei Volksgeschichten, frei nacherzählt.',
  body: ['Rojekê cîranê Mela Nesredîn hat ber derî û got: „Mela, kerê xwe bide min, ez ê biçim bajêr û êvarê vegerim.“ Mela qet nexwest kerê xwe bide, lewma got: „Mixabin, ker ne li vir e. Kurê min ew biriye zeviyê.“ Hema di wê gavê de ker di axur de zirî. Cîran ecêbmayî ma û got: „Lê ez dengê kerê dibihîzim!“ Mela rûyê xwe tirş kir û got: „Ma tu ji min bawer dikî an ji vî kerî?“',
    'Carekê Mela bi cilên xwe yên kevn û qetiyayî çû dawetekê. Kesî guh nedayê, kesî cih nîşanî wî neda. Mela bêdeng vegeriya malê, kurkê xwe yê herî spehî li xwe kir û dîsa çû. Vê carê hemûyan rêz lê girt û ew li jorê odeyê dan rûniştin. Gava xwarin hat, Mela milê kurkê xwe xist nav şorbeyê û got: „Bixwe, kurkê min, bixwe! Ev xwarin ji bo te ye, ne ji bo min.“'],
  tr: ['Eines Tages kam der Nachbar von Mela Nesredîn an die Tür und sagte: „Mela, leih mir deinen Esel, ich will in die Stadt und abends zurückkommen.“ Mela wollte seinen Esel auf keinen Fall hergeben und sagte deshalb: „Leider ist der Esel nicht hier. Mein Sohn hat ihn aufs Feld gebracht.“ Genau in diesem Moment iahte der Esel im Stall. Der Nachbar staunte und sagte: „Aber ich höre doch den Esel!“ Mela verzog das Gesicht und sagte: „Glaubst du etwa mir oder diesem Esel?“',
    'Einmal ging Mela in seinen alten, zerrissenen Kleidern zu einer Hochzeit. Niemand beachtete ihn, niemand bot ihm einen Platz an. Mela ging schweigend nach Hause, zog seinen schönsten Pelzmantel an und ging wieder hin. Diesmal erwiesen ihm alle Ehre und setzten ihn ganz oben in den Raum. Als das Essen kam, tauchte Mela den Ärmel seines Pelzes in die Suppe und sagte: „Iss, mein Pelz, iss! Dieses Essen ist für dich, nicht für mich.“'],
  gloss: [['kerê', 'Esel (mit Ezafe)'], ['nexwest', 'wollte nicht'], ['biriye', 'hat gebracht (birin)'], ['gav', 'Moment, Schritt'], ['gavê', 'Moment (Oblique)'], ['ecêbmayî', 'erstaunt'], ['ma', 'blieb; etwa (Frage)'], ['rû', 'Gesicht'], ['rûyê', 'Gesicht (mit Ezafe)'], ['tirş', 'sauer'], ['rûyê xwe tirş kir', 'verzog das Gesicht'], ['carekê', 'einmal'], ['qetiyayî', 'zerrissen'], ['dawetekê', 'einer Hochzeit'], ['kesî', 'niemand (Oblique)'], ['guh nedayê', 'beachtete ihn nicht'], ['nîşanî … dan', 'jemandem zeigen'], ['bêdeng', 'still, schweigend'], ['kurk', 'Pelzmantel'], ['kurkê', 'Pelz (mit Ezafe)'], ['spehî', 'schön'], ['dîsa', 'wieder'], ['rêz lê girtin', 'jemandem Ehre erweisen'], ['hemûyan', 'alle (Oblique)'], ['jorê', 'oberer Teil'], ['dan rûniştin', 'ließen sitzen, setzten'], ['mil', 'Ärmel; Schulter'], ['milê', 'Ärmel (mit Ezafe)'], ['xist', 'steckte, warf hinein (xistin)'], ['şorbe', 'Suppe'], ['şorbeyê', 'Suppe (Oblique)'], ['bixwe', 'iss!'], ['zeviyê', 'Feld (Oblique)'], ['bawer', 'Glaube'], ['axur', 'Stall'], ['zirî', 'iahte'], ['ker', 'Esel'], ['kerî', 'Esel (Oblique)'], ['nedayê', 'gab ihm nicht']],
  q: [['Mela çima got ku ker ne li vir e?', 'Ji ber ku wî nexwest kerê xwe bide', ['Ji ber ku ker nexweş bû', 'Ji ber ku kurê wî li bajêr bû', 'Ji ber ku cîran dereng hat']], ['Cîran çawa fêm kir ku ker li malê ye?', 'Wî dengê kerê bihîst', ['Wî ker di axur de dît', 'Kurê Mela jê re got', 'Mela bi xwe got']], ['Çima Mela milê kurkê xist nav şorbeyê?', 'Ji ber ku rêz ji bo cilên wî hat girtin, ne ji bo wî', ['Ji ber ku ew pir birçî bû', 'Ji ber ku şorbe sar bû', 'Ji ber ku kurk qirêj bû']]] },

{ id: 't-c2-zarava', lv: 'C2', title: 'Zarava û standard: dijber an hevalbend?', de: 'Dialekt und Standard: Gegner oder Verbündete?', intro: 'Ein Meinungsbeitrag.',
  body: ['Her carê ku nîqaşa zimanê standard dest pê dike, heman pirs derdikeve pêş: Gelo zimanekî standard zaravayan dikuje an wan diparêze? Hinek dibêjin ku heke ziman standard bibe, devokên gundan ên dewlemend dê hêdî hêdî winda bibin. Hinekên din jî bawer dikin ku bêyî standardekê, ziman di dibistan, medya û zanîngehê de cih nagire.',
    'Bi ya min, ev pirs bi xwe xelet hatiye danîn. Standard û zarava ne dijberên hev in; ew du qatên heman avahiyê ne. Standard wek pira navbera herêman e: zarokekî ji Amedê û yekî ji Duhokê dikarin bi alîkariya wê heman pirtûkê bixwînin. Zarava jî bingeha zindî ya wê pirê ne; bêyî wan pir li ser valahiyê radiweste.',
    'Pirsgirêka rastîn ne cudahiya zaravayan e, kêmbûna axaftvanan e. Heke zarok li malê bi kurmancî mezin nebin, ne standard dikare ziman xilas bike, ne jî zarava. Ji ber vê yekê erka herî girîng ne nîqaşa forman e, axaftina rojane ye: li malê, li kolanê, li ser telefonê.',
    'Wekî encam, divê em hem fêrî standardê bibin hem jî devoka bavûkalên xwe biparêzin. Kesê ku herduyan dizane, ne ji zimanekî, ji du dewlemendiyan sûdê werdigire.'],
  tr: ['Jedes Mal, wenn die Debatte über die Standardsprache beginnt, taucht dieselbe Frage auf: Tötet eine Standardsprache die Dialekte oder schützt sie sie? Manche sagen, wenn die Sprache standardisiert wird, werden die reichen Dorfmundarten nach und nach verschwinden. Andere glauben, dass die Sprache ohne einen Standard keinen Platz in Schule, Medien und Universität findet.',
    'Meiner Meinung nach ist schon die Frage falsch gestellt. Standard und Dialekte sind keine Gegner; sie sind zwei Stockwerke desselben Gebäudes. Der Standard ist wie eine Brücke zwischen den Regionen: Ein Kind aus Amed und eines aus Duhok können mit seiner Hilfe dasselbe Buch lesen. Die Dialekte wiederum sind das lebendige Fundament dieser Brücke; ohne sie stünde die Brücke über dem Nichts.',
    'Das eigentliche Problem ist nicht die Verschiedenheit der Dialekte, sondern der Rückgang der Sprecher. Wenn Kinder zu Hause nicht mit Kurmancî aufwachsen, kann weder der Standard die Sprache retten noch der Dialekt. Deshalb ist die wichtigste Aufgabe nicht der Streit um Formen, sondern das tägliche Sprechen: zu Hause, auf der Straße, am Telefon.',
    'Als Ergebnis sollten wir sowohl den Standard lernen als auch die Mundart unserer Vorfahren bewahren. Wer beides kann, profitiert nicht von einer Sprache, sondern von zwei Reichtümern.'],
  gloss: [['her carê ku', 'jedes Mal, wenn'], ['heman', 'derselbe, dieselbe'], ['derdikeve pêş', 'tritt hervor, taucht auf'], ['gelo', 'ob, wohl (Frage)'], ['dikuje', 'tötet'], ['diparêze', 'schützt'], ['hinekên din', 'andere'], ['cih nagire', 'findet keinen Platz'], ['danîn', 'stellen, legen'], ['hatiye danîn', 'ist gestellt worden'], ['dijber', 'Gegner'], ['dijberên', 'Gegner (mit Ezafe)'], ['qat', 'Stockwerk, Schicht'], ['qatên', 'Stockwerke (mit Ezafe)'], ['avahî', 'Gebäude'], ['avahiyê', 'Gebäude (Oblique)'], ['navbera', 'zwischen'], ['herêman', 'Regionen (Oblique)'], ['zarokekî', 'ein Kind (Oblique)'], ['bingeh', 'Fundament, Grundlage'], ['bingeha', 'Fundament (mit Ezafe)'], ['valahî', 'Leere'], ['valahiyê', 'Leere (Oblique)'], ['radiweste', 'steht (rawestan)'], ['rastîn', 'eigentlich, wirklich'], ['kêmbûn', 'Abnahme, Rückgang'], ['kêmbûna', 'Rückgang (mit Ezafe)'], ['axaftvanan', 'Sprecher (Oblique Pl.)'], ['nebin', 'nicht werden (Subjunktiv)'], ['xilas kirin', 'retten'], ['erk', 'Aufgabe, Pflicht'], ['erka', 'Aufgabe (mit Ezafe)'], ['rojane', 'täglich'], ['bavûkal', 'Vorfahren'], ['bavûkalên', 'Vorfahren (mit Ezafe)'], ['herduyan', 'beide (Oblique)'], ['sûd', 'Nutzen'], ['sûdê werdigire', 'zieht Nutzen'], ['dewlemendiyan', 'Reichtümern (Oblique)'], ['standardekê', 'einen Standard (Oblique)'], ['devokên', 'Mundarten (mit Ezafe)'], ['hem … hem jî', 'sowohl … als auch'], ['ne … ne jî', 'weder … noch'], ['hem', 'sowohl'], ['bibe', 'werde (Subjunktiv von bûn)'], ['mezin', 'groß'], ['forman', 'Formen (Oblique)'], ['standard', 'Standard'], ['standardê', 'Standard (Oblique)'], ['pirs', 'Frage'], ['pêş', 'vorne, nach vorn'], ['bawer', 'Glaube (bawer kirin: glauben)'], ['xilas', 'gerettet; fertig'], ['fêrî', '(fêrî … bûn: lernen)'], ['biparêzin', 'bewahren, schützen (Subjunktiv)']],
  q: [['Li gorî nivîskar, standard û zarava çi ne?', 'Du qatên heman avahiyê ne', ['Du dijberên hev in', 'Heman tişt in', 'Ne girîng in']], ['Pirsgirêka rastîn çi ye?', 'Kêmbûna axaftvanan', ['Cudahiya zaravayan', 'Zehmetiya standardê', 'Kêmbûna pirtûkan']], ['Nivîskar di dawiyê de çi pêşniyar dike?', 'Hem standardê fêr bibin hem jî devokê biparêzin', ['Tenê standardê fêr bibin', 'Tenê bi devokê biaxivin', 'Dev ji nîqaşê berdin']]] },

{ id: 't-c2-ban', lv: 'C2', title: 'Şeva dawî ya havînê', de: 'Die letzte Sommernacht', intro: 'Eine literarische Erzählung.',
  body: ['Germahiya rojê hêdî hêdî ji kevirên reş ên Sûrê diherikî û bayekî hênik ji aliyê Dîcleyê ve dihat. Li ser banê mala dapîrê, nivîn wek her şev hatibûn raxistin, lê vê carê bêhna payîzê jî tevlî bêhna nanê sêlê bûbû.',
    'Dapîra min li ser doşekê rûniştibû, tizbiya xwe di nav tiliyên xwe de digerand û bi dengekî nizm kilameke kevn digot. Min nizanîbû ka ew ji bo me dibêje an ji bo kesên ku êdî ne li vir in. Stêrk ewqas nêzîk xuya dibûn ku mirov difikirî, heke destê xwe dirêj bike, dê yekê bigire.',
    '„Sibe tu diçî“, wê got bêyî ku li min binêre. „Li wir jî stêrk hene, lê ew ne stêrkên me ne.“ Min tiştek negot. Hin gotin hene ku bersiva wan bêdengî ye.',
    'Berî ku xew bikeve çavên min, min guh da dengê bajêr: kûçikekî dûr, erebeyek ku ber bi Pira Dehderî ve diçû, û dengê dapîrê yê ku her ku diçû kêm dibû. Wê şevê min fêm kir ku bîranîn ne ew in ku em li dû xwe dihêlin, ew in ku em bi xwe re dibin.'],
  tr: ['Die Hitze des Tages floss langsam aus den schwarzen Steinen von Sûr, und ein kühler Wind kam vom Tigris herüber. Auf dem Dach von Großmutters Haus waren die Schlafdecken wie jede Nacht ausgebreitet, doch diesmal hatte sich in den Duft des Fladenbrots auch der Geruch des Herbstes gemischt.',
    'Großmutter saß auf der Matratze, ließ ihre Gebetskette durch die Finger gleiten und sang mit leiser Stimme ein altes Kilam. Ich wusste nicht, ob sie es für uns sang oder für die, die nicht mehr hier sind. Die Sterne schienen so nah, dass man dachte, wenn man die Hand ausstreckt, würde man einen fangen.',
    '„Morgen gehst du“, sagte sie, ohne mich anzusehen. „Dort gibt es auch Sterne, aber es sind nicht unsere Sterne.“ Ich sagte nichts. Es gibt Worte, auf die Schweigen die Antwort ist.',
    'Bevor mir der Schlaf in die Augen fiel, lauschte ich den Geräuschen der Stadt: einem fernen Hund, einem Auto, das in Richtung der Zehn-Bogen-Brücke fuhr, und Großmutters Stimme, die immer leiser wurde. In jener Nacht verstand ich, dass Erinnerungen nicht das sind, was wir hinter uns lassen, sondern das, was wir mit uns nehmen.'],
  gloss: [['germahiya', 'Hitze (mit Ezafe)'], ['diherikî', 'floss (herikîn)'], ['herikîn', 'fließen'], ['bayekî', 'ein Wind (Oblique)'], ['hênik', 'kühl'], ['banê', 'Dach (mit Ezafe)'], ['nivîn', 'Bettzeug, Schlafdecken'], ['raxistin', 'ausbreiten'], ['hatibûn raxistin', 'waren ausgebreitet worden'], ['bêhn', 'Geruch, Duft'], ['bêhna', 'Duft (mit Ezafe)'], ['tevlî … bûbû', 'hatte sich gemischt'], ['sêl', 'gewölbte Backplatte'], ['nanê sêlê', 'Fladenbrot von der Backplatte'], ['doşek', 'Matratze, Sitzpolster'], ['doşekê', 'Matratze (Oblique)'], ['tizbî', 'Gebetskette'], ['tizbiya', 'Gebetskette (mit Ezafe)'], ['digerand', 'ließ kreisen'], ['nizm', 'leise, niedrig'], ['dengekî', 'einer Stimme (Oblique)'], ['kilameke', 'ein Kilam'], ['nizanîbû', 'wusste nicht'], ['dapîra', 'Großmutter (mit Ezafe)'], ['fêrî', 'lernen (fêrî … bûn)'], ['xuya dibûn', 'erschienen'], ['difikirî', 'dachte'], ['dirêj bike', 'ausstrecke'], ['bigire', 'fange, greife (Subjunktiv)'], ['bêyî ku', 'ohne dass'], ['negot', 'sagte nicht'], ['hin', 'manche'], ['bêdengî', 'Schweigen'], ['xew', 'Schlaf'], ['bikeve', 'falle (Subjunktiv)'], ['guh da', 'hörte zu'], ['kûçikekî', 'eines Hundes (Oblique)'], ['her ku diçû', 'immer mehr'], ['bîranîn', 'Erinnerung'], ['li dû xwe dihêlin', 'hinter uns lassen'], ['dibin', 'nehmen mit (birin); werden'], ['diçû', 'ging, fuhr'], ['êdî', 'nicht mehr; schon'], ['heke', 'wenn'], ['dê', 'Futurteilchen'], ['yekê', 'einen (Oblique)'], ['tevlî', '(tevlî … bûn: sich mischen)'], ['tiliyên', 'Finger (mit Ezafe)'], ['ewqas', 'so sehr'], ['xuya', 'sichtbar (xuya bûn: erscheinen)'], ['binêre', 'sieh an (nihêrîn)'], ['fêm', '(fêm kirin: verstehen)'], ['dû', 'hinten (li dû: hinter)']],

/* ---------- normalisation & answer checking ---------- */
const DIA = { 'ê': 'e', 'î': 'i', 'û': 'u', 'ç': 'c', 'ş': 's', 'â': 'a', 'é': 'e', 'ı': 'i', 'ğ': 'g', 'ö': 'o', 'ü': 'u', 'ä': 'a' };
const norm = s => String(s).toLowerCase().replace(/[’'`´]/g, '').replace(/[.,!?;:¿¡"“”„()\-–—…]/g, ' ').replace(/\s+/g, ' ').trim();
const flat = s => norm(s).replace(/[êîûçşâéığöüä]/g, c => DIA[c]);
function check(given, targets) {
  const g = norm(given), gf = flat(given);
  const ts = (Array.isArray(targets) ? targets : [targets]).flatMap(t => String(t).split('|'));
  if (ts.some(t => norm(t) === g)) return 'ok';
  if (ts.some(t => flat(t) === gf)) return 'near';
  return 'bad';
}

/* ---------- days, xp, streak ---------- */
const dkey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const todayXP = () => S.days[dkey()] || 0;
function streak() {
  let n = 0, t = Date.now();
  if (!S.days[dkey(t)]) t -= DAY;
  const fr = (S.game && S.game.frozen) || {};
  while (S.days[dkey(t)] || fr[dkey(t)]) { n++; t -= DAY; }
  return n;
}
function addXP(n) { S.xp += n; S.days[dkey()] = (S.days[dkey()] || 0) + n; checkBadges(); save(); }

/* ---------- dictionary & SRS ---------- */
const DICT = new Map();   // lower(ku) -> {ku, de, tip, lesson, lv}
function buildDict() {
  DICT.clear();
  for (const l of PZ.lessons) for (const v of l.vocab || []) { const k = v[0].toLowerCase(); if (!DICT.has(k)) DICT.set(k, { ku: v[0], de: v[1], tip: v[2] || '', lesson: l.id, lv: l.lv }); }
  for (const [k, w] of Object.entries(S.custom || {})) if (!DICT.has(k)) DICT.set(k, { ku: w.ku, de: w.de, tip: 'aus einem Lesetext', lesson: null, lv: w.lv });
}
function addCards(words, dueNow = []) {
  const now = Date.now();
  for (const w of words) { const k = w.toLowerCase(); if (!S.cards[k]) S.cards[k] = { d: now + 20 * 3600e3, i: 1, e: 2.5, r: 1, l: 0 }; }
  for (const w of dueNow) { const c = S.cards[w.toLowerCase()]; if (c) { c.d = now; c.r = 0; c.i = 0; } }
}
const dueCards = () => { const now = Date.now(); return Object.entries(S.cards).filter(([k, c]) => c.d <= now && DICT.has(k)).sort((a, b) => a[1].d - b[1].d).map(e => e[0]); };
function grade(k, q) { // q: 0 again, 1 hard, 2 good, 3 easy
  const c = S.cards[k]; if (!c) return; const now = Date.now();
  if (q === 0) { c.r = 0; c.l++; c.i = 0; c.e = Math.max(1.3, c.e - .2); c.d = now + 10 * 60e3; }
  else {
    if (c.r === 0) c.i = q === 3 ? 4 : 1;
    else if (c.r === 1) c.i = q === 1 ? 3 : q === 2 ? 4 : 7;
    else c.i = Math.max(c.i + 1, Math.round(c.i * (q === 1 ? 1.2 : q === 2 ? c.e : c.e * 1.35)));
    c.e = Math.min(3.2, Math.max(1.3, c.e + (q === 1 ? -.15 : q === 3 ? .12 : 0)));
    c.r++; c.d = now + c.i * DAY - 3600e3;
  }
  S.reviews = (S.reviews || 0) + 1;
}
const nextInterval = (k, q) => { const c = S.cards[k]; if (!c) return ''; if (q === 0) return '10 min'; let i; if (c.r === 0) i = q === 3 ? 4 : 1; else if (c.r === 1) i = q === 1 ? 3 : q === 2 ? 4 : 7; else i = Math.max(c.i + 1, Math.round(c.i * (q === 1 ? 1.2 : q === 2 ? c.e : c.e * 1.35))); return i < 31 ? i + ' T' : Math.round(i / 30) + ' Mon'; };

/* ---------- lessons & unlocking ---------- */
const byLevel = lv => PZ.lessons.filter(l => l.lv === lv);
const lessonById = id => PZ.lessons.find(l => l.id === id);
function levelOpen(lv) {
  const i = LEVELS.indexOf(lv); if (i <= 0 || S.free) return true;
  const prev = LEVELS[i - 1];
  return !!S.levels[lv]?.passed || !!S.levels[prev]?.passed && levelOpen(prev) || byLevel(prev).every(l => S.lessons[l.id]);
}
function lessonOpen(l) {
  if (S.free || S.levels[l.lv]?.passed || S.lessons[l.id]) return true;
  if (!levelOpen(l.lv)) return false;
  const arr = byLevel(l.lv), i = arr.indexOf(l);
  return i === 0 || !!S.lessons[arr[i - 1].id];
}
function nextLesson() { for (const lv of LEVELS) for (const l of byLevel(lv)) if (!S.lessons[l.id] && lessonOpen(l)) return l; return null; }
function levelProgress(lv) { const a = byLevel(lv); return a.length ? a.filter(l => S.lessons[l.id]).length / a.length : 0; }

/* ---------- bridge ---------- */
function bridgeSVG() {
  const W = 1140, base = 170, deckY = 64, ri = 33, ro = 42, ryi = 60, ryo = 70;
  let holes = '', rings = '', labels = '';
  const partState = (lv, part) => { const done = part.filter(l => S.lessons[l.id]).length; return [(S.levels[lv]?.passed || (part.length && done === part.length)) ? 'on' : done ? 'half' : '', done]; };
  LEVELS.slice(0, 5).forEach((lv, li) => {
    const ls = byLevel(lv), half = Math.ceil(ls.length / 2);
    [ls.slice(0, half), ls.slice(half)].forEach((part, pi) => {
      const k = li * 2 + pi, cx = 20 + 48 + 96 * k;
      const [cls, done] = partState(lv, part);
      holes += `M${cx - ri},${base} A${ri},${ryi} 0 0 1 ${cx + ri},${base} Z `;
      rings += `<path class="arch ${cls}" d="M${cx - ro},${base} A${ro},${ryo} 0 0 1 ${cx + ro},${base} L${cx + ri},${base} A${ri},${ryi} 0 0 0 ${cx - ri},${base} Z"><title>${lv} · Teil ${pi + 1}: ${done}/${part.length} Lektionen</title></path>`;
    });
    labels += `<text x="${20 + 96 * (li * 2 + 1)}" y="${deckY - 10}" text-anchor="middle">${lv}</text>`;
  });
  const c2 = byLevel('C2'), h2 = Math.ceil(c2.length / 2);
  const [cb, db] = partState('C2', c2.slice(0, h2)), [ct, dt] = partState('C2', c2.slice(h2));
  let merl = ''; for (let i = 0; i < 4; i++) merl += `<rect class="arch ${ct}" x="${1040 + i * 20}" y="16" width="12" height="16"/>`;
  const tower = `<path d="M988,${base} L1000,96 H1140 V205 H988 Z" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5"/>
    <rect class="arch ${cb}" x="1036" y="96" width="76" height="74"><title>C2 · Teil 1: ${db}/${h2} Lektionen</title></rect>
    <rect class="arch ${ct}" x="1030" y="32" width="88" height="64"><title>C2 · Teil 2: ${dt}/${c2.length - h2} Lektionen</title></rect>${merl}
    <rect x="1064" y="128" width="20" height="42" rx="10" fill="var(--ink)" opacity=".75"/>
    <rect x="1066" y="52" width="16" height="24" rx="8" fill="var(--ink)" opacity=".6"/>
    <text x="1074" y="10" text-anchor="middle">C2</text>`;
  let wave = 'M0,182'; for (let x = 0; x <= 1000 + 80; x += 20) wave += ` q10,-5 20,0`;
  return `<svg class="bridge" viewBox="0 0 ${W} 205" role="img" aria-label="Fortschrittsbrücke: zehn Bögen von A1 bis C1, dahinter der Turm für C2">
    <defs><clipPath id="wclip"><rect x="0" y="0" width="1000" height="205"/></clipPath></defs>
    <rect class="water" x="0" y="${base}" width="1000" height="35"/>
    <path class="wave" d="${wave}" clip-path="url(#wclip)"/>
    <path d="M20,${deckY + 14} H980 V${base} H20 Z ${holes}" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" fill-rule="evenodd"/>
    ${rings}
    <rect class="deck" x="12" y="${deckY}" width="976" height="14" rx="3"/>
    ${tower}
    ${labels}
  </svg>`;
}
