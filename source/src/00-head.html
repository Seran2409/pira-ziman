<title>Pira Ziman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Ala Rengîn – the Kurdish flag. Red, white and green as the frame, the golden 21-ray sun (Roj) marks rewards and the daily goal. Sidebar (desktop) / bottom bar (phone). The ten-arched bridge of Amed is the progress meter. */
:root{
  --flag-red:#ED2024; --flag-white:#FFFFFF; --flag-green:#278E43; --flag-sun:#FEBD11;
  --bg:#F4F6F3; --surface:#FFFFFF; --sunk:#E9EDE9; --ink:#141A16; --muted:#55605A; --line:#D5DCD6;
  --hinar:#D0202A; --hinar-soft:#FCE4E4; --on-hinar:#FFFFFF;
  --dicle:#1A7A3A; --dicle-soft:#DCF0E2;
  --roj:#F5B300; --roj-soft:#FFF1C7; --roj-ink:#8A6100;
  --ok:#1A7A3A; --ok-soft:#DCF0E2; --bad:#C2410C; --bad-soft:#FBE3D6;
  --shadow:0 1px 2px rgba(20,26,22,.06),0 8px 24px rgba(20,26,22,.06);
  --shade:radial-gradient(75% 55% at 100% 0%,rgba(254,189,17,.26),transparent 70%),radial-gradient(65% 50% at 0% 8%,rgba(237,32,36,.13),transparent 70%),radial-gradient(85% 60% at 45% 100%,rgba(39,142,67,.17),transparent 72%);
  --glass:color-mix(in srgb,var(--surface) 74%,transparent); --glass-line:color-mix(in srgb,var(--line) 75%,transparent);
  --w-red:linear-gradient(140deg,#FFD3CF 0%,#FFF0EE 72%); --w-red-line:#F4B4AE;
  --w-sun:linear-gradient(140deg,#FFE29A 0%,#FFF7DD 72%); --w-sun-line:#EFD07A;
  --w-green:linear-gradient(140deg,#BDEBCB 0%,#ECF9F0 72%); --w-green-line:#A6DBB7;
  --w-shadow:0 1px 2px rgba(20,26,22,.05),0 10px 28px -8px rgba(20,26,22,.14);
  --btn-red:linear-gradient(135deg,#FF4A4F 0%,#E8141F 55%,#C80F1A 100%); --btn-red-glow:rgba(232,20,31,.55); --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#FFFFFF;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#161C18; --sunk:#1F2722; --ink:#E8EEEA; --muted:#9AA7A0; --line:#2C3830;
  --hinar:#FF6B6F; --hinar-soft:#3D1A1C; --on-hinar:#2A0708;
  --dicle:#4CC47A; --dicle-soft:#14301F;
  --roj:#FFC83D; --roj-soft:#3A2F10; --roj-ink:#FFC83D;
  --ok:#4CC47A; --ok-soft:#14301F; --bad:#F27A45; --bad-soft:#3B2216;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shade:radial-gradient(75% 55% at 100% 0%,rgba(254,189,17,.13),transparent 70%),radial-gradient(65% 50% at 0% 8%,rgba(237,32,36,.12),transparent 70%),radial-gradient(85% 60% at 45% 100%,rgba(39,142,67,.16),transparent 72%);
  --glass:color-mix(in srgb,var(--surface) 70%,transparent); --glass-line:color-mix(in srgb,var(--line) 80%,transparent);
  --w-red:linear-gradient(140deg,#4E1A1F 0%,#221618 72%); --w-red-line:#6B2A30;
  --w-sun:linear-gradient(140deg,#4A390B 0%,#252013 72%); --w-sun-line:#6A5414;
  --w-green:linear-gradient(140deg,#11432A 0%,#15231B 72%); --w-green-line:#1F5C38;
  --w-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.45);
  --btn-red:linear-gradient(135deg,#FF4A4F 0%,#E8141F 55%,#C80F1A 100%); --btn-red-glow:rgba(255,60,70,.42); --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#06210F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#161C18; --sunk:#1F2722; --ink:#E8EEEA; --muted:#9AA7A0; --line:#2C3830;
  --hinar:#FF6B6F; --hinar-soft:#3D1A1C; --on-hinar:#2A0708;
  --dicle:#4CC47A; --dicle-soft:#14301F;
  --roj:#FFC83D; --roj-soft:#3A2F10; --roj-ink:#FFC83D;
  --ok:#4CC47A; --ok-soft:#14301F; --bad:#F27A45; --bad-soft:#3B2216;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shade:radial-gradient(75% 55% at 100% 0%,rgba(254,189,17,.13),transparent 70%),radial-gradient(65% 50% at 0% 8%,rgba(237,32,36,.12),transparent 70%),radial-gradient(85% 60% at 45% 100%,rgba(39,142,67,.16),transparent 72%);
  --glass:color-mix(in srgb,var(--surface) 70%,transparent); --glass-line:color-mix(in srgb,var(--line) 80%,transparent);
  --w-red:linear-gradient(140deg,#4E1A1F 0%,#221618 72%); --w-red-line:#6B2A30;
  --w-sun:linear-gradient(140deg,#4A390B 0%,#252013 72%); --w-sun-line:#6A5414;
  --w-green:linear-gradient(140deg,#11432A 0%,#15231B 72%); --w-green-line:#1F5C38;
  --w-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.45);
  --btn-red:linear-gradient(135deg,#FF4A4F 0%,#E8141F 55%,#C80F1A 100%); --btn-red-glow:rgba(255,60,70,.42); --on-btn:#FFFFFF;
  --on-roj:#2A1E00; --on-dicle:#06210F; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--shade)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:750}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
a{color:var(--dicle)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dicle);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--muted)}
.eyebrow{font:600 .72rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ku{font-weight:650}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.side{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-right-color:var(--glass-line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font:800 1.25rem/1 var(--font-display);letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.nav a span{display:flex;flex-direction:column;line-height:1.15}
.nav a em{font-style:normal;font-size:.74rem;color:var(--muted)}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--hinar-soft);color:var(--hinar);font-weight:650}
.nav a[aria-current="page"] em{color:var(--hinar)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 8px}
.main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 96px;min-width:0}
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head p{color:var(--muted);max-width:62ch}
.bottom{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:18px 110px}
  .bottom{display:flex;position:fixed;left:max(12px,calc(50% - 300px));right:max(12px,calc(50% - 300px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;padding:6px;border-radius:28px;background:var(--surface);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--glass-line);box-shadow:0 10px 32px -6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.25)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.7rem;text-decoration:none;color:var(--muted);border-radius:22px;transition:background .2s,color .2s}
  .bottom a[aria-current="page"]{color:var(--hinar);background:color-mix(in srgb,var(--hinar-soft) 85%,transparent);font-weight:650}
  .bottom svg{width:22px;height:22px}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card{background:color-mix(in srgb,var(--surface) 88%,transparent);border-color:var(--glass-line);box-shadow:var(--w-shadow);border-radius:18px}
.panel{background:var(--sunk);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.lv{font-family:var(--font-mono);background:var(--dicle-soft);color:var(--dicle)}
.pill.hot{background:var(--hinar-soft);color:var(--hinar)}
.pill.gold{background:var(--roj-soft);color:var(--roj-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .08s ease,background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--hinar);border-color:var(--hinar);color:var(--on-hinar)}
.btn.primary{background:var(--btn-red);border-color:transparent;color:var(--on-btn);text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 8px 20px -8px var(--btn-red-glow),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover{filter:brightness(1.07) saturate(1.1)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 4px 12px -6px var(--btn-red-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.big{padding:14px 22px;font-size:1.05rem;border-radius:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:9px}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.greet{font:800 clamp(2.2rem,6vw,3.6rem)/1 var(--font-display);letter-spacing:-.03em}
.greet span{color:var(--hinar)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:750 1.55rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}
.ring{--p:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--roj) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring i{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:750 1rem/1.1 var(--font-display);font-style:normal;text-align:center}
.ring i small{display:block;font:500 .66rem var(--font-body);color:var(--muted)}

/* Bridge */
.bridge-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bridge{width:100%;min-width:540px;height:auto;display:block}
.bridge .arch{fill:var(--sunk);stroke:var(--line);stroke-width:1.5;transition:fill .6s}
.bridge .arch.on{fill:var(--hinar)}
.bridge .arch.half{fill:var(--hinar-soft)}
.bridge .deck{fill:var(--ink)}
.bridge .water{fill:var(--dicle);opacity:.18}
.bridge .wave{fill:none;stroke:var(--dicle);stroke-width:1.5;opacity:.5}
.bridge text{font:600 11px var(--font-mono);fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bridge .wave{animation:drift 6s linear infinite}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}

/* Path */
.level{display:flex;flex-direction:column;gap:12px}
.level-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.level-head h2{font-size:1.6rem}
.level-head .lv-code{font:800 2.2rem/1 var(--font-display);color:var(--hinar)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.lesson{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.lesson:hover{border-color:var(--hinar)}
.lesson .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .9rem var(--font-mono);background:var(--sunk);flex:none}
.lesson.done .num{background:var(--hinar);color:var(--on-hinar)}
.lesson.locked{opacity:.55;cursor:not-allowed}
.lesson.locked:hover{border-color:var(--line)}
.lesson.next{border-color:var(--hinar);box-shadow:0 0 0 3px var(--hinar-soft)}
.lesson .t{font-weight:650;line-height:1.25}
.lesson .s{font-size:.82rem;color:var(--muted)}
.stars{color:var(--roj-ink);font-size:.85rem;letter-spacing:1px;white-space:nowrap}

/* Lesson player overlay */
.player{position:fixed;inset:0;z-index:50;background:var(--shade),var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.player-top{display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,32px);max-width:860px;width:100%;margin:0 auto}
.bar{flex:1;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hinar);border-radius:99px;transition:width .35s ease}
.player-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.player-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.player-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.player-foot .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.player-foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.player-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{flex:1;min-width:200px}
.fb b{font-family:var(--font-display);font-size:1.15rem}
.player-foot.ok .fb b{color:var(--ok)}
.player-foot.bad .fb b{color:var(--bad)}
.combo{font:700 .85rem var(--font-mono);color:var(--roj-ink);white-space:nowrap}
.prompt{font:750 clamp(1.3rem,3.4vw,1.75rem)/1.25 var(--font-display)}
.prompt-sub{color:var(--muted)}
.theory{line-height:1.65}
.theory h4{font-size:1.05rem;margin:14px 0 6px}
.theory p{margin:0 0 10px;max-width:68ch}
.theory ul{margin:0 0 10px;padding-left:20px}
.tbl{overflow-x:auto;margin:6px 0 12px}
.tbl table{border-collapse:collapse;min-width:100%;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.ex{background:var(--sunk);border-radius:10px;padding:10px 14px;margin:6px 0 12px}
.ex div{display:flex;gap:10px;flex-wrap:wrap}
.ex .k{font-weight:650}
.ex .d{color:var(--muted)}
.dialect{border:1.5px dashed var(--dicle);border-radius:12px;padding:12px 14px;background:var(--dicle-soft)}
.dialect .eyebrow{color:var(--dicle)}

/* morphology colouring */
.m-pre{color:var(--dicle);font-weight:700}
.m-end{color:var(--hinar);font-weight:700}
.m-erg{color:var(--roj-ink);font-weight:700}

/* Vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.vcard .k{font:700 1.12rem var(--font-display)}
.vcard .ph{font:500 .74rem var(--font-mono);color:var(--muted)}
.vcard .tip{font-size:.8rem;color:var(--dicle)}
.dialog{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--font-mono);flex:none;background:var(--dicle-soft);color:var(--dicle)}
.line.b .who{background:var(--hinar-soft);color:var(--hinar)}
.line .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.line .tr{font-size:.85rem;color:var(--muted)}

/* Exercises */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-size:1.02rem;font-weight:600;display:flex;gap:10px;align-items:center}
.choice kbd{font:600 .72rem var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.choice:hover{border-color:var(--dicle)}
.choice.sel{border-color:var(--dicle);background:var(--dicle-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer-line{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:11px;padding:7px 13px;font-weight:650;cursor:pointer;font-size:1rem}
.tile:hover{border-color:var(--dicle)}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pair{background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;font-weight:600;text-align:center;overflow-wrap:anywhere}
.pair.sel{border-color:var(--dicle);background:var(--dicle-soft)}
.pair.done{opacity:.35;cursor:default;border-color:var(--ok)}
.pair.shake{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inp{width:100%;font:600 1.15rem var(--font-body);padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--dicle);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{min-width:40px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:700 1rem var(--font-body);cursor:pointer}
.keys button:hover{background:var(--sunk)}
.gapsent{font:650 1.3rem/1.6 var(--font-display)}
.gapsent .gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--dicle);text-align:center;color:var(--dicle);padding:0 6px}
.result{text-align:center;align-items:center}
.result .big{font:800 3.4rem/1 var(--font-display);color:var(--hinar)}

/* Flashcards */
